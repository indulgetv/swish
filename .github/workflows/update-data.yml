name: Update SWISH data

on:
  schedule:                       # all times UTC (= UK time in winter, UK minus 1h in summer)
    - cron: "17 7 * * *"          # full: after last night's games finish
    - cron: "17 14 * * *"         # full: afternoon refresh (rosters, logs, injuries)
    - cron: "37 14 * * *"         # odds early: only games tipping before 21:30 (weekend/holiday matinees)
    - cron: "7 21 * * *"          # odds main: every game not started yet — most lines + injury news are out by now
    - cron: "47 15-20 * * *"      # light: scores + injuries hourly through the afternoon
    - cron: "25-45/5 19 * * *"    # light: every 5 min, 19:25–19:45 — the gap between the afternoon loop (ends ~19:20) and the evening loop (starts 19:50)
    - cron: "27,47 21 * * *"      # light: every 20 min in the run-up to tip-off…
    - cron: "7,27,47 22-23 * * *"
    - cron: "7,27,47 0-2 * * *"   # …and through the games
    - cron: "47 3 * * *"          # light: last check for late West Coast games
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      mode:
        description: "auto (picks by time of day), full, light or odds"
        default: "auto"
        required: true
      window:
        description: "odds only: all, early or late"
        default: "late"
        required: false
      max_events:
        description: "odds only: max games to price (blank = budget decides)"
        default: ""
        required: false

permissions:
  contents: write

concurrency:
  group: swish-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Choose mode
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then MODE=full; fi
          fi
          if [ -z "$MODE" ]; then MODE=auto; fi      # schedules: the script picks full / odds / light by time of day
          WINDOW="${WINDOW:-${{ github.event.inputs.window }}}"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "window=${WINDOW:-late}" >> "$GITHUB_OUTPUT"
          echo "Running in $MODE mode"

      - name: Fetch data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          ARGS="--mode ${{ steps.mode.outputs.mode }} --window ${{ steps.mode.outputs.window }}"
          if [ -n "${{ github.event.inputs.max_events }}" ]; then ARGS="$ARGS --max-events ${{ github.event.inputs.max_events }}"; fi
          mkdir -p data
          python scripts/update.py $ARGS 2>&1 | tee data/last-run.log || true

      - name: Save if changed
        run: |
          git config user.name  "swish-bot"
          git config user.email "swish-bot@users.noreply.github.com"
          git add data/
          # only the run log changed (e.g. a backup timer stood down) → nothing to save
          if git diff --cached --quiet -- . ':(exclude)data/last-run.log'; then
            echo "No data changes."
          else
            git commit -m "data: ${{ steps.mode.outputs.mode }} update $(date -u +'%Y-%m-%d %H:%M UTC')"
            # another update may have saved at the same moment: retry a few times instead of failing
            for i in 1 2 3 4 5; do
              # -X theirs: if another update saved the same file meanwhile, this run's fresh data wins (the next 5-min
              # update refreshes anything it overwrote) — plain retries can't get past a real file conflict
              if git pull --rebase -X theirs --autostash origin "${GITHUB_REF_NAME}" && git push; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 7))
            done
            exit 1
          fi
