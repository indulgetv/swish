name: Update SWISH data

on:
  schedule:
    - cron: "17 7 * * *"        # full: after last night's games finish (07:17 UTC)
    - cron: "17 14 * * *"       # full: afternoon refresh before the slate (14:17 UTC)
    - cron: "37 16 * * *"       # odds: once a day, inside the free credit budget (16:37 UTC)
    - cron: "47 15-23 * * *"    # light: scores + injuries every hour on game evenings
    - cron: "47 0-3 * * *"      # light: continues past midnight UTC
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      mode:
        description: "full, light or odds"
        default: "full"
        required: true
      max_events:
        description: "odds only: max games to price (blank = budget decides)"
        default: ""
        required: false

permissions:
  contents: write

concurrency:
  group: swish-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Choose mode
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then MODE=full; fi
          fi
          if [ -z "$MODE" ]; then
            case "${{ github.event.schedule }}" in
              "17 7 * * *"|"17 14 * * *") MODE=full ;;
              "37 16 * * *") MODE=odds ;;
              *) MODE=light ;;
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Running in $MODE mode"

      - name: Fetch data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          ARGS="--mode ${{ steps.mode.outputs.mode }}"
          if [ -n "${{ github.event.inputs.max_events }}" ]; then ARGS="$ARGS --max-events ${{ github.event.inputs.max_events }}"; fi
          mkdir -p data
          python scripts/update.py $ARGS 2>&1 | tee data/last-run.log || true

      - name: Save if changed
        run: |
          git config user.name  "swish-bot"
          git config user.email "swish-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data: ${{ steps.mode.outputs.mode }} update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi
