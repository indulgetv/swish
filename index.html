<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<script>try{var d=localStorage.getItem("swish.pref.dark");if(d==="1"||(d===null&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("dark")}catch(e){}</script>
<title>swish · NBA Prop Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Unbounded:wght@400;600;800&family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,900&display=swap" rel="stylesheet">
<style>
/* =================================================================
   SWISH — Stage 1.4 · sidebar layout · white & red · squad view
   Static HTML · sample data only
   ================================================================= */
:root{
  --bg:#f6f7f9; --white:#ffffff; --surface2:#fafbfc; --sunk:#f1f3f6; --sunk2:#e8ebef;
  --line:#e5e8ec; --line2:#d3d8de;
  --ink:#121417; --ink2:#3d434b; --muted:#6c747f; --faint:#a1a8b2;
  --red:#b3121f; --red-dark:#8f0e18; --red-soft:#fdeff0; --red-line:#f1c6ca;
  --over:#0b7d52; --over-soft:#e8f6ef;
  --under:#2453cf; --under-soft:#ebf0fc;
  --amber:#a35a06; --amber-soft:#fdf4e4; --amber-line:#f1d7a8;
  --orange:#c2410c; --orange-soft:#fdefe7;
  --r:14px; --r-sm:9px;
  --shadow:0 1px 2px rgba(18,20,23,.04),0 4px 14px rgba(18,20,23,.04);
  --shadow-h:0 2px 4px rgba(18,20,23,.05),0 10px 28px rgba(18,20,23,.08);
  --display:'Barlow Condensed','Arial Narrow',sans-serif;
  --sans:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.r{text-align:right}

/* ---------------- Shell ---------------- */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:26px 16px;border-right:1px solid var(--line);background:var(--white);display:flex;flex-direction:column}
.brand{padding:2px 10px 28px}
.wordmark{display:inline-block;font:italic 900 34px/1 var(--sans);letter-spacing:-.045em;color:var(--ink);transform:skewX(-4deg);padding-right:4px}
.brand small{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--muted);letter-spacing:.09em;margin-top:7px;font-weight:600}
.brand small::before{content:"";width:14px;height:3px;border-radius:2px;background:var(--red)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{white-space:nowrap;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--ink2);font-weight:500;text-align:left;transition:background .15s var(--ease),color .15s var(--ease)}
.nav button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;opacity:.75}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button.on{background:var(--red-soft);color:var(--red);font-weight:700}
.nav button.on svg{opacity:1}
.nav .count{margin-left:auto;font-size:11.5px;color:var(--faint);font-weight:600}
.nav button.on .count{color:var(--red)}
.nav .count.alert{color:#fff;background:var(--red);border-radius:99px;padding:1px 7px}
.side-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.55}
.side-foot b{color:var(--ink2);font-weight:600}
.main{min-width:0}
.top{display:flex;align-items:center;gap:14px;padding:15px 40px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.92);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20}
.crumb{font-weight:600}
.crumb span{color:var(--faint);font-weight:500;margin:0 6px}
.sample-pill{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber-line);padding:5px 10px;border-radius:99px}
.sample-pill i{width:6px;height:6px;border-radius:50%;background:#e08a0b}
.sample-pill.live-pill{color:#1f8a4c;background:rgba(31,138,76,.09);border-color:rgba(31,138,76,.28)}
.sample-pill.live-pill i{background:#1f8a4c;box-shadow:0 0 0 3px rgba(31,138,76,.18)}
.notice.live{border-color:rgba(31,138,76,.28);background:rgba(31,138,76,.06)}
.notice.live b{color:#1f8a4c}
.pform{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:6px}
.pform label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
.pform input{font:inherit;font-size:15px;font-variant-numeric:tabular-nums;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--white);color:var(--ink);min-width:0}
.pform input:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.pform-act{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.pform-msg{font-size:12.5px;color:var(--red);min-height:1em}
.cell.noline b{color:var(--faint)}
.cell.noline small{color:var(--muted)}
details.optprice summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);padding:4px 0}
details.optprice summary::-webkit-details-marker{display:none}
details.optprice summary::before{content:"+";display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--line2);font-size:13px;line-height:1}
details.optprice[open] summary::before{content:"−"}
details.optprice summary:hover{color:var(--ink)}
@media (max-width:520px){.pform{grid-template-columns:1fr 1fr}}
.top-right{margin-left:auto}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{padding:5px 11px;border-radius:6px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--white);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.page{padding:32px 40px 70px;max-width:1440px}

/* ---------------- Type & common ---------------- */
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1.title{font:700 42px/1.02 var(--display);letter-spacing:.005em;margin-top:6px}
.lede{color:var(--ink2);margin-top:6px;font-size:15px}
h2.h{font:700 22px/1.1 var(--display);letter-spacing:.01em}
.sub{color:var(--muted);font-size:13px}
.notice{margin:20px 0 24px;padding:12px 16px;border-radius:var(--r-sm);background:var(--white);border:1px solid var(--line);border-left:3px solid var(--red);font-size:13px;color:var(--ink2)}
.notice b{color:var(--ink)}
.panel{background:var(--white);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.panel-h{display:flex;align-items:center;gap:12px;padding:16px 20px 12px}
.panel-h .sub{margin-left:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:9px;border:1px solid var(--line2);background:var(--white);font-weight:600;font-size:13px;transition:border-color .15s var(--ease),background .15s var(--ease);white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red:hover{background:var(--red-dark)}
.gempty{padding:20px;color:var(--muted);font-size:13px;text-align:center}
.tid{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;flex-shrink:0;font:700 10px/1 var(--sans);color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.tid.sm{width:22px;height:22px;font-size:8.5px}
.tid.lg{width:40px;height:40px;font-size:12px}
.pos{color:var(--over)} .neg{color:var(--faint)} .negr{color:var(--red)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.st.out{color:#fff;background:var(--red)}
.st.doubtful{color:var(--orange);background:var(--orange-soft)}
.st.questionable{color:var(--amber);background:var(--amber-soft)}
.st.probable{color:var(--over);background:var(--over-soft)}
.st.neutral{color:var(--muted);background:var(--sunk)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--ink2);background:var(--sunk);border-radius:7px;padding:4px 9px;white-space:nowrap}
.tag.red{color:var(--red);background:var(--red-soft)}
.tag.amber{color:var(--amber);background:var(--amber-soft)}
.matchup{display:flex;align-items:center;gap:14px}
.matchup .tm{display:flex;align-items:center;gap:10px}
.matchup .tm b{font:700 21px/1 var(--display);letter-spacing:.01em}
.matchup .tm small{display:block;font:500 11.5px var(--sans);color:var(--muted);margin-top:3px}
.matchup .at{font:700 14px var(--display);color:var(--faint)}

/* ---------------- Dashboard ---------------- */
.overview{display:grid;grid-template-columns:repeat(5,1fr);background:var(--white);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:28px}
.ov{padding:16px 20px;border-left:1px solid var(--line)}
.ov:first-child{border-left:0}
.ov .v{font:700 34px/1 var(--display);margin-top:8px}
.ov .v.red{color:var(--red)}
.ov .s{font-size:12px;color:var(--muted);margin-top:4px}
.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:22px;align-items:start}
.mrow{display:grid;grid-template-columns:92px 1fr auto 16px;gap:16px;align-items:center;width:100%;padding:13px 20px;border-top:1px solid var(--line);text-align:left;transition:background .15s var(--ease)}
.mrow:hover{background:var(--surface2)}
.mrow .t{font:700 19px/1 var(--display)}
.mrow .t small{display:block;font:500 11px var(--sans);color:var(--faint);margin-top:4px}
.ti{display:flex;align-items:center;gap:9px;font-weight:600;margin:3px 0}
.ti small{color:var(--faint);font-weight:500;font-size:12px}
.mrow .meta{font-size:12px;color:var(--muted);text-align:right}
.mrow .meta b{display:block;color:var(--ink);font-size:13px}
.mrow .meta .inj{color:var(--red);font-weight:600}
.arrow{color:var(--faint)}
.irow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 20px;border-top:1px solid var(--line);text-align:left;transition:background .15s var(--ease)}
.irow:hover{background:var(--surface2)}
.irow .nm{font-weight:600}
.irow .ds{font-size:12px;color:var(--muted)}
.irow .st{margin-left:auto}

/* ---------------- Pick lists (dashboard + best picks) ---------------- */
.tabs{display:flex;gap:4px;padding:0 16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{padding:11px 10px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--red);border-bottom-color:var(--red)}
.tabs button .c{font-size:11px;color:var(--faint);margin-left:4px}
.tabdesc{padding:10px 20px;font-size:12px;color:var(--muted);background:var(--surface2);border-bottom:1px solid var(--line)}
.plist-h,.prow2{display:grid;grid-template-columns:28px minmax(160px,1.5fr) minmax(150px,1.3fr) 58px 60px 66px 128px 108px 16px;gap:12px;align-items:center;padding:0 20px}
.plist-h{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-top:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.prow2{width:100%;text-align:left;padding-top:10px;padding-bottom:10px;border-bottom:1px solid var(--line);transition:background .12s var(--ease)}
.prow2:last-child{border-bottom:0}
.prow2:hover{background:var(--surface2)}
.prow2 .rk{font:700 16px var(--display);color:var(--red)}
.prow2 .pl{display:flex;align-items:center;gap:9px;min-width:0}
.prow2 .pl b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow2 .pl small{font-size:11.5px;color:var(--muted)}
.pick{font-weight:700;font-size:13.5px}
.pick small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.pick .o{color:var(--over)} .pick .u{color:var(--under)}
.prow2 .n{font:700 17px var(--display);text-align:right}
.prow2 .n small{display:block;font:500 10.5px var(--sans);color:var(--faint)}
.prow2 .chev2{color:var(--faint)}
.minibar{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.minibar b{font:700 17px var(--display);text-align:right}
.minibar .tr{height:4px;border-radius:9px;background:var(--sunk2);position:relative}
.minibar .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:9px}

/* ---------------- Props page: toolbar ---------------- */
.toolbar{position:sticky;top:62px;z-index:10;display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 0;margin:6px 0 0;background:var(--bg);border-bottom:1px solid var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:99px;border:1px solid var(--line2);background:var(--white);font-size:12.5px;font-weight:600;color:var(--ink2);transition:.15s var(--ease)}
.chip:hover{border-color:var(--ink2)}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{display:flex;align-items:center;gap:7px;background:var(--white);border:1px solid var(--line2);border-radius:9px;padding:0 11px;height:36px}
.field:focus-within{border-color:var(--ink2)}
.field svg{width:15px;height:15px;stroke:var(--faint);fill:none;stroke-width:2}
.field input,.field select{border:0;outline:0;background:none;font:500 13px var(--sans);color:var(--ink);height:100%}
.field input{width:170px}
.field select{cursor:pointer}
.subtools{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0 16px;flex-wrap:wrap}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend .cellx{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:46px;height:34px;border:1px solid var(--line);border-radius:7px;background:var(--white);line-height:1.1}
.legend .cellx b{font:700 14px var(--display);color:var(--ink)}
.legend .cellx small{font-size:10px;font-weight:700;color:var(--over)}
.legend .sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.check{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2);font-weight:500;cursor:pointer;user-select:none}
.check input{accent-color:var(--red)}
.textbtn{font-size:12.5px;font-weight:600;color:var(--red);padding:5px 6px;border-radius:7px}
.textbtn:hover{background:var(--red-soft)}

/* ---------------- Game section ---------------- */
.gsec{background:var(--white);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden;scroll-margin-top:130px}
.gsec-h{display:grid;grid-template-columns:auto 1fr auto 30px;gap:20px;align-items:center;width:100%;padding:14px 20px;text-align:left;transition:background .15s var(--ease);border-bottom:1px solid var(--line)}
.gsec-h:hover{background:var(--surface2)}
.gsec.collapsed .gsec-h{border-bottom:0}
.gtags{display:flex;gap:6px;flex-wrap:wrap}
.gcount{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.gcount b{color:var(--ink);font-weight:700}
.gcount .v{display:block;color:var(--red);font-weight:700}
.chev{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--line);transition:transform .2s var(--ease)}
.chev svg{width:14px;height:14px;stroke:var(--ink2);fill:none;stroke-width:2.2}
.gsec.collapsed .chev{transform:rotate(-90deg)}
.gwrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows .42s var(--ease)}
.gwrap > .gbody{min-height:0;overflow:hidden}
.gsec.collapsed .gwrap{grid-template-rows:0fr}
.gbody{display:grid;grid-template-columns:1fr 1fr}
.gbody.single{grid-template-columns:1fr}
.squad{min-width:0;border-left:1px solid var(--line)}
.squad:first-child{border-left:0}
.gbody.single .squad{border-left:0;border-top:1px solid var(--line)}
.gbody.single .squad:first-child{border-top:0}
.sq-h{display:flex;align-items:center;gap:9px;padding:12px 16px;background:var(--surface2);border-bottom:1px solid var(--line)}
.sq-h b{font:700 16px/1 var(--display);letter-spacing:.05em;text-transform:uppercase}
.sq-h .sub{margin-left:auto;font-size:11.5px}

/* squad matrix (all markets) */
.sqt{width:100%;border-collapse:collapse;table-layout:fixed}
.sqt th{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:8px 4px;border-bottom:1px solid var(--line);text-align:center}
.sqt th:first-child{text-align:left;padding-left:16px;width:auto}
.sqt th.min{width:44px}
.sqt th.mk{width:62px}
.sqt td{padding:4px 3px;border-bottom:1px solid var(--line);vertical-align:middle;text-align:center}
.sqt tr:last-child td{border-bottom:0}
.sqt td.pl{text-align:left;padding:7px 6px 7px 16px}
.sqt td.pl b{display:block;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sqt td.pl small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sqt td.pl small.boost{color:var(--over);font-weight:600}
.sqt td.pl small.warn{color:var(--amber);font-weight:600}
.sqt td.min{font:600 14px var(--display);color:var(--ink2)}
.sqt td.min.up{color:var(--over)}
.sqt tr.out td{background:repeating-linear-gradient(135deg,#fff,#fff 6px,#fafafa 6px,#fafafa 12px)}
.sqt tr.out td.pl b{color:var(--muted);text-decoration:line-through}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:40px;border:1px solid transparent;border-radius:7px;line-height:1.1;transition:background .12s var(--ease),border-color .12s var(--ease);position:relative}
.cell:hover{background:var(--sunk);border-color:var(--line2)}
.cell b{font:700 16px var(--display)}
.cell small{font-size:10.5px;font-weight:700;margin-top:2px;white-space:nowrap}
.cell small.over{color:var(--over)} .cell small.under{color:var(--under)} .cell small.none{color:var(--faint)}
.cell.value{background:var(--red-soft);border-color:var(--red-line)}
.cell.value::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--red)}
.cell.value:hover{border-color:var(--red)}
.cell.flagged b{color:var(--faint)}
.cell.flagged small{color:var(--amber)}
.dash{color:var(--line2);font-weight:600}

/* single-market table */
.smt-h,.smt-r{display:grid;grid-template-columns:minmax(160px,1.5fr) 44px 60px 66px 66px 64px minmax(150px,1fr) 108px 150px 56px 16px;gap:10px;align-items:center;padding:0 16px}
.smt-h{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-top:9px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.smt-r{width:100%;text-align:left;padding-top:9px;padding-bottom:9px;border-bottom:1px solid var(--line);transition:background .12s var(--ease);position:relative}
.smt-r:last-child{border-bottom:0}
.smt-r:hover{background:var(--surface2)}
.smt-r.value::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--red)}
.smt-r .pl b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.smt-r .pl small{font-size:11px;color:var(--muted)}
.smt-r .pl small.warn{color:var(--amber);font-weight:600}
.smt-r .pl small.boost{color:var(--over);font-weight:600}
.smt-r .big{font:700 19px var(--display);text-align:right}
.smt-r .proj{color:var(--red)}
.smt-r .odd{text-align:right}
.smt-r .odd span{display:inline-block;font:600 15px var(--display);padding:2px 6px;border-radius:5px;color:var(--ink2)}
.smt-r .odd.lo span{background:var(--over-soft);color:var(--over);font-weight:700}
.smt-r .odd.lu span{background:var(--under-soft);color:var(--under);font-weight:700}
.smt-r .edge{font:700 16px var(--display);text-align:right}
.smt-r.value .edge{color:var(--red)}
.smt-r .mins{font:600 14px var(--display);text-align:right;color:var(--ink2)}
.smt-r .mins.up{color:var(--over)}

/* ---------------- Drawer ---------------- */
.scrim{position:fixed;inset:0;background:rgba(18,20,23,.28);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--white);z-index:60;box-shadow:-12px 0 40px rgba(18,20,23,.14);transform:translateX(100%);transition:transform .25s var(--ease);overflow-y:auto}
.drawer.on{transform:none}
.dr-h{position:sticky;top:0;background:var(--white);display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line);z-index:2}
.dr-h .av{width:40px;height:40px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--ink2)}
.dr-h b{display:block;font-size:17px;font-weight:700}
.dr-h small{font-size:12.5px;color:var(--muted)}
.dr-h .x{margin-left:auto;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;font-size:18px;color:var(--ink2)}
.dr-h .x:hover{border-color:var(--ink2)}
.dr-b{padding:18px 22px 40px}
.dr-mk{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.dr-mk b{font:700 20px var(--display);letter-spacing:.04em;text-transform:uppercase}
.bignums{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.bignums div{padding:12px 10px;text-align:center;border-left:1px solid var(--line)}
.bignums div:first-child{border-left:0;background:var(--surface2)}
.bignums span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bignums b{display:block;font:700 38px/1 var(--display);margin:6px 0 3px}
.bignums small{font-size:11px;color:var(--faint)}
.bignums .proj{color:var(--red)}
.diff.up{color:var(--over)} .diff.down{color:var(--under)} .diff.flat{color:var(--faint)}
.oddsrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.ob{border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;position:relative}
.ob .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ob .pr{font:700 26px/1 var(--display)}
.ob.lo{border-color:var(--over);background:var(--over-soft)} .ob.lo .lbl{color:var(--over)}
.ob.lu{border-color:var(--under);background:var(--under-soft)} .ob.lu .lbl{color:var(--under)}
.ob .flag{position:absolute;top:-9px;left:10px;font-size:9.5px;font-weight:800;letter-spacing:.08em;padding:2px 7px;border-radius:99px;color:#fff;text-transform:uppercase}
.ob.lo .flag{background:var(--over)} .ob.lu .flag{background:var(--under)}
.probwrap{margin-top:16px}
.probtop{display:flex;align-items:baseline;justify-content:space-between}
.probtop span{font-size:13px;color:var(--ink2);font-weight:600}
.probtop b{font:700 28px/1 var(--display)}
.pbar{position:relative;height:9px;border-radius:99px;background:var(--sunk2);margin-top:8px}
.pbar i{display:block;height:100%;border-radius:99px}
.pbar .mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:2px}
.pbar-l{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:6px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.trio div{background:var(--sunk);border-radius:10px;padding:8px 10px}
.trio span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.trio b{font:700 21px/1.15 var(--display)}
.pnote{margin-top:12px;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.45}
.pnote.warn{background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber-line)}
.pnote.info{background:var(--sunk);color:var(--ink2)}
.dsec{margin-top:22px}
.dt{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.build{border:1px solid var(--line);border-radius:11px;overflow:hidden}
.build .st2{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-top:1px solid var(--line);font-size:13px}
.build .st2:first-child{border-top:0}
.build .st2 span{color:var(--ink2);font-weight:500}
.build .st2 small{display:block;color:var(--faint);font-size:11px}
.build .st2 b{font:700 19px var(--display)}
.build .st2.total{background:var(--red);color:#fff}
.build .st2.total span{color:#fff;font-weight:600}
.build .st2.total b{font-size:23px}
.build .st2.na b{color:var(--faint);text-decoration:line-through}
.kv{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.kv b{font-weight:600}
.hlist{display:flex;flex-direction:column;gap:6px}
.hl{display:grid;grid-template-columns:84px 1fr 40px;align-items:center;gap:10px;font-size:12.5px}
.hl span{color:var(--muted)}
.hl .bar{height:8px;border-radius:99px;background:var(--sunk2);position:relative}
.hl .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--line2)}
.hl .bar i.hit{background:var(--ink)}
.hl .bar .ln{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--red)}
.hl b{text-align:right;font:700 17px var(--display)}
.spark{position:relative;height:66px;display:flex;align-items:flex-end;gap:5px;padding-top:6px}
.spark i{flex:1;border-radius:3px 3px 0 0;min-height:3px;background:var(--line2)}
.spark i.hit{background:var(--ink)}
.spark .ln{position:absolute;left:0;right:0;border-top:2px dashed var(--red)}
.spark-x{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:6px}
.dnote{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.5}
.others{display:flex;flex-wrap:wrap;gap:6px}
.others button{font-size:12px;font-weight:600;padding:5px 9px;border-radius:7px;border:1px solid var(--line);background:var(--white)}
.others button:hover{border-color:var(--ink2)}
.others button.value{border-color:var(--red-line);background:var(--red-soft);color:var(--red)}

/* ---------------- Games & Analysis ---------------- */
.ana{background:var(--white);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-top:20px;overflow:hidden}
.ana-h{display:flex;align-items:center;gap:18px;padding:16px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ana-h .right{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ana-b{display:grid;grid-template-columns:1.05fr 1fr 1.1fr}
.ana-b > div{padding:18px 22px;border-left:1px solid var(--line)}
.ana-b > div:first-child{border-left:0}
.rec{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.rec b{font:700 30px/1 var(--display)}
.rec span{font-size:12.5px;color:var(--muted)}
.mtg{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.mtg .d{color:var(--muted);font-size:12px}
.mtg .sc{display:flex;gap:7px;align-items:center;font-weight:600}
.mtg .sc b{font:700 17px var(--display)}
.mtg .sc .w{color:var(--ink)} .mtg .sc .l{color:var(--faint)}
.mtg .tot{font-size:12px;color:var(--muted);text-align:right}
.insight{margin-top:10px;padding:10px 12px;border-radius:9px;background:var(--sunk);font-size:12.5px;color:var(--ink2)}
.insight b{color:var(--ink)}
.cmp-h,.cmp{display:grid;grid-template-columns:1fr 92px 1fr;gap:10px;align-items:center}
.cmp-h{margin-bottom:4px}
.cmp-h div{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13px}
.cmp-h div:first-child{justify-content:flex-end}
.cmp{padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.cmp .lab{text-align:center;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cmp .a{text-align:right}
.cmp b{font:700 18px var(--display);color:var(--ink2)}
.cmp b.better{color:var(--red)}
.notes{list-style:none;display:flex;flex-direction:column;gap:8px}
.notes li{position:relative;padding-left:15px;font-size:13px;color:var(--ink2);line-height:1.5}
.notes li::before{content:"";position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:2px;background:var(--red)}
.ptrend{display:grid;grid-template-columns:1fr auto 48px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13px;width:100%;text-align:left}
.ptrend:hover .nm{color:var(--red)}
.ptrend .nm{font-weight:600}
.ptrend small{display:block;color:var(--muted);font-size:11.5px}
.ptrend b{font:700 18px var(--display);text-align:right}
.ptrend .vs{font-size:11.5px;color:var(--muted);text-align:right}

/* ---------------- Injuries ---------------- */
.ij{background:var(--white);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-top:18px;overflow:hidden}
.ij-h{display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ij-h .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.lineup{padding:9px 22px;background:var(--amber-soft);border-bottom:1px solid var(--amber-line);font-size:12.5px;color:var(--amber)}
.lineup b{font-weight:700}
.ij-b{display:grid;grid-template-columns:1fr 1fr}
.ij-b > div{padding:16px 22px 20px;border-left:1px solid var(--line)}
.ij-b > div:first-child{border-left:0}
.ij-team{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.ij-team b{font:700 16px/1 var(--display);letter-spacing:.05em;text-transform:uppercase}
.injc{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:10px}
.injc.out{border-color:var(--red-line)}
.inj-top{display:flex;align-items:center;gap:11px;padding:11px 13px}
.inj-top .av{width:34px;height:34px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink2)}
.inj-top .nm{font-weight:700;font-size:14.5px}
.inj-top small{display:block;font-size:12px;color:var(--muted)}
.inj-top .st{margin-left:auto}
.inj-meta{padding:0 13px 10px 58px;font-size:11.5px;color:var(--faint)}
.fill{background:var(--surface2);border-top:1px solid var(--line);padding:10px 13px}
.fill .dt{margin-bottom:6px}
.fi{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:7px 0;border-top:1px dashed var(--line)}
.fill .dt + .fi{border-top:0}
.fi .nm{font-weight:600;font-size:13.5px}
.fi .mins{font:700 17px var(--display);text-align:right}
.fi .mins i{font-style:normal;color:var(--over)}
.fi .note{grid-column:1/-1;font-size:12px;color:var(--muted)}
.affects{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.affects button{font-size:11.5px;font-weight:600;color:var(--red);background:var(--white);border:1px solid var(--red-line);border-radius:7px;padding:3px 8px}
.affects button:hover{background:var(--red-soft)}
.noinj{padding:14px;border:1px dashed var(--line2);border-radius:12px;color:var(--muted);font-size:13px;text-align:center;margin-top:10px}
.legend2{display:flex;gap:8px;flex-wrap:wrap;margin:-6px 0 4px}

/* ---------------- Empty / results ---------------- */
.empty{background:var(--white);border:1px dashed var(--line2);border-radius:var(--r);padding:44px 28px;text-align:center;margin-top:18px}
.empty .ic{width:44px;height:44px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;margin:0 auto 12px}
.empty .ic svg{width:21px;height:21px;stroke:var(--muted);fill:none;stroke-width:1.7}
.empty h3{font:700 22px var(--display)}
.empty p{color:var(--muted);max-width:470px;margin:6px auto 0}
.empty .btn{margin-top:14px}
.rtable{margin-top:22px;background:var(--white);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rhead{display:grid;grid-template-columns:110px 1.6fr 1fr 80px 80px 90px 80px;gap:12px;padding:12px 22px;font-size:11px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line);background:var(--surface2);text-transform:uppercase;letter-spacing:.06em}
.rtable .empty{border:0;margin:0;border-radius:0}
footer{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.6;max-width:860px}

/* ---------------- Responsive ---------------- */
@media (max-width:1320px){
  .gbody{grid-template-columns:1fr}
  .squad{border-left:0;border-top:1px solid var(--line)}
  .squad:first-child{border-top:0}
}
@media (max-width:1180px){
  .overview{grid-template-columns:repeat(3,1fr)}
  .ov:nth-child(4){border-left:0} .ov:nth-child(n+4){border-top:1px solid var(--line)}
  .cols{grid-template-columns:1fr}
  .ana-b{grid-template-columns:1fr 1fr}
  .ana-b > div:nth-child(3){grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}
  .gsec-h{grid-template-columns:1fr auto 30px}
  .gtags{display:none}
  .plist-h{display:none}
  .prow2{grid-template-columns:24px 1fr 1fr 18px;row-gap:6px}
  .prow2 .hide-s{display:none}
}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;height:auto;flex-direction:row;align-items:center;padding:10px 16px;border-right:0;border-bottom:1px solid var(--line);z-index:30;top:0;overflow-x:auto}
  .brand{padding:0 16px 0 0} .wordmark{font-size:26px}
  .brand small,.side-foot,.nav .count:not(.alert){display:none}
  .nav{flex-direction:row}
  .top{top:58px;padding:12px 20px}
  .toolbar{position:static}
  .page{padding:24px 18px 60px}
  .ana-b,.ij-b{grid-template-columns:1fr}
  .ana-b > div,.ij-b > div{border-left:0;border-top:1px solid var(--line)}
  .ana-b > div:first-child,.ij-b > div:first-child{border-top:0}
  .gsec-h{grid-template-columns:1fr 30px;row-gap:8px}
  .gsec-h .matchup{grid-column:1/-1}
  .gcount{text-align:left}
  .smt-h{display:none}
  .smt-r{grid-template-columns:1fr 1fr 1fr;row-gap:8px}
  .smt-r .pl{grid-column:1/-1}
  .smt-r .chev2{display:none}
  .smt-r [data-l]{text-align:left}
  .smt-r [data-l]::before{content:attr(data-l);display:block;font:700 10px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
}
@media (max-width:640px){
  h1.title{font-size:34px}
  .overview{grid-template-columns:1fr 1fr}
  .ov:nth-child(odd){border-left:0} .ov:nth-child(4){border-left:1px solid var(--line)}
  .ov:nth-child(n+3){border-top:1px solid var(--line)}
  .tools{margin-left:0;width:100%} .field{flex:1} .field input{width:100%}
  .crumb,.sample-pill{display:none}
  .matchup .tm small{display:none} .matchup .tm b{font-size:18px}
  .mrow{grid-template-columns:66px 1fr auto} .mrow .arrow{display:none}
  .sqt th.mk{width:44px} .sqt th.min{width:28px}
  .sqt th{font-size:9.5px;padding:8px 2px}
  .cell{min-height:38px} .cell b{font-size:14px} .cell small{font-size:9px}
  .sqt td{padding:3px 1px}
  .sqt td.pl{padding:6px 4px 6px 10px}
  .sqt td.pl b{white-space:normal;font-size:12px;line-height:1.2}
  .sqt td.pl small{white-space:normal;font-size:10px;line-height:1.25}
  .sqt td.min{font-size:12px}
}

/* ================= Stage 1.5 polish ================= */
.brand{display:block;text-align:left;padding:2px 10px 26px;width:100%}
.logo{position:relative;display:inline-block;padding-right:16px;white-space:nowrap}
.wordmark{white-space:nowrap}
.wordmark i{font-style:inherit;display:inline-block;transition:transform .45s var(--ease),color .25s var(--ease);transition-delay:calc(var(--d) * 45ms);animation:rise .6s var(--ease) both;animation-delay:calc(var(--d) * 60ms + .1s)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.brand:hover .wordmark i{transform:translateY(-3px);color:var(--red)}
.ball{position:absolute;right:0;bottom:7px;width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:inset -2px -2px 0 rgba(0,0,0,.18);transform:scale(0)}
.ball::before,.ball::after{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,255,255,.55);clip-path:inset(0 45% 0 45%)}
.ball::after{clip-path:inset(45% 0 45% 0)}
.brand:hover .ball{animation:drop .9s var(--ease) forwards}
@keyframes drop{0%{transform:translate(-70px,-34px) scale(.6) rotate(0)}35%{transform:translate(-26px,-30px) scale(1) rotate(160deg)}62%{transform:translate(0,0) scale(1) rotate(300deg)}78%{transform:translate(2px,-9px) scale(1) rotate(340deg)}100%{transform:translate(0,0) scale(1) rotate(380deg)}}
.swoosh{position:absolute;left:-2px;right:12px;bottom:-9px;height:12px;width:calc(100% - 10px);fill:none;stroke:var(--red);stroke-width:3.2;stroke-linecap:round;stroke-dasharray:130;stroke-dashoffset:130;transition:stroke-dashoffset .55s var(--ease)}
.brand:hover .swoosh{stroke-dashoffset:0}
.brand small{margin-top:12px}
.brand small::before{transition:width .3s var(--ease)}
.brand:hover small::before{width:28px}
.brand:focus-visible{outline:2px solid var(--red);outline-offset:4px;border-radius:8px}

.nav button{position:relative}
.nav button::before{content:"";position:absolute;left:-16px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--red);transform:scaleY(0);transition:transform .22s var(--ease)}
.nav button.on::before{transform:scaleY(1)}
.nav button:hover{background:var(--red-soft);color:var(--red)}
.nav button svg{transition:transform .2s var(--ease),opacity .2s var(--ease)}
.nav button:hover svg{opacity:1;transform:translateX(2px)}
.nav button:hover .count{color:var(--red)}

.side-sec{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.side-lbl{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:0 12px 8px}
.sg{display:flex;align-items:center;gap:6px;width:100%;padding:7px 12px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--ink2);transition:background .15s var(--ease),color .15s var(--ease)}
.sg .tid{width:20px;height:20px;font-size:7px;transition:transform .2s var(--ease);flex-shrink:0}
.sg .tid + .vs + .tid{margin-left:-2px}
.sg .vs{color:var(--faint);font-size:10.5px}
.sg .nm{margin-left:4px;white-space:nowrap}
.sg .t{margin-left:auto;font-size:10.5px;color:var(--faint);font-weight:600;white-space:nowrap}
.sg:hover{background:var(--red-soft);color:var(--red)}
.sg:hover .t{color:var(--red)}
.sg:hover .tid{transform:scale(1.12)}

.crumb-home{font-weight:700;color:var(--ink);transition:color .15s var(--ease)}
.crumb-home:hover{color:var(--red)}

.hero{position:relative;overflow:hidden;background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:26px 30px 24px;box-shadow:var(--shadow);animation:heroIn .45s var(--ease) both}
.hero::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--red)}
.hero .eyebrow{color:var(--red)}
.hero .court{position:absolute;right:-30px;top:-6px;height:118%;width:auto;color:var(--red);opacity:.09;pointer-events:none;transition:opacity .4s var(--ease),transform .6s var(--ease)}
.hero:hover .court{opacity:.16;transform:rotate(-2deg) scale(1.02)}
@keyframes heroIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sechead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:34px 0 12px}
.sechead .eyebrow{color:var(--red)}

.btn{transition:border-color .18s var(--ease),color .18s var(--ease),background .18s var(--ease),transform .18s var(--ease),box-shadow .18s var(--ease)}
.btn:hover{border-color:var(--red);color:var(--red);transform:translateY(-1px);box-shadow:0 4px 14px rgba(179,18,31,.14)}

.flash::after{content:"";position:absolute;inset:0;background:linear-gradient(var(--flash),var(--flash)) center/2px 100% no-repeat,linear-gradient(var(--flash),var(--flash)) center/100% 2px no-repeat;transform:rotate(45deg);border-radius:2px}

.fsec{display:flex;align-items:baseline;gap:10px;margin:4px 0 8px}
.fsec span{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.fsec em{font-style:normal;font-size:11px;color:var(--muted)}
.fcards{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.fcard{position:relative;background:var(--white);border:1px solid var(--line);border-radius:11px;padding:10px 11px 9px;box-shadow:var(--inset);animation:fadeUp .4s var(--ease) both;animation-delay:calc(var(--k) * 50ms);transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s var(--ease);overflow:hidden}
.fcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-h);border-color:var(--line2)}
.fcard::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--line)}
.fcard.hot::before{background:var(--over)}
.fcard.cold::before{background:var(--under)}
.fcard.focus{border-color:var(--red);box-shadow:0 0 0 1px var(--red),var(--inset)}
.fk{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fv{font:700 30px/1 var(--display);margin-top:5px;color:var(--ink)}
.fv small{font:600 10.5px var(--sans);color:var(--faint);margin-left:4px;letter-spacing:.04em}
.fs{font-size:10.5px;margin-top:3px;font-weight:600;color:var(--muted);line-height:1.3}
.fs .tup{color:var(--over)} .fs .tdn{color:var(--under)} .fs .tr0{color:var(--faint)}
.fbars{position:relative;display:flex;align-items:flex-end;gap:3px;height:34px;margin:9px 0 7px;padding-bottom:1px;border-bottom:1px solid var(--line)}
.fbars i{flex:1;border-radius:3px 3px 1px 1px;background:var(--sunk2);transform-origin:bottom;animation:grow .5s var(--ease) both;animation-delay:calc(var(--k) * 50ms + .15s)}
.fbars i.o{background:var(--over)}
.fline{position:absolute;left:-2px;right:-2px;border-top:1.5px dashed var(--red);pointer-events:none}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.fl{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:4px;flex-wrap:wrap}
.formbox{text-align:left}
.fk{display:flex;justify-content:space-between;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.04em!important}
.fk span{font-weight:600;letter-spacing:.02em;text-transform:none;color:var(--faint)}
.fl b{color:var(--ink);font-weight:700}
.fl b.hc{color:var(--red)}
.fcard.hot .fl b.hc{color:var(--over)}
.ftable{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--white);box-shadow:var(--inset)}
.form{border:0;border-radius:0;box-shadow:none;font-size:13px}
.form th{padding:8px 6px;font-size:10px}
.form td{padding:6px;border-top:1px solid var(--line)}
.form tbody tr{animation:fadeUp .35s var(--ease) both;animation-delay:calc(var(--r) * 35ms + .1s);transition:background .15s var(--ease)}
.form tbody tr:hover td{background:var(--surface2)}
.form tbody tr:nth-child(even) td{background:rgba(127,127,127,.035)}
.form td.o{background:none;color:inherit}
.form .f{background:rgba(179,18,31,.045)!important}
.fopp{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink2)}
.tid.xs{width:18px;height:18px;font-size:6.5px;box-shadow:none}
.mn{color:var(--muted)}
.pill{display:inline-block;min-width:30px;padding:2px 6px;border-radius:6px;font-weight:700;color:var(--ink2)}
.pill.o{background:var(--over-soft);color:var(--over);box-shadow:inset 0 0 0 1px rgba(11,125,82,.18)}
.formnote{margin-top:8px}
@media (max-width:1320px){.fcards{grid-template-columns:repeat(5,minmax(0,1fr))}.fv{font-size:24px}}
@media (max-width:760px){.fcards{grid-template-columns:repeat(3,1fr)}.ftable{overflow-x:auto}.form{min-width:470px}}
@media (max-width:420px){.fcards{grid-template-columns:repeat(2,1fr)}}
.drawer .fcards{grid-template-columns:repeat(3,1fr)}
.drawer .ftable{overflow-x:auto}

/* --- theme button --- */
.themebtn{width:36px;height:36px;margin-right:8px;border-radius:9px;border:1px solid var(--line2);background:var(--white);display:grid;place-items:center;color:var(--ink2);transition:border-color .2s var(--ease),color .2s var(--ease),transform .3s var(--ease)}
.themebtn svg{grid-area:1/1;width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;transition:opacity .3s var(--ease),transform .4s var(--ease)}
.themebtn .moon{fill:currentColor;stroke:none}
.themebtn .sun{opacity:0;transform:rotate(-90deg) scale(.6)}
html.dark .themebtn .moon{opacity:0;transform:rotate(90deg) scale(.6)}
html.dark .themebtn .sun{opacity:1;transform:none}
.themebtn:hover{border-color:var(--red);color:var(--red)}

/* --- dark mode --- */
html.dark{color-scheme:dark;
  --bg:#141519; --white:#1c1f24; --surface2:#20242a; --sunk:#262a31; --sunk2:#30353d;
  --line:#2c3038; --line2:#3a3f49;
  --ink:#f3f4f6; --ink2:#cdd1d8; --muted:#9aa2ad; --faint:#7d8590;
  --red:#ef3b48; --red-dark:#d42a37; --red-soft:rgba(239,59,72,.14); --red-line:rgba(239,59,72,.38);
  --over:#3cc98f; --over-soft:rgba(60,201,143,.14);
  --under:#7d9dff; --under-soft:rgba(125,157,255,.15);
  --amber:#f2b552; --amber-soft:rgba(242,181,82,.12); --amber-line:rgba(242,181,82,.32);
  --orange:#ff8a4c; --orange-soft:rgba(255,138,76,.13);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.22);
  --shadow-h:0 2px 6px rgba(0,0,0,.35),0 14px 34px rgba(0,0,0,.35);
  --inset:inset 0 1px 3px rgba(0,0,0,.38), inset 0 -1px 0 rgba(255,255,255,.035);
  --inset-edge:inset 0 10px 14px -12px rgba(0,0,0,.5), inset 0 -10px 14px -12px rgba(0,0,0,.4), inset 10px 0 14px -14px rgba(0,0,0,.3), inset -10px 0 14px -14px rgba(0,0,0,.3);
  --flash:#fff3c4; --flash-glow:rgba(255,236,170,.6); --crowd:#4a505a; --crowd2:#3a3f48}
html.dark,html.dark body{background:#111215}
html.dark body{background:radial-gradient(1100px 620px at 85% -12%,rgba(239,59,72,.10),transparent 60%),radial-gradient(900px 600px at -10% 10%,#2a2e35 0%,transparent 55%),linear-gradient(165deg,#1d2025 0%,#15171b 45%,#0e0f12 100%) fixed}
html.dark .side{background:rgba(22,24,28,.82);backdrop-filter:blur(10px)}
html.dark .top{background:rgba(20,22,26,.78)}
html.dark .toolbar{background:transparent;backdrop-filter:blur(10px)}
html.dark .cell{background:#22262c}
html.dark .cell:hover{background:#262a31}
html.dark .mrow:hover,html.dark .irow:hover,html.dark .prow2:hover,html.dark .smt-r:hover{background:rgba(239,59,72,.06)}
html.dark .sqt tr.out td{background:repeating-linear-gradient(135deg,#1c1f24,#1c1f24 6px,#20232a 6px,#20232a 12px)}
html.dark .tid{box-shadow:0 0 0 1.5px rgba(255,255,255,.16)}
html.dark .seg button.on{background:#30353d;color:#fff}
html.dark .chip.on,html.dark .btn.red,html.dark .vd.strong{color:#fff}
html.dark .tgl .knob{background:#e9ebef}
html.dark .hero .court{opacity:.14}
html.dark .hoop .board,html.dark .hoop .arm{stroke:#c9cdd4}
html.dark .hoop .net{stroke:#7d8590}
html.dark .scrim{background:rgba(0,0,0,.55)}
html.dark .drawer{background:#1a1d22;box-shadow:-12px 0 40px rgba(0,0,0,.5)}
html.dark .dr-h{background:#1a1d22}
html.dark .build .st2.total,html.dark .nav .count.alert{color:#fff}
html.dark .form .f{background:rgba(239,59,72,.07)!important}
html.dark .pill.o{box-shadow:inset 0 0 0 1px rgba(60,201,143,.25)}
html.dark kbd{background:#262a31}
html.dark .skip{background:#fff;color:#111}
html.dark ::selection{background:rgba(239,59,72,.4)}

/* ================= Stage 1.9 · SVG wordmark, team swipes, glass Last 6 ================= */
/* --- SVG wordmark (replaces letter spans) --- */

/* --- game header: slow swipe between the two teams' colours --- */
.gsec-h{position:relative}
.gsec-h::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;z-index:1;background:linear-gradient(90deg,var(--ca),var(--ca) 35%,var(--cb) 65%,var(--cb));opacity:.9}
.gsec.collapsed .gsec-h::after{opacity:.55}

/* --- Last 6: liquid-glass inner panel --- */
tr.formrow > td{padding:6px 14px 18px!important;background:var(--sunk)!important;box-shadow:inset 0 10px 12px -10px rgba(18,20,23,.16),inset 0 -10px 12px -10px rgba(18,20,23,.10)!important}
.formwrap{position:relative;border-left:0;margin-top:8px;padding:14px 16px 12px;border-radius:18px;
  background:linear-gradient(145deg,rgba(255,255,255,.78),rgba(255,255,255,.52));
  -webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);
  border:1px solid rgba(255,255,255,.85);
  box-shadow:0 10px 30px rgba(18,20,23,.10),0 2px 6px rgba(18,20,23,.06),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(18,20,23,.05)}
.formwrap::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 70%,rgba(255,255,255,.25) 100%);mix-blend-mode:soft-light}
.formwrap::after{content:"";position:absolute;left:18px;right:18px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--team-c,var(--red));opacity:.85}
.formwrap > *{position:relative}
.fcard{background:rgba(255,255,255,.82);border-color:rgba(18,20,23,.07)}
.ftable{background:rgba(255,255,255,.82);border-color:rgba(18,20,23,.07)}
.form th{background:rgba(243,245,248,.9)}
.formttl .av{background:rgba(255,255,255,.9)}
html.dark tr.formrow > td{background:#131518!important;box-shadow:inset 0 10px 12px -10px rgba(0,0,0,.6),inset 0 -10px 12px -10px rgba(0,0,0,.5)!important}
html.dark .formwrap{background:linear-gradient(145deg,rgba(255,255,255,.085),rgba(255,255,255,.035));border-color:rgba(255,255,255,.12);box-shadow:0 12px 34px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12),inset 0 -1px 0 rgba(0,0,0,.3)}
html.dark .formwrap::before{background:linear-gradient(120deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 35%)}
html.dark .fcard,html.dark .ftable{background:rgba(24,27,32,.72);border-color:rgba(255,255,255,.07)}
html.dark .form th{background:rgba(30,33,39,.9)}
html.dark .formttl .av{background:rgba(255,255,255,.06)}

/* ================= Stage 1.10 · header hover, liquid glass everywhere, clearer Last 6 ================= */
/* --- liquid glass tokens --- */
:root{
  --glass-bg:linear-gradient(145deg,rgba(255,255,255,.84),rgba(255,255,255,.64));
  --glass-border:rgba(255,255,255,.9);
  --glass-shadow:0 1px 0 rgba(18,20,23,.04),0 8px 28px rgba(18,20,23,.07),inset 0 1px 0 rgba(255,255,255,.95),inset 0 0 0 1px rgba(18,20,23,.045);
  --glass-blur:blur(18px) saturate(170%);
}
html.dark{
  --glass-bg:linear-gradient(145deg,rgba(40,44,52,.72),rgba(26,29,34,.62));
  --glass-border:rgba(255,255,255,.09);
  --glass-shadow:0 10px 32px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.08),inset 0 0 0 1px rgba(255,255,255,.03);
}
body{background:radial-gradient(900px 520px at 88% -8%,rgba(179,18,31,.07),transparent 62%),radial-gradient(800px 620px at -6% 28%,rgba(44,92,200,.05),transparent 60%),radial-gradient(700px 500px at 60% 110%,rgba(11,125,82,.04),transparent 60%),#f2f3f6 fixed}
.panel,.hero,.overview,.ana,.ij,.rtable,.notice,.gsec{background:var(--glass-bg)!important;-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border-color:var(--glass-border)!important;box-shadow:var(--glass-shadow)!important}
.notice{border-left-color:var(--red)!important}
.hero{border-left:0}
.side{background:rgba(255,255,255,.66);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border-right-color:rgba(18,20,23,.06)}
.top{background:rgba(255,255,255,.62);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
.toolbar{background:rgba(242,243,246,.72);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border-radius:0 0 14px 14px}
.drawer{background:linear-gradient(160deg,rgba(255,255,255,.92),rgba(250,251,253,.86));-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border-left:1px solid rgba(255,255,255,.9)}
.dr-h{background:rgba(255,255,255,.72);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
.scrim{background:rgba(18,20,23,.18);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.chip:not(.on),.field,.seg,.btn:not(.red),.helpbtn.top,.themebtn{background:rgba(255,255,255,.7);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.sq-h,.tabdesc{background:rgba(250,251,252,.6)}
html.dark body{background:radial-gradient(1100px 620px at 85% -12%,rgba(239,59,72,.10),transparent 60%),radial-gradient(900px 600px at -10% 10%,#2a2e35 0%,transparent 55%),linear-gradient(165deg,#1d2025 0%,#15171b 45%,#0e0f12 100%) fixed}
html.dark .side{background:rgba(22,24,28,.6)}
html.dark .top{background:rgba(20,22,26,.55)}
html.dark .toolbar{background:rgba(18,20,24,.6)}
html.dark .drawer{background:linear-gradient(160deg,rgba(32,35,41,.9),rgba(22,24,29,.86));border-left-color:rgba(255,255,255,.08)}
html.dark .dr-h{background:rgba(28,31,36,.75)}
html.dark .scrim{background:rgba(0,0,0,.45)}
html.dark .chip:not(.on),html.dark .field,html.dark .seg,html.dark .btn:not(.red),html.dark .helpbtn.top,html.dark .themebtn{background:rgba(40,44,52,.55)}
html.dark .sq-h,html.dark .tabdesc{background:rgba(255,255,255,.025)}

/* --- game headers: calmer idle swipe, clear & soft hover --- */
.gsec-h{transition:box-shadow .5s var(--ease);overflow:hidden;isolation:isolate}
.gsec-h::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.75) 46%,rgba(255,255,255,.25) 54%,transparent 70%);transform:translateX(-120%);opacity:0;transition:opacity .4s var(--ease)}
.gsec-h:hover{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ca) 22%,transparent),inset 0 -40px 60px -50px color-mix(in srgb,var(--cb) 50%,transparent)}
.gsec-h:hover::before{opacity:1;animation:sheen 1.4s var(--ease) both}
@keyframes sheen{from{transform:translateX(-120%)}to{transform:translateX(120%)}}
.gsec-h::after{height:3px;transition:height .45s var(--ease),opacity .45s var(--ease)}
.gsec-h:hover::after{height:6px;opacity:1}
.gsec-h .tid{transition:transform .5s var(--ease),box-shadow .5s var(--ease)}
.gsec-h:hover .tid{transform:scale(1.12);box-shadow:0 4px 14px rgba(18,20,23,.22)}
.gsec-h:hover .matchup .tm:first-child b{color:color-mix(in srgb,var(--ca) 75%,var(--ink))}
.gsec-h:hover .matchup .tm:last-child b{color:color-mix(in srgb,var(--cb) 75%,var(--ink))}
.gsec-h .matchup .tm b{transition:color .5s var(--ease)}
.gsec-h:hover .chev{transform:translateY(2px);border-color:var(--red);background:rgba(255,255,255,.7)}
.gsec.collapsed .gsec-h:hover .chev{transform:rotate(-90deg) translateX(-2px)}
.gsec-h .gcount,.gsec-h .gtags{transition:transform .5s var(--ease)}
.gsec-h:hover .gtags{transform:translateX(4px)}
html.dark .gsec-h::before{background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.14) 46%,rgba(255,255,255,.05) 54%,transparent 70%)}
html.dark .gsec-h:hover .matchup .tm:first-child b{color:color-mix(in srgb,var(--ca) 45%,#fff)}
html.dark .gsec-h:hover .matchup .tm:last-child b{color:color-mix(in srgb,var(--cb) 45%,#fff)}
html.dark .gsec-h:hover .chev{background:rgba(255,255,255,.06)}

/* --- Last 6: the opened row and its panel read as one clearly separate unit --- */
.sqt tr.has-form td{background:var(--red-soft)!important}
.sqt tr.has-form td.pl{box-shadow:inset 3px 0 0 var(--red)}
.sqt tr.has-form td.pl .pl-in > div > b{color:var(--red)}
.formbtn[aria-expanded=true] b{color:#fff}
.formwrap{border:1.5px solid color-mix(in srgb,var(--red) 28%,transparent);box-shadow:0 14px 34px rgba(18,20,23,.12),0 2px 6px rgba(18,20,23,.06),inset 0 1px 0 rgba(255,255,255,.95)}
.formwrap::after{background:var(--red)!important;left:0;right:0;top:-1px;height:4px;border-radius:16px 16px 0 0}
.formwrap::before{background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 40%)!important;mix-blend-mode:normal}
.formrow .formwrap{animation:panelIn .45s var(--ease) both}
@keyframes panelIn{from{opacity:0;transform:translateY(-6px) scale(.985)}to{opacity:1;transform:none}}
.formttl .fclose{border:1px solid var(--line2);background:rgba(255,255,255,.7)}
html.dark .formwrap{border-color:color-mix(in srgb,var(--red) 35%,transparent)}
html.dark .formwrap::before{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0) 40%)!important}
html.dark .formttl .fclose{background:rgba(255,255,255,.05)}

/* ================= Stage 1.11 · interactive headers ================= */
/* page graphics draw in */
.hero .gfx *{stroke-dasharray:900;stroke-dashoffset:900;animation:gfxDraw 1.8s var(--ease) forwards}
.hero .gfx g > :nth-child(2n){animation-delay:.12s}.hero .gfx g > :nth-child(3n){animation-delay:.24s}
@keyframes gfxDraw{to{stroke-dashoffset:0}}
.hero .gfx{transition:opacity .4s var(--ease),transform .7s var(--ease)}
.hero:hover .gfx{opacity:.18;transform:translateY(-3px) rotate(-1.5deg) scale(1.03)}
.hero-props .gfx,.hero-games .gfx,.hero-injuries .gfx,.hero-results .gfx{right:-10px;top:-4px;height:116%}

/* home header layout */
.hero-home{padding:24px 26px 0}
.hero-grid{position:relative;display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center}
.hero-main{min-width:0}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:8px;vertical-align:1px;box-shadow:0 0 0 0 rgba(179,18,31,.5);animation:pulse 2s var(--ease) infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(179,18,31,.45)}70%{box-shadow:0 0 0 9px rgba(179,18,31,0)}100%{box-shadow:0 0 0 0 rgba(179,18,31,0)}}

/* before-you-bet checklist */
.betcheck{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px}
.bc-lbl{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.bc{display:flex;align-items:center;gap:9px;padding:7px 12px 7px 8px;border-radius:12px;background:rgba(255,255,255,.7);border:1px solid var(--line);box-shadow:var(--inset);text-align:left;transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .35s var(--ease);animation:fadeUp .5s var(--ease) both}
.bc:nth-of-type(2){animation-delay:.06s}.bc:nth-of-type(3){animation-delay:.12s}.bc:nth-of-type(4){animation-delay:.18s}
.bc:hover{transform:translateY(-2px);box-shadow:var(--shadow-h);border-color:var(--line2)}
.bc-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex-shrink:0}
.bc-ic svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bc-t{line-height:1.1}
.bc-t b{font:700 20px var(--display)}
.bc-t small{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:1px}
.bc.ok .bc-ic{background:var(--over-soft);color:var(--over)}
.bc.warn .bc-ic{background:var(--amber-soft);color:var(--amber)}
.bc.bad .bc-ic{background:var(--red-soft);color:var(--red)}
.bc.val .bc-ic{background:var(--red);color:#fff}
.bc.val b{color:var(--red)}
.bc.warn:hover{border-color:var(--amber-line)}
.bc.val:hover{border-color:var(--red-line)}

/* clock card — shot-clock style */
.clockcard{position:relative;width:250px;padding:14px 16px 13px;border-radius:16px;background:linear-gradient(160deg,#17191d,#0e0f12);color:#fff;box-shadow:0 14px 30px rgba(18,20,23,.22),inset 0 1px 0 rgba(255,255,255,.08),inset 0 0 0 1px rgba(255,255,255,.04);overflow:hidden;animation:fadeUp .55s var(--ease) both .1s}
.clockcard::before{content:"";position:absolute;inset:0;background:radial-gradient(220px 120px at 90% -10%,rgba(239,59,72,.28),transparent 70%);pointer-events:none}
.clockcard > *{position:relative}
.cc-top{display:flex;justify-content:space-between;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.cc-time{display:flex;align-items:flex-start;gap:6px;margin-top:4px;font:700 54px/1 var(--display);letter-spacing:.02em;color:#fff;text-shadow:0 0 18px rgba(239,59,72,.35)}
.cc-time .colon{display:inline-block;margin:0 1px;animation:blink 1s steps(1) infinite;color:#ff5560}
@keyframes blink{50%{opacity:.15}}
.cc-sec{font-size:20px;color:#ff5560;margin-top:6px;min-width:24px}
.cc-bar{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin:10px 0 12px}
.cc-bar i{height:5px;border-radius:2px;background:rgba(255,255,255,.1);transition:background .4s var(--ease),box-shadow .4s var(--ease)}
.cc-bar i.on{background:#ef3b48;box-shadow:0 0 6px rgba(239,59,72,.6)}
.cc-next{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;padding-top:10px;border-top:1px solid rgba(255,255,255,.08)}
.cc-lbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.5);grid-column:1/-1}
.cc-game{display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.85);white-space:nowrap}
.cc-game .tid.xs{width:16px;height:16px;font-size:6px;margin-left:2px}
#ccCount{font:700 18px var(--display);color:#fff;white-space:nowrap}
#ccCount.soon{color:#ff5560;animation:blink 1.2s steps(1) infinite}

/* rotating tip line */
.tipline{position:relative;display:flex;align-items:center;gap:12px;margin:18px -26px 0;padding:11px 26px;border-top:1px solid var(--line);background:rgba(250,251,252,.6)}
.tl-k{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--red);padding:3px 8px;border-radius:5px;flex-shrink:0}
.tl-t{font-size:13px;color:var(--ink2);transition:opacity .38s var(--ease),transform .38s var(--ease)}
.tl-t.out{opacity:0;transform:translateY(5px)}
.hero-home::after{bottom:44px}

/* dark mode */
html.dark .bc{background:rgba(255,255,255,.04)}
html.dark .clockcard{background:linear-gradient(160deg,#0b0c0f,#060708);box-shadow:0 14px 30px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.06)}
html.dark .tipline{background:rgba(255,255,255,.025)}
html.dark .hero:hover .gfx{opacity:.24}

@media (max-width:1100px){.hero-grid{grid-template-columns:1fr}.clockcard{width:auto;max-width:420px}}
@media (max-width:640px){.cc-time{font-size:44px}.bc{flex:1 1 calc(50% - 8px)}.bc-lbl{width:100%}.tipline{margin:16px -20px 0;padding:10px 20px}.hero-home{padding:20px 20px 0}}
html.calm .colon,html.calm #ccCount.soon,html.calm .live-dot{animation:none!important}

/* ================= Performance & smooth theme switch ================= */
/* Theme change: one composited reveal from the button (no per-element colour transitions) */
::view-transition-old(root),::view-transition-new(root){animation-duration:.7s;animation-timing-function:var(--ease);mix-blend-mode:normal}
::view-transition-old(root){animation-name:themeOut}
::view-transition-new(root){animation-name:themeIn}
@keyframes themeOut{from{opacity:1}to{opacity:0}}
@keyframes themeIn{from{opacity:0}to{opacity:1}}
@keyframes themeReveal{from{clip-path:circle(0 at var(--tx,90%) var(--ty,40px))}to{clip-path:circle(150vmax at var(--tx,90%) var(--ty,40px))}}

/* Static page background (fixed gradients forced a full repaint on every scroll) */
body,html.dark body{background-attachment:scroll!important}

/* Blur only on the few layers that float over content; cards keep the glass look without a blur pass */
.panel,.hero,.overview,.ana,.ij,.rtable,.notice,.gsec,.chip:not(.on),.field,.seg,.btn:not(.red),.helpbtn.top,.themebtn,.formwrap,.dr-h{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.panel,.hero,.overview,.ana,.ij,.rtable,.notice,.gsec{background:linear-gradient(145deg,rgba(255,255,255,.94),rgba(255,255,255,.82))!important}
html.dark .panel,html.dark .hero,html.dark .overview,html.dark .ana,html.dark .ij,html.dark .rtable,html.dark .notice,html.dark .gsec{background:linear-gradient(145deg,rgba(38,42,49,.92),rgba(26,29,34,.9))!important}
.formwrap{background:linear-gradient(145deg,rgba(255,255,255,.96),rgba(250,251,253,.9))}
html.dark .formwrap{background:linear-gradient(145deg,rgba(44,48,56,.9),rgba(30,33,39,.88))}
.chip:not(.on),.field,.seg,.btn:not(.red),.helpbtn.top,.themebtn{background:rgba(255,255,255,.9)}
html.dark .chip:not(.on),html.dark .field,html.dark .seg,html.dark .btn:not(.red),html.dark .helpbtn.top,html.dark .themebtn{background:rgba(40,44,52,.85)}
.dr-h{background:rgba(255,255,255,.96)}
html.dark .dr-h{background:rgba(28,31,36,.97)}

/* Game header team swipe: a wide gradient layer that slides with transform (GPU), hover fades a stronger copy in */
.gsec-h > *:not(.gswipe){position:relative;z-index:1}
.gswipe{position:absolute;top:0;bottom:0;left:0;width:200%;z-index:0;pointer-events:none;will-change:transform;
  background:linear-gradient(100deg,
    color-mix(in srgb,var(--ca) 10%,transparent) 0%,transparent 12.5%,
    color-mix(in srgb,var(--cb) 10%,transparent) 25%,transparent 37.5%,
    color-mix(in srgb,var(--ca) 10%,transparent) 50%,transparent 62.5%,
    color-mix(in srgb,var(--cb) 10%,transparent) 75%,transparent 87.5%,
    color-mix(in srgb,var(--ca) 10%,transparent) 100%);
  animation:teamslide 13s linear infinite}
.gswipe::after{content:"";position:absolute;inset:0;opacity:0;transition:opacity .6s var(--ease);
  background:linear-gradient(100deg,
    color-mix(in srgb,var(--ca) 24%,transparent) 0%,transparent 12.5%,
    color-mix(in srgb,var(--cb) 24%,transparent) 25%,transparent 37.5%,
    color-mix(in srgb,var(--ca) 24%,transparent) 50%,transparent 62.5%,
    color-mix(in srgb,var(--cb) 24%,transparent) 75%,transparent 87.5%,
    color-mix(in srgb,var(--ca) 24%,transparent) 100%)}
.gsec-h:hover .gswipe::after{opacity:1}
@keyframes teamslide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
html.dark .gswipe{filter:saturate(1.3) brightness(1.15)}
.gsec-h::before{z-index:0;will-change:transform}
html.calm .gswipe{animation:none}

/* Skip layout/paint for game sections that are off-screen */
.gsec,.ana,.ij{content-visibility:auto;contain-intrinsic-size:auto 700px}
.cell,.bc,.fcard,.formbtn{will-change:auto}

/* ================= Game headers: clean seam + top-edge glow ================= */
/* one continuous box: no split colour bar, no stripes on the squad headers */
.gsec-h::after{display:none!important}
.sq-h{border-top:0!important}
.gsec-h{border-bottom:1px solid var(--line)!important}
.gsec.collapsed .gsec-h{border-bottom:0!important}
.gbody .squad + .squad{border-left:1px solid var(--line)}
/* glow that lives only above the top edge, in the two teams' colours */
.gouter{position:relative;isolation:isolate;margin-bottom:34px;scroll-margin-top:150px}
.gouter > .gsec{margin-bottom:0;position:relative;z-index:1}
.gglow{position:absolute;left:14%;right:14%;top:-5px;height:18px;z-index:0;pointer-events:none;border-radius:50%;
  background:linear-gradient(90deg,var(--ca),color-mix(in srgb,var(--ca) 50%,var(--cb)) 50%,var(--cb));
  filter:blur(9px);opacity:.3;transform-origin:center;will-change:transform,opacity;
  animation:glowBreathe 6s var(--ease) infinite alternate}
@keyframes glowBreathe{from{transform:translateX(-3%) scaleX(.94);opacity:.28}to{transform:translateX(3%) scaleX(1.02);opacity:.46}}
.gouter:hover .gglow{opacity:.62;animation-play-state:paused;transition:opacity .5s var(--ease)}
html.dark .gglow{opacity:.5}
html.dark .gouter:hover .gglow{opacity:.8}
html.calm .gglow{animation:none}

/* Header hover: no sweep — the motion freezes and the bar gains contrast */
.gsec-h::before{display:none!important}
.gsec-h:hover .gswipe{animation-play-state:paused}
.gsec-h:hover .gswipe::after{opacity:1}
.gsec-h:hover{box-shadow:none!important;background-color:color-mix(in srgb,var(--ink) 3%,transparent)}
.gouter:hover .gsec{box-shadow:0 10px 30px rgba(18,20,23,.12),0 2px 6px rgba(18,20,23,.06)!important;transition:box-shadow .45s var(--ease)}
.gouter:hover .gglow{animation-play-state:paused;opacity:.55}
.gsec-h:hover .matchup .tm b{text-shadow:none}
.gsec-h:hover .gcount b,.gsec-h:hover .gcount{color:var(--ink)}
html.dark .gsec-h:hover{background-color:rgba(255,255,255,.035)}
html.dark .gouter:hover .gsec{box-shadow:0 12px 34px rgba(0,0,0,.5)!important}

/* ================= Home date, injury watch, softer glow ================= */
.datehead{display:flex;align-items:center;gap:16px;margin:8px 0 4px;font-family:'Unbounded',var(--sans);line-height:1}
.dh-day{font-weight:800;font-size:68px;letter-spacing:-.04em;color:var(--red);line-height:.9;animation:fadeUp .6s var(--ease) both}
.dh-rest{display:flex;flex-direction:column;gap:6px;padding-left:16px;border-left:2px solid var(--line2);animation:fadeUp .6s var(--ease) both .08s}
.dh-month{font-weight:600;font-size:30px;letter-spacing:-.02em;color:var(--ink)}
.dh-year{font-weight:400;font-size:14px;letter-spacing:.32em;color:var(--muted)}
@media (max-width:640px){.dh-day{font-size:52px}.dh-month{font-size:23px}}

.injwatch{margin-top:16px}
.iw-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.iw-lu{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber-line);padding:3px 9px;border-radius:99px}
.iw-lu i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 2s var(--ease) infinite}
.iw-all{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--red);padding:4px 8px;border-radius:7px;transition:background .3s var(--ease)}
.iw-all:hover{background:var(--red-soft)}
.iw-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:8px}
.iw{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:12px;background:rgba(255,255,255,.75);border:1px solid var(--line);box-shadow:var(--inset);text-align:left;transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .35s var(--ease);animation:fadeUp .5s var(--ease) both;animation-delay:calc(var(--k) * 60ms)}
.iw:hover{transform:translateY(-2px);box-shadow:var(--shadow-h)}
.iw.out{border-left:3px solid var(--red)}
.iw.questionable,.iw.doubtful{border-left:3px solid var(--amber)}
.iw-t{min-width:0;flex:1;line-height:1.2}
.iw-t b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iw-t small{font-size:11.5px;color:var(--muted)}
html.dark .iw{background:rgba(255,255,255,.04)}
html.calm .iw-lu i{animation:none}

/* ================= Consistent spacing · filled top bar · logo hoop · home hover ================= */
:root{--sec:30px}
.notice{margin:24px 0 var(--sec)!important}
.overview{margin-bottom:var(--sec)!important}
.cols{gap:24px}
.ana,.ij{margin-top:var(--sec)!important}
.rtable{margin-top:var(--sec)!important}
.legend2{margin:0 0 -6px}
.toolbar{margin-top:24px}
.gouter{margin-bottom:var(--sec)}
.sechead{margin:calc(var(--sec) + 8px) 0 14px}
.hero,.hero-home{padding:26px 28px 24px}
.hero-home{padding-bottom:0}
.tipline{margin:20px -28px 0;padding:11px 28px}
@media (max-width:960px){:root{--sec:24px}}

/* logo: larger hoop sitting closer to the word */
.logo{padding-right:38px}
.hoop{right:0;top:-11px;width:37px;height:42px}
@media (max-width:960px){.logo{padding-right:32px}.hoop{width:30px;height:34px;top:-8px}}

/* top bar: filled, dark, with a slow red accent line */
.top{background:linear-gradient(100deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.5) 45%,rgba(253,228,231,.55) 100%)!important;-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);border-bottom:1px solid rgba(255,255,255,.7);box-shadow:0 1px 0 rgba(18,20,23,.05),0 8px 24px rgba(179,18,31,.05),inset 0 1px 0 rgba(255,255,255,.9)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(179,18,31,.35) 35%,rgba(179,18,31,.55) 50%,rgba(179,18,31,.35) 65%,transparent);background-size:200% 100%;animation:topline 12s linear infinite}
@keyframes topline{from{background-position:100% 0}to{background-position:-100% 0}}
.top .crumb{display:flex;align-items:center}
.top .crumb-page{font-weight:700}
.top .seg,.top .helpbtn.top,.top .themebtn{background:rgba(255,255,255,.55)!important;border-color:rgba(255,255,255,.85)}
html.dark .top{background:linear-gradient(100deg,rgba(26,28,33,.6) 0%,rgba(24,26,31,.5) 45%,rgba(70,18,24,.45) 100%)!important;border-bottom-color:rgba(255,255,255,.06);box-shadow:0 8px 24px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.05)}
html.dark .top .seg,html.dark .top .helpbtn.top,html.dark .top .themebtn{background:rgba(255,255,255,.05)!important;border-color:rgba(255,255,255,.1)}
html.calm .top::after{animation:none}

/* compact injuries & lineups strip */
.injwatch{margin-top:14px}
.iw-h{gap:10px;margin-bottom:7px}
.iw-lu{font-size:11px;padding:2px 8px}
.iw-all{font-size:12px;padding:3px 6px}
.iw-list{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.iw{gap:8px;padding:6px 9px;border-radius:10px}
.iw .tid.sm{width:20px;height:20px;font-size:7px}
.iw-t b{font-size:12.5px}
.iw-t small{font-size:11px}
.iw .st{font-size:9px;padding:1px 6px;letter-spacing:.04em}

/* home header comes alive on hover */
.hero::after{transition:box-shadow .5s var(--ease),width .5s var(--ease)}
.hero:hover::after{width:6px;box-shadow:0 0 18px rgba(179,18,31,.45)}
.dh-day,.dh-month,.clockcard,.iw,.live-dot{transition:transform .55s var(--ease),text-shadow .55s var(--ease),box-shadow .55s var(--ease),color .55s var(--ease)}
.hero-home:hover .dh-day{transform:translateY(-3px) scale(1.04);text-shadow:0 10px 26px rgba(179,18,31,.28)}
.hero-home:hover .dh-month{transform:translateX(4px)}
.hero-home:hover .clockcard{transform:translateY(-4px) rotate(-.8deg);box-shadow:0 22px 44px rgba(18,20,23,.3),inset 0 1px 0 rgba(255,255,255,.08)}
.hero-home:hover .iw{transform:translateY(-2px);transition-delay:calc(var(--k) * 55ms)}
.hero-home:hover .iw:hover{transform:translateY(-4px);transition-delay:0s}
.hero-home:hover .live-dot{transform:scale(1.35)}
.hero-home .court{transition:opacity .6s var(--ease),transform .9s var(--ease)}
.hero-home:hover .court{transform:translateX(-10px) rotate(-2deg) scale(1.03)}

.iw-list{grid-template-columns:repeat(auto-fill,minmax(235px,1fr))}
.iw-n{display:flex;align-items:center;justify-content:space-between;gap:6px}
.iw-n b{min-width:0}
.iw-t small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ================= Standings · top looks · basketball sketch ================= */
.side{overflow-y:auto;scrollbar-width:thin}
.stand .st-h{display:flex;align-items:center;justify-content:space-between;padding:0 12px 8px 0}
.stand .side-lbl{padding-bottom:0}
.st-tabs{display:inline-flex;background:var(--sunk);border-radius:8px;padding:2px;box-shadow:var(--inset)}
.st-tabs button{font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;color:var(--muted);transition:background .3s var(--ease),color .3s var(--ease)}
.st-tabs button.on{background:var(--white);color:var(--red);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.stt{width:100%;border-collapse:collapse;font-size:12px}
.stt th{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:0 4px 5px;text-align:right}
.stt th:first-child{text-align:center}
.stt th.l,.stt td.l{text-align:left}
.stt td{padding:4px;text-align:right;color:var(--ink2);font-weight:600;border-top:1px solid transparent}
.stt td.rk{text-align:center;color:var(--faint);font-size:11px;width:20px}
.stt td.gb{color:var(--faint);font-weight:500}
.stt tr.cut td{border-bottom:1px dashed var(--line2)}
.stt-t{display:inline-flex;align-items:center;gap:6px}
.stt .tid.xs{width:16px;height:16px;font-size:5.5px;box-shadow:none}
.stt tr{transition:background .3s var(--ease)}
.stt tr.on{cursor:pointer}
.stt tr.on td{background:var(--red-soft);color:var(--ink)}
.stt tr.on td:first-child{border-radius:7px 0 0 7px;color:var(--red)}
.stt tr.on td:last-child{border-radius:0 7px 7px 0}
.stt tr.on:hover td{background:color-mix(in srgb,var(--red) 16%,transparent)}
.st-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(179,18,31,.4);animation:pulse 2.4s var(--ease) infinite}
.st-note{font-size:10.5px;color:var(--faint);padding:8px 4px 0;display:flex;align-items:center;gap:5px}
.st-note .st-dot{animation:none}
html.dark .st-tabs button.on{background:#30353d}
html.calm .st-dot{animation:none}

/* subtle top looks */
.looks{margin-top:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.lk-lbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);flex-shrink:0}
.lk-row{display:flex;flex-wrap:wrap;gap:4px 0}
.lk{display:inline-flex;align-items:center;gap:7px;padding:4px 12px;font-size:12px;color:var(--muted);border-left:1px solid var(--line);transition:color .35s var(--ease),transform .35s var(--ease);animation:fadeUp .5s var(--ease) both;animation-delay:calc(var(--k) * 50ms)}
.lk:first-child{border-left:0;padding-left:0}
.lk-g{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--faint)}
.lk-g i{font-style:normal;margin:0 2px;opacity:.6}
.lk-p b{color:var(--ink2);font-weight:600}
.lk-p .o{color:var(--over);font-weight:600} .lk-p .u{color:var(--under);font-weight:600}
.lk-c{font-weight:700;color:var(--ink2)}
.lk:hover{color:var(--ink);transform:translateY(-1px)}
.lk:hover .lk-p b{color:var(--red)}
.hero-home:hover .lk{transform:translateY(-1px);transition-delay:calc(var(--k) * 45ms)}

/* basketball sketch on the court, in the same line style */
.hero .ballsketch{opacity:0!important;transition:opacity .5s var(--ease),transform .9s var(--ease)}
.hero-home:hover .ballsketch{opacity:.34!important}
html.dark .hero-home:hover .ballsketch{opacity:.5!important}
.ballsketch .bs-ball,.ballsketch .bs-shadow,.ballsketch .bs-trail{transform-box:fill-box;transform-origin:center bottom}
.ballsketch .bs-ball{transform:translateY(-80px)}
.ballsketch .bs-trail{opacity:0}
.ballsketch .bs-shadow{transform:scaleX(.3);opacity:0}
.hero-home:hover .ballsketch .bs-ball{animation:bsDrop 1.5s var(--ease) both}
.hero-home:hover .ballsketch .bs-shadow{animation:bsShadow 1.5s var(--ease) both}
.hero-home:hover .ballsketch .bs-trail{animation:bsTrail 1.1s var(--ease) both}
.hero-home:hover .ballsketch .bs-ball *{stroke-dasharray:160;stroke-dashoffset:160;animation:gfxDraw 1s var(--ease) forwards}
@keyframes bsDrop{
  0%{transform:translateY(-80px) translateX(14px) rotate(-60deg)}
  38%{transform:translateY(0) rotate(0) scale(1.06,.9)}
  52%{transform:translateY(-34px) rotate(18deg) scale(1)}
  66%{transform:translateY(0) rotate(30deg) scale(1.03,.95)}
  78%{transform:translateY(-14px) rotate(36deg)}
  88%,100%{transform:translateY(0) rotate(40deg) scale(1)}}
@keyframes bsShadow{0%{transform:scaleX(.3);opacity:0}38%{transform:scaleX(1.15);opacity:1}52%{transform:scaleX(.7);opacity:.6}66%{transform:scaleX(1.05);opacity:1}78%{transform:scaleX(.9)}100%{transform:scaleX(1);opacity:1}}
@keyframes bsTrail{0%{opacity:0;transform:translateY(-20px)}30%{opacity:1}100%{opacity:0;transform:translateY(40px)}}
html.calm .hero-home:hover .ballsketch *{animation:none!important;transform:none!important;stroke-dashoffset:0!important}

.lk{border-left:0;padding:4px 18px 4px 0}
.lk-row{gap:4px 0}

/* ================= Team logos ================= */
.tid > b,.matchup .tm .tid > b{font:700 inherit/1 var(--sans)!important;font-size:inherit!important;color:#fff!important;letter-spacing:0!important;text-shadow:none!important}
.ghead .tid:not(.logo),.gsec-h .tid:not(.logo){font-size:11px}
.tid.logo{background:transparent!important;box-shadow:none!important;overflow:visible}
.tid.logo b{display:none}
.tid img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 1px 1.5px rgba(18,20,23,.18))}
html.dark .tid.logo{background:rgba(255,255,255,.92)!important;border-radius:50%;padding:2px}
html.dark .tid.logo img{filter:none}
.gsec-h .tid,.ana-h .tid,.ij-h .tid{width:40px;height:40px}

/* ================= Animated game headers on every page (Games, Injuries, Home) ================= */

function buildProp(pl, market){

  const base = Math.max(0.3, seasonAvg * (1 + gauss(r) * 0.012));

  // Head-to-head games vs tonight's opponent (sample)

  const n = h2h.length, h2hAvg = avg(h2h);

  const roleVal = b => afterH2H * (b.minIf / pl.min - 1);
