/* Model lab: ideas tested by replaying past seasons (data/lab.js, written by lab/build_page_data.py) */
function labPanel(){
  const L = window.SWISH_LAB; if (!L || !L.experiments) return "";
  const f = (x, d) => x == null ? "—" : Number(x).toFixed(d);
  const cmp = (b, a, d, word) => {
    if (b == null || a == null) return "";
    const better = a < b, same = Math.abs(a - b) < Math.pow(10, -d) / 2;
    return `${word} <b class="num">${f(b, d)} → ${f(a, d)}</b> <span class="${same ? "" : better ? "bt" : "wr"}">${same ? "same" : better ? "better" : "worse"}</span>`;
  };
  const line = (x, tag) => [cmp((x.before || {}).minutes, (x.after || {}).minutes, 2, "Minutes miss"),
                            cmp((x.before || {}).points, (x.after || {}).points, 3, "Points miss"),
                            cmp((x.before || {}).accuracy, (x.after || {}).accuracy, 4, "Accuracy score")].filter(Boolean).join(" · ") + (tag ? ` <small>${tag}</small>` : "");
  const rows = [...L.experiments].reverse().map(x => `<div class="lab-row">
      <div class="li"><b>${esc(x.idea)}</b><small>${esc(x.why)}</small></div>
      <div class="ln">${line(x)}<small>${esc(x.scope)}</small>${x.check ? `<div>${line(x.check)}<small>Checked again on 2024-25</small></div>` : ""}${x.note ? `<small>${esc(x.note)}</small>` : ""}</div>
      <div class="lv"><span class="rchip ${x.verdict === "shipped" ? "win" : "loss"}">${x.verdict === "shipped" ? "Shipped" : "Rejected"}</span><small>${esc(x.version)}</small></div>
    </div>`).join("");
  const C = (L.current || {}).calibration || [];
  return `<div class="panel" style="margin-bottom:var(--sec)">
    <div class="panel-h"><h2 class="h">Model lab</h2><span class="sub">ideas tested on the last two seasons before they go live</span></div>
    <p class="dnote rpad" style="margin-top:0">SWISH replays the 2025-26 season night by night (and checks on 2024-25), using only the games before each night, then compares its guesses with what happened — about 110,000 projections, no bets involved. An idea only goes live if it's better on both seasons. Lower misses and a lower accuracy score are better; small numbers matter because they're averaged over tens of thousands of games.</p>
    <div class="lab-list">${rows}</div>
    ${C.length ? `<div class="panel-h" style="border-top:1px solid var(--line)"><h2 class="h" style="font-size:15px">Are the current model's chances honest?</h2><span class="sub">${esc((L.current || {}).modelVersion || "")} · 2025-26 replay · players who played</span></div>
    <table class="rt"><thead><tr><th class="l">SWISH said</th><th>Props</th><th>Expected</th><th>Happened</th><th class="l">&nbsp;</th></tr></thead><tbody>
    ${C.map(b => `<tr><td class="l">${Math.round(b.from*100)}–${Math.round(b.to*100)}%</td><td>${b.n.toLocaleString()}</td><td>${pct(b.predicted, 0)}</td><td><b>${pct(b.actual, 0)}</b></td>
      <td class="l"><span class="calbar"><i class="exp" style="left:${(b.predicted*100).toFixed(0)}%"></i><i class="act" style="width:${(b.actual*100).toFixed(0)}%"></i></span></td></tr>`).join("")}
    </tbody></table>
    <p class="dnote rpad">Still a little overconfident at the top end, measured against pretend lines (each player's recent average) because past bookmaker lines aren't free. On live picks SWISH's chance is 70% bookmaker, which pulls it closer to honest.</p>` : ""}
    ${L.next && L.next.length ? `<div class="panel-h" style="border-top:1px solid var(--line)"><h2 class="h" style="font-size:15px">Next to test</h2></div><ol class="lab-next">${L.next.map(n => `<li>${esc(n)}</li>`).join("")}</ol>` : ""}
  </div>`;
}

      </div>
    </div>
    <div class="panel">
      <div class="panel-h"><h2 class="h">Are SWISH's chances honest?</h2><span class="sub">when SWISH says X%, how often it happened</span></div>
      <table class="rt"><thead><tr><th class="l">SWISH said</th><th>Picks</th><th>Expected</th><th>Happened</th><th class="l">&nbsp;</th></tr></thead><tbody>

/* ---- "Show all" lists: more than 8 items collapse to 8 with a button (clamp = everywhere, clamp-m = phones/tablets) ---- */
const CLAMP_N = 8;
function applyClamps(root = document){
  root.querySelectorAll("[data-clamp]").forEach(el => {
    const key = el.dataset.clamp, mobileOnly = el.classList.contains("clamp-m");
    const anchor = el.tagName === "TBODY" ? el.closest("table") : el;
    const old = anchor.nextElementSibling; if (old && old.classList.contains("clampbtn")) old.remove();
    const items = [...el.children].filter(c => !c.classList.contains("formrow"));
    el.querySelectorAll(":scope > .cl-x").forEach(c => c.classList.remove("cl-x"));
    if (items.length <= CLAMP_N) return;
    const open = state.expanded.has(key);
    if (!open) items.slice(CLAMP_N).forEach(c => { c.classList.add("cl-x"); const n = c.nextElementSibling; if (n && n.classList.contains("formrow")) n.classList.add("cl-x"); });
    anchor.insertAdjacentHTML("afterend", `<button class="clampbtn ${mobileOnly ? "m-only" : ""}" data-clampkey="${esc(key)}" aria-expanded="${open}">${open ? `Show fewer ${ICON_CHEV}` : `Show all ${items.length} ${ICON_CHEV}`}</button>`);
  });
}

function go(view, back){

document.addEventListener("click", e => {

  else if (d.gotoBest) { state.bestTab = "best"; go("props"); setTimeout(() => { const el = $("bestTabs"); if (el) el.scrollIntoView({behavior:"smooth", block:"start"}); }, 80); }
  else if (d.form) { const n = d.form; state.formOpen.has(n) ? state.formOpen.delete(n) : state.formOpen.add(n); renderSections(); const b = document.querySelector(`[data-form="${CSS.escape(n)}"]`); if (b) b.focus({preventScroll:true}); }

    const calm = document.documentElement.classList.contains("calm") || matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (d.pref === "dark" && document.startViewTransition && !calm) {

      h.style.setProperty("--tx", `${r.left + r.width/2}px`); h.style.setProperty("--ty", `${r.top + r.height/2}px`);

    } else apply();
  }
  else if (d.help) openHelp();
  else if (d.close) closeDrawer();
  else if (d.clampkey) { const k = d.clampkey; state.expanded.has(k) ? state.expanded.delete(k) : state.expanded.add(k); const host = document.querySelector(`[data-clamp="${CSS.escape(k)}"]`); applyClamps(host ? host.parentNode : document); }
  else if (d.saveprice) { e.preventDefault(); savePrice(+d.saveprice); }
  else if (d.clearprice) { e.preventDefault(); clearPrice(+d.clearprice); }
  else if (d.prop) openDrawer(+d.prop);

  else if (d.tab) { state.bestTab = d.tab; document.querySelectorAll("#bestTabs button").forEach(b => { const on = b.dataset.tab === d.tab; b.classList.toggle("on", on); b.setAttribute("aria-selected", on); }); renderBest(); }

  else if (d.toggle) { const c = !state.collapsed.has(d.toggle); c ? state.collapsed.add(d.toggle) : state.collapsed.delete(d.toggle); setCollapsed(d.toggle, c); }
  else if (d.expand) { const c = d.expand !== "all"; state.collapsed = c ? new Set(GAMES.map(g => g.id)) : new Set(); GAMES.forEach(g => setCollapsed(g.id, c)); }
  else if (d.clear) { state.q = ""; state.market = "ALL"; state.onlyValue = false; state.hideFlagged = false; render(); }
  else if (d.goto) {

document.addEventListener("submit", e => { const f = e.target.closest("[data-priceform]"); if (f) { e.preventDefault(); savePrice(+f.dataset.priceform); } });
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.closest && e.target.closest("[data-priceform]")) { e.preventDefault(); savePrice(+e.target.closest("[data-priceform]").dataset.priceform); return; }
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test((e.target.tagName || ""));
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("tr[data-goto]")) { e.preventDefault(); e.target.click(); return; }
  if (e.key === "Escape" && state.drawerOpen) { e.preventDefault(); closeDrawer(); return; }
  if (e.key === "Tab" && state.drawerOpen) {           // keep keyboard focus inside the open panel
    const f = [...$("drawer").querySelectorAll("button, [href], input, select, [tabindex]:not([tabindex='-1'])")].filter(el => !el.disabled);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    return;
  }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "/") { if (state.view !== "props") go("props"); e.preventDefault(); setTimeout(() => $("q") && $("q").focus(), 30); }
  else if (e.key === "?") { e.preventDefault(); openHelp(); }
});

(function(){
  const brand = document.querySelector(".brand"), logo = brand.querySelector(".logo"), ball = logo.querySelector(".bball"), rim = logo.querySelector(".hoop .rim");
  const reduced = () => document.documentElement.classList.contains("calm") || matchMedia("(prefers-reduced-motion: reduce)").matches;

    if (logo.classList.contains("shoot") || reduced()) return;
    const L = logo.getBoundingClientRect(), R = rim.getBoundingClientRect(), z = L.width / logo.offsetWidth || 1;
    const cx = (R.left + R.width/2 - L.left) / z, cy = (R.top + R.height/2 - L.top) / z;
    ball.style.offsetPath = `path("M ${cx-118} ${cy+36} C ${cx-80} ${cy-56}, ${cx+1} ${cy-54}, ${cx} ${cy+38}")`;
    logo.classList.add("shoot");
    clearTimeout(scoreTimer);
    scoreTimer = setTimeout(() => {               // ball drops through the net → flashes, crowd, letters wave
      brand.classList.remove("score", "wave"); void brand.offsetWidth; brand.classList.add("lit", "score", "wave");
      clearTimeout(waveTimer);
      // end the wave first (letters are already back at their lifted spot), then ease them down + back to black
      waveTimer = setTimeout(() => { brand.classList.remove("score", "wave"); setTimeout(() => { if (!engaged) brand.classList.remove("lit"); }, 250); }, 1600);
    }, SHOT_MS * 0.74);
  }
  const start = () => { engaged = true; brand.classList.add("lit"); clearTimeout(loopTimer); shoot(); };
  // leaving mid-shot lets that shot finish and celebrate; the letters ease down once the wave is over (no snap)
  const stop  = () => { engaged = false; clearTimeout(loopTimer); if (!logo.classList.contains("shoot") && !brand.classList.contains("wave")) brand.classList.remove("lit"); };
  if (matchMedia("(hover:hover) and (pointer:fine)").matches){
    brand.addEventListener("mouseenter", start);
    brand.addEventListener("mouseleave", stop);
  } else brand.addEventListener("click", () => { engaged = false; clearTimeout(loopTimer); if (!reduced()) brand.classList.add("lit"); shoot(); });   // phones: one show per tap, then back to normal
  brand.addEventListener("focus", () => { if (brand.matches(":focus-visible")) start(); });           // keyboard only
  brand.addEventListener("blur", stop);
  ball.addEventListener("animationend", e => {
    if (e.animationName !== "shotPath") return;
    logo.classList.remove("shoot");
    if (engaged) loopTimer = setTimeout(shoot, GAP_MS);
  });
})();
/* ---- Home header: live clock, next tip-off countdown, rotating tips, count-ups ---- */
const pad = n => String(n).padStart(2, "0");
let tipIdx = 0, ccIdx = 0, ccShown = null;
/* flick through every upcoming tip-off, one every 4 seconds */
setInterval(() => {
  const box = $("ccNext"); if (!box || document.hidden) return;
  const n = GAMES.filter(g => new Date(g.tipoff) > new Date()).length; if (n < 2) return;
  if (document.documentElement.classList.contains("calm")) { ccIdx = (ccIdx + 1) % n; tickClock(); return; }
  box.classList.add("swap");
  setTimeout(() => { ccIdx = (ccIdx + 1) % n; tickClock(); box.classList.remove("swap"); }, 300);
}, 4000);
function tickClock(){
  const hm = $("ccHM"); if (!hm) return;
  const now = new Date();
  hm.innerHTML = `${pad(now.getHours())}<span class="colon">:</span>${pad(now.getMinutes())}`;
  $("ccS").textContent = pad(now.getSeconds());
  const tz = (Intl.DateTimeFormat().resolvedOptions().timeZone || "").split("/").pop().replace(/_/g, " ");
  $("ccZone").textContent = tz;
  const seg = Math.floor(now.getSeconds() / 5);
  document.querySelectorAll(".cc-bar i").forEach(el => el.classList.toggle("on", +el.dataset.seg <= seg));
  const up = GAMES.filter(g => new Date(g.tipoff) > now);
  if (up.length){
    if (ccIdx >= up.length) ccIdx = 0;
    const next = up[ccIdx];
    const d = Math.floor((new Date(next.tipoff) - now) / 1000);
    const h = Math.floor(d / 3600), m = Math.floor(d % 3600 / 60), sc = d % 60;
    const key = next.id + "|" + up.length + "|" + ccIdx;
    if (ccShown !== key || !$("ccGame").firstChild){          // logos only re-drawn when the game shown changes (no blinking)
      ccShown = key;
      $("ccGame").innerHTML = `${tid(next.away,"xs")}${next.away} @ ${tid(next.home,"xs")}${next.home}`;
      $("ccLbl").innerHTML = (ccIdx === 0 ? "Next tip-off" : next.tipoff === up[0].tipoff ? `Also at ${timeFmt(next.tipoff)}` : `Then · ${timeFmt(next.tipoff)}`) + (up.length > 1 ? `<span class="cc-dots">${up.map((_, i) => `<i class="${i === ccIdx ? "on" : ""}"></i>`).join("")}</span>` : "");
    }
    $("ccCount").textContent = h ? `${h}h ${pad(m)}m ${pad(sc)}s` : `${pad(m)}m ${pad(sc)}s`;
    $("ccCount").classList.toggle("soon", d < 3600);
  } else if (ccShown !== "none") {
    ccShown = "none";
    $("ccLbl").textContent = "Next tip-off";
    $("ccGame").textContent = IS_LIVE ? DATA.meta.slateLabel : "Sample slate";
    $("ccCount").textContent = "All tipped off"; $("ccCount").classList.remove("soon");
  }
}
function rotateTip(){
  const el = $("tipText"); if (!el) return;
  el.classList.add("out");
  setTimeout(() => { tipIdx = (tipIdx + 1) % TIPS.length; el.textContent = TIPS[tipIdx]; el.classList.remove("out"); }, 380);
}
function countUp(){
  const calm = document.documentElement.classList.contains("calm") || document.documentElement.classList.contains("noanim") || matchMedia("(prefers-reduced-motion: reduce)").matches;
  document.querySelectorAll("[data-count]").forEach(el => {
    const target = +el.dataset.count; if (calm || !target) { el.textContent = target; return; }
    const t0 = performance.now(), dur = 900;
    const step = t => { const k = Math.min(1, (t - t0) / dur), e = k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2) / 2; el.textContent = Math.round(target * e); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
/* chip explanations: hover or keyboard focus on desktop, tap on phones; tap anywhere else to close */
(function(){
  const box = document.createElement("div"); box.className = "tipbox"; box.setAttribute("role", "tooltip"); document.body.appendChild(box);
  let cur = null, shownAt = 0;
  const show = el => {
    cur = el; shownAt = Date.now(); box.textContent = el.dataset.tip; box.classList.add("on");
    const r = el.getBoundingClientRect(), w = Math.min(260, innerWidth - 24);
    box.style.maxWidth = w + "px";
    const bw = box.offsetWidth, bh = box.offsetHeight;
    box.style.left = Math.max(12, Math.min(innerWidth - bw - 12, r.left + r.width / 2 - bw / 2)) + "px";
    box.style.top = (r.top - bh - 8 > 8 ? r.top - bh - 8 : r.bottom + 8) + "px";
  };
  const hide = () => { cur = null; box.classList.remove("on"); };
  document.addEventListener("mouseover", e => { const el = e.target.closest("[data-tip]"); if (el && el !== cur) show(el); else if (!el && cur && matchMedia("(hover:hover)").matches) hide(); });
  document.addEventListener("focusin", e => { const el = e.target.closest && e.target.closest("[data-tip]"); if (el) show(el); });
  document.addEventListener("focusout", e => { if (cur && e.target === cur) hide(); });
  document.addEventListener("click", e => { const el = e.target.closest("[data-tip]"); if (el){ e.stopPropagation(); el === cur && box.classList.contains("on") && Date.now() - shownAt > 400 ? hide() : show(el); } else if (cur) hide(); }, true);
  addEventListener("scroll", hide, {passive: true});
})();
/* game headers on phones & tablets: brighten as they near the middle of the screen; full colour once you stop there */
(function(){
  const mq = matchMedia("(max-width:960px), (hover:none)");
  let raf = 0, idle = 0;
  const heads = () => document.querySelectorAll(".gsec-h, .ana-h.ghead, .ij-h.ghead");
  function update(){
    raf = 0; if (!mq.matches) return;
    const vh = innerHeight, mid = vh * 0.45;
    heads().forEach(h => {
      const r = h.getBoundingClientRect();
      if (r.bottom < -50 || r.top > vh + 50){ if (h.style.getPropertyValue("--focus")) h.style.setProperty("--focus", "0"); h.classList.remove("settled"); return; }
      const d = Math.abs(r.top + r.height / 2 - mid) / (vh * 0.5);
      const f = Math.max(0, 1 - d); const e = f * f * (3 - 2 * f);     // smooth ease
      h.style.setProperty("--focus", e.toFixed(3));
      if (e < 0.6) h.classList.remove("settled");
    });
  }
  function settle(){ if (!mq.matches) return; heads().forEach(h => { if (+h.style.getPropertyValue("--focus") >= 0.6) h.classList.add("settled"); }); }
  const onScroll = () => { if (!raf) raf = requestAnimationFrame(update); clearTimeout(idle); idle = setTimeout(settle, 350); };
  addEventListener("scroll", onScroll, {passive: true}); addEventListener("resize", onScroll);
  new MutationObserver(() => { onScroll(); }).observe(document.getElementById("page"), {childList: true});
  onScroll();
})();
/* home button (phones): takes you to Home, or back to the top if you're already there */
$("homeBtn").addEventListener("click", () => {
  if (NAV.length && state.view !== "dashboard"){ try { history.back(); } catch(e){ goBack(); } return; }
  if (state.view !== "dashboard") go("dashboard");
  else window.scrollTo({top:0, behavior: document.documentElement.classList.contains("calm") ? "auto" : "smooth"});
});
/* back-to-top: shows after scrolling; on phones it sits just under the sticky header, top right */
(function(){
  const btn = $("toTop"), mq = matchMedia("(max-width:960px)");
  const place = () => { if (mq.matches){ const t = document.querySelector(".top"); btn.style.top = ((t ? t.getBoundingClientRect().bottom : 120) + 10) + "px"; btn.style.bottom = "auto"; } else { btn.style.top = "auto"; btn.style.bottom = ""; } };
  const upd = () => { btn.classList.toggle("show", window.scrollY > 500); place(); };
  addEventListener("scroll", upd, {passive:true}); addEventListener("resize", upd); mq.addEventListener("change", upd);
  btn.addEventListener("click", () => { window.scrollTo({top:0, behavior: document.documentElement.classList.contains("calm") ? "auto" : "smooth"}); });
  upd();
})();
/* fresh data: poll a tiny stamp file. When the automation writes newer data, load it in the background and redraw
   the page in place (no reload): same page, scroll, open prop panel, filters, and the latest live scores.
   Waits until you're not typing or scrolling. Falls back to the old quiet reload only if the slate date changes
   (a new day) or something goes wrong. */
/* Turn animations back on WITHOUT replaying them: removing "noanim" would restart every one-off entrance animation
   (the page "re-loading" look), so jump those straight to their end state. Looping ones (live dots, sheens) keep going. */
function settleAnimations(){
  document.documentElement.classList.remove("noanim");
  try { document.getAnimations().forEach(a => { const it = a.effect && a.effect.getComputedTiming ? a.effect.getComputedTiming().iterations : 1; if (it !== Infinity) a.finish(); }); } catch(e){}
}
/* replace an element's contents only when they actually changed (keeps running animations from restarting) */
function setHTML(el, html){ if (el && el.__html !== html){ el.innerHTML = html; el.__html = html; } }
/* green "data updated" pill: stretches out to say "Updated" for a few seconds after each background refresh */
let UPD_FLASH = 0;
function flashUpdated(){
  const p = $("srcPill"); if (!p) return;
  p.classList.remove("justupd"); void p.offsetWidth; p.classList.add("justupd");
  document.documentElement.classList.add("updflash");
  clearTimeout(flashUpdated.t); flashUpdated.t = setTimeout(() => { p.classList.remove("justupd"); document.documentElement.classList.remove("updflash"); UPD_FLASH = 0; }, 3600);
}
function loadScript(src){ return new Promise((ok, bad) => { const s = document.createElement("script"); s.src = src; s.onload = () => { s.remove(); ok(); }; s.onerror = () => { s.remove(); bad(new Error("load " + src)); }; document.head.appendChild(s); }); }
async function refreshInPlace(){
  const t = Date.now();
  const before = LIVE;
  window.SWISH_LIVE = null;
  await loadScript("data/live.js?t=" + t);
  const nl = window.SWISH_LIVE;
  if (!nl || !nl.meta || !Array.isArray(nl.games) || !nl.games.length) { window.SWISH_LIVE = before; throw new Error("no data"); }
  if (!before || !before.meta || nl.meta.slateDate !== before.meta.slateDate) throw new Error("new slate");   // a new day → full reload
  try { await loadScript("data/results.js?t=" + t); } catch(e){}                                           // results are optional
  try { await loadScript("data/lab.js?t=" + t); } catch(e){}
  // keep live scores the browser already has if they're ahead of the file
  const rank = s => s === "post" ? 2 : s === "in" ? 1 : 0;
  const keep = LS.ok ? DATA.games.map(g => ({id: g.id, state: g.state, a: g.awayScore, h: g.homeScore, clock: g.clock, status: g.status})) : [];
  const y = window.scrollY, dr = $("drawer"), dy = dr ? dr.scrollTop : 0, openId = state.drawer;
  LIVE = nl;
  applyLive();
  keep.forEach(x => { const g = DATA.games.find(z => z.id === x.id); if (!g) return;
    if (rank(x.state) > rank(g.state) || (x.state === g.state && (+x.a + +x.h) > (+g.awayScore + +g.homeScore))){
      g.state = x.state; g.awayScore = x.a; g.homeScore = x.h; g.clock = x.clock; g.status = x.status; } });
  indexGames();
  GAMES.length = 0; GAMES.push(...[...DATA.games].sort((a,b) => new Date(a.tipoff) - new Date(b.tipoff)));
  PLAYERS.length = 0; PLAYERS.push(...buildLivePlayers());
  PLAYER_BY_NAME.clear(); PLAYERS.forEach(pl => PLAYER_BY_NAME.set(pl.name, pl));
  buildAllProps();
  STARTERS.clear(); starterSet().forEach((v, k) => STARTERS.set(k, v));
  document.documentElement.classList.add("noanim");
  render();
  UPD_FLASH = Date.now();
  window.scrollTo(0, y);
  if (openId && openId !== "help" && PROP_BY_ID.has(openId)){ openDrawer(openId); const d2 = $("drawer"); if (d2) d2.scrollTop = dy; }
  settleAnimations();
  flashUpdated();
  return nl.meta.writtenAt;
}
(function(){
  if (!LIVE || !LIVE.meta) return;
  let loaded = new Date(LIVE.meta.writtenAt);
  let pending = false, lastTouch = 0, retry = null, waitingSince = 0;
  ["scroll","touchstart","pointerdown","keydown","wheel"].forEach(ev => addEventListener(ev, () => { lastTouch = Date.now(); }, {passive:true}));
  function reloadQuietly(){
    const dr = $("drawer");
    const snap = {y: window.scrollY, drawer: state.drawer, dy: dr ? dr.scrollTop : 0, market: state.market, q: state.q, sort: state.sort,
      onlyValue: state.onlyValue, hideFlagged: state.hideFlagged, bestTab: state.bestTab, showForm: state.showForm,
      collapsed: [...state.collapsed], formOpen: [...state.formOpen], expanded: [...state.expanded],
      scores: LS.ok ? DATA.games.map(g => ({id: g.id, state: g.state, a: g.awayScore, h: g.homeScore, clock: g.clock, status: g.status})) : null, at: Date.now()};
    try { sessionStorage.setItem("swish.silent", JSON.stringify(snap)); } catch(e){}
    location.reload();
  }
  async function swap(){
    clearTimeout(retry);
    if (!waitingSince) waitingSince = Date.now();
    const typing = /^(INPUT|SELECT|TEXTAREA)$/.test((document.activeElement || {}).tagName || "");
    // wait for a pause in scrolling — but never more than 20 s (the in-place update keeps your place anyway)
    const busy = Date.now() - lastTouch < 1500 && Date.now() - waitingSince < 20000;
    if (document.hidden || typing || busy){ retry = setTimeout(swap, 1500); return; }
    if (!IS_LIVE) return reloadQuietly();
    try { const at = await refreshInPlace(); loaded = new Date(at); pending = false; waitingSince = 0; }
    catch(e){ reloadQuietly(); }
  }
  async function check(){
    if (pending) return;
    try {
      const r = await fetch("data/stamp.json?t=" + Date.now(), {cache: "no-store"}); if (!r.ok) return;
      const st = await r.json();
      if (st.writtenAt && new Date(st.writtenAt) > loaded){ pending = true; swap(); }
    } catch(e){}
  }
  setInterval(check, 20000);                                       // tiny file: checking often costs nothing
  // coming back to the page (other app, unlocked phone, back button): check straight away — iPhone Safari doesn't always
  // send "visibilitychange", so listen for focus and pageshow too
  document.addEventListener("visibilitychange", () => { if (!document.hidden) check(); });
  addEventListener("focus", check);
  addEventListener("pageshow", check);
})();
/* coming back from a quiet data swap: restore what you were looking at */
const SILENT = (() => { try { const v = sessionStorage.getItem("swish.silent"); sessionStorage.removeItem("swish.silent"); return v ? JSON.parse(v) : null; } catch(e){ return null; } })();
if (SILENT && Date.now() - SILENT.at < 60000){
  ["market","q","sort","onlyValue","hideFlagged","bestTab","showForm"].forEach(k => { if (SILENT[k] !== undefined) state[k] = SILENT[k]; });
  state.collapsed = new Set(SILENT.collapsed || []); state.formOpen = new Set(SILENT.formOpen || []); state.expanded = new Set(SILENT.expanded || []);
  (SILENT.scores || []).forEach(x => {            // keep live scores that are newer than the data file
    const g = DATA.games.find(y => y.id === x.id); if (!g) return;
    const rank = s => s === "post" ? 2 : s === "in" ? 1 : 0;
    if (rank(x.state) > rank(g.state) || (x.state === g.state && (+x.a + +x.h) > (+g.awayScore + +g.homeScore))){
      g.state = x.state; g.awayScore = x.a; g.homeScore = x.h; g.clock = x.clock; g.status = x.status;
    }
  });
}
setInterval(tickClock, 1000);
setInterval(() => { if (!document.hidden && !document.documentElement.classList.contains("calm")) rotateTip(); }, 6000);
render();
document.documentElement.classList.add("ready");   // built — show it
if (SILENT && Date.now() - SILENT.at < 60000){
  window.scrollTo(0, SILENT.y || 0);
  if (SILENT.drawer && SILENT.drawer !== "help" && PROP_BY_ID.has(SILENT.drawer)){ openDrawer(SILENT.drawer); const dr = $("drawer"); if (dr) dr.scrollTop = SILENT.dy || 0; }
  else if (SILENT.drawer === "help") openHelp();
}
if (document.documentElement.classList.contains("noanim")){ settleAnimations(); if (SILENT && Date.now() - SILENT.at < 60000) flashUpdated(); }   // quiet reload: don't replay entrances
pollScores();
