<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<script>setTimeout(function(){document.documentElement.classList.add("ready")},3000);try{if(sessionStorage.getItem("swish.silent"))document.documentElement.classList.add("noanim")}catch(e){}try{var d=localStorage.getItem("swish.pref.dark");if(d==="1"||(d===null&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("dark")}catch(e){}</script>
<title>swish · NBA Prop Analytics</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Unbounded:wght@400;600;800&family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,900&display=swap" rel="stylesheet">
<style>
/* =================================================================
   SWISH — Stage 1.4 · sidebar layout · white & red · squad view
   Static HTML · sample data only
   ================================================================= */
:root{
  --bg:#f6f7f9; --white:#ffffff; --surface2:#fafbfc; --sunk:#f1f3f6; --sunk2:#e8ebef;
  --line:#e5e8ec; --line2:#d3d8de;
  --ink:#121417; --ink2:#3d434b; --muted:#6c747f; --faint:#a1a8b2;
  --red:#b3121f; --red-dark:#8f0e18; --red-soft:#fdeff0; --red-line:#f1c6ca;
  --over:#0b7d52; --over-soft:#e8f6ef;
  --under:#2453cf; --under-soft:#ebf0fc;
  --amber:#a35a06; --amber-soft:#fdf4e4; --amber-line:#f1d7a8;
  --orange:#c2410c; --orange-soft:#fdefe7;
  --r:14px; --r-sm:9px;
  --shadow:0 1px 2px rgba(18,20,23,.04),0 4px 14px rgba(18,20,23,.04);
  --shadow-h:0 2px 4px rgba(18,20,23,.05),0 10px 28px rgba(18,20,23,.08);
  --display:'Barlow Condensed','Arial Narrow',sans-serif;
  --sans:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#f2f3f6;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.r{text-align:right}

/* ---------------- Shell ---------------- */
.app{display:grid;grid-template-columns:284px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:26px 16px;border-right:1px solid var(--line);background:var(--white);display:flex;flex-direction:column}
.brand{padding:2px 10px 28px}
.wordmark{display:inline-block;font:italic 900 34px/1 var(--sans);letter-spacing:-.045em;color:var(--ink);transform:skewX(-4deg);padding-right:4px}
.brand small{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--muted);letter-spacing:.09em;margin-top:7px;font-weight:600}
.brand small::before{content:"";width:14px;height:3px;border-radius:2px;background:var(--red)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{white-space:nowrap;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--ink2);font-weight:500;text-align:left;transition:background .15s var(--ease),color .15s var(--ease)}
.nav button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;opacity:.75}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button.on{background:var(--red-soft);color:var(--red);font-weight:700}
.nav button.on svg{opacity:1}
.nav .count{margin-left:auto;font-size:11.5px;color:var(--faint);font-weight:600}
.nav button.on .count{color:var(--red)}
.nav .count.alert{color:#fff;background:var(--red);border-radius:99px;padding:1px 7px}
.side-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.55}
.side-foot b{color:var(--ink2);font-weight:600}
.main{min-width:0}
.top{display:flex;align-items:center;gap:14px;padding:15px 40px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.92);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20}
.crumb{font-weight:600}
.crumb span{color:var(--faint);font-weight:500;margin:0 6px}
[hidden]{display:none!important}
/* the page stays invisible until it has been built from the data — no placeholders, empty pills or sample text ever
   flash up while it loads (a safety timer shows it anyway after 3 s if something goes wrong) */
html:not(.ready) .app{visibility:hidden}
.sample-pill{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber-line);padding:5px 10px;border-radius:99px}
.sample-pill i{width:6px;height:6px;border-radius:50%;background:#e08a0b}
.sample-pill.live-pill{color:#1f8a4c;background:rgba(31,138,76,.09);border-color:rgba(31,138,76,.28)}
.sample-pill.live-pill i{background:#1f8a4c;box-shadow:0 0 0 3px rgba(31,138,76,.18)}
.notice.live{border-color:rgba(31,138,76,.28);background:rgba(31,138,76,.06)}
.notice.live b{color:#1f8a4c}
.pform{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:6px}
.pform label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
.pform input{font:inherit;font-size:15px;font-variant-numeric:tabular-nums;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--white);color:var(--ink);min-width:0}
.pform input:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.pform-act{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.pform-msg{font-size:12.5px;color:var(--red);min-height:1em}
.cell.noline b{color:var(--faint)}
.cell.noline small{color:var(--muted)}
.cell{position:relative}
.lm{position:absolute;top:2px;right:4px;font:800 8px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;font-style:normal;pointer-events:none}
.lm-up,.lm-down{color:var(--amber)}
.lm-new{color:var(--exp)}
.nlw{font:800 9px/1.4 var(--sans)!important;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.cell.noline small.nlw-out,.nlw-out{color:var(--red)}
.cell.noline small.nlw-q,.nlw-q{color:var(--amber)}
.cell.noline small.nlw-mkt,.nlw-mkt{color:var(--exp)}
.cell.noline small.nlw-none,.nlw-none{color:var(--faint)}
.cell.noline small.nlw-skip,.nlw-skip{color:var(--faint);opacity:.7;font-weight:700!important}
.lg-nl .nlw{margin:0 2px}
details.optprice summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);padding:4px 0}
details.optprice summary::-webkit-details-marker{display:none}
details.optprice summary::before{content:"+";display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--line2);font-size:13px;line-height:1}
details.optprice[open] summary::before{content:"−"}
details.optprice summary:hover{color:var(--ink)}
@media (max-width:520px){.pform{grid-template-columns:1fr 1fr}}
.top-right{margin-left:auto}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{padding:5px 11px;border-radius:6px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--white);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.page{padding:32px 40px 70px;max-width:1440px}

/* ---------------- Type & common ---------------- */
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1.title{font:700 42px/1.02 var(--display);letter-spacing:.005em;margin-top:6px}
.lede{color:var(--ink2);margin-top:6px;font-size:15px}
.lede-wait{color:var(--ink3,var(--ink2));opacity:.8;white-space:nowrap}
h2.h{font:700 22px/1.1 var(--display);letter-spacing:.01em}
.sub{color:var(--muted);font-size:13px}
.notice{margin:20px 0 24px;padding:12px 16px;border-radius:var(--r-sm);background:var(--white);border:1px solid var(--line);border-left:3px solid var(--red);font-size:13px;color:var(--ink2)}
.notice b{color:var(--ink)}
.panel{background:var(--white);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.panel-h{display:flex;align-items:center;gap:12px;padding:16px 20px 12px}
.panel-h .sub{margin-left:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:9px;border:1px solid var(--line2);background:var(--white);font-weight:600;font-size:13px;transition:border-color .15s var(--ease),background .15s var(--ease);white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red:hover{background:var(--red-dark)}
.gempty{padding:20px;color:var(--muted);font-size:13px;text-align:center}
.tid{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;flex-shrink:0;font:700 10px/1 var(--sans);color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.tid.sm{width:22px;height:22px;font-size:8.5px}
.tid.lg{width:40px;height:40px;font-size:12px}
.pos{color:var(--over)} .neg{color:var(--faint)} .negr{color:var(--red)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.st.out{color:#fff;background:var(--red)}
/* status taken from a newer reporter note than ESPN's status field: a small blip on the pill (tap/hover explains) */
.st.upd{position:relative;cursor:help;outline:none}
/* not confirmed yet: same colour, outline only */
.st.unconf{background:transparent!important;color:var(--muted)!important;box-shadow:inset 0 0 0 1.5px currentColor;cursor:help;outline:none}
.st.out.unconf{color:var(--red)!important}.st.doubtful.unconf{color:var(--orange)!important}.st.questionable.unconf{color:var(--amber)!important}
.st.upd::after{content:"";position:absolute;top:-3px;right:-3px;width:7px;height:7px;border-radius:50%;background:var(--under);box-shadow:0 0 0 2px var(--surface)}
.st.upd:focus-visible{box-shadow:0 0 0 2px var(--red)}
.st.doubtful{color:var(--orange);background:var(--orange-soft)}
.st.questionable{color:var(--amber);background:var(--amber-soft)}
.st.probable{color:var(--over);background:var(--over-soft)}
.st.neutral{color:var(--muted);background:var(--sunk)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--ink2);background:var(--sunk);border-radius:7px;padding:4px 9px;white-space:nowrap}
.tag.red{color:var(--red);background:var(--red-soft)}
.tag.amber{color:var(--amber);background:var(--amber-soft)}
.matchup{display:flex;align-items:center;gap:14px}
.matchup .tm{display:flex;align-items:center;gap:10px}
.matchup .tm b{font:700 21px/1 var(--display);letter-spacing:.01em}
.matchup .tm small{display:block;font:500 11.5px var(--sans);color:var(--muted);margin-top:3px}
.matchup .at{font:700 14px var(--display);color:var(--faint)}

/* ---------------- Dashboard ---------------- */
.overview{display:grid;grid-template-columns:repeat(5,1fr);background:var(--white);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:28px}
.ov{padding:16px 20px;border-left:1px solid var(--line)}
.ov:first-child{border-left:0}
.ov .v{font:700 34px/1 var(--display);margin-top:8px}
.ov .v.red{color:var(--red)}
.ov .s{font-size:12px;color:var(--muted);margin-top:4px}
.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:22px;align-items:start}
.mrow{display:grid;grid-template-columns:92px 1fr auto 16px;gap:16px;align-items:center;width:100%;padding:13px 20px;border-top:1px solid var(--line);text-align:left;transition:background .15s var(--ease)}
.mrow:hover{background:var(--surface2)}
.mrow .t{font:700 19px/1 var(--display)}
.mrow .t small{display:block;font:500 11px var(--sans);color:var(--faint);margin-top:4px}
.ti{display:flex;align-items:center;gap:9px;font-weight:600;margin:3px 0}
.ti small{color:var(--faint);font-weight:500;font-size:12px}
.mrow .meta{font-size:12px;color:var(--muted);text-align:right}
.mrow .meta b{display:block;color:var(--ink);font-size:13px}
.mrow .meta .inj{color:var(--red);font-weight:600}
.arrow{color:var(--faint)}
.irow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 20px;border-top:1px solid var(--line);text-align:left;transition:background .15s var(--ease)}
.irow:hover{background:var(--surface2)}
.irow .nm{font-weight:600}
.irow .ds{font-size:12px;color:var(--muted)}
.irow .st{margin-left:auto}

/* ---------------- Pick lists (dashboard + best picks) ---------------- */
.tabs{display:flex;gap:4px;padding:0 16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{padding:11px 10px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--red);border-bottom-color:var(--red)}
.tabs button .c{font-size:11px;color:var(--faint);margin-left:4px}
.tabdesc{padding:10px 20px;font-size:12px;color:var(--muted);background:var(--surface2);border-bottom:1px solid var(--line)}
.plist-h,.prow2{display:grid;grid-template-columns:28px minmax(160px,1.5fr) minmax(150px,1.3fr) 58px 60px 66px 128px 108px 16px;gap:12px;align-items:center;padding:0 20px}
.plist-h{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-top:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.prow2{width:100%;text-align:left;padding-top:10px;padding-bottom:10px;border-bottom:1px solid var(--line);transition:background .12s var(--ease)}
.prow2:last-child{border-bottom:0}
.prow2:hover{background:var(--surface2)}
.prow2 .rk{font:700 16px var(--display);color:var(--red)}
.prow2 .pl{display:flex;align-items:center;gap:9px;min-width:0}
.prow2 .pl b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow2 .pl small{font-size:11.5px;color:var(--muted)}
.pick{font-weight:700;font-size:13.5px}
.pick small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.pick .o{color:var(--over)} .pick .u{color:var(--under)}
.prow2 .n{font:700 17px var(--display);text-align:right}
.prow2 .n small{display:block;font:500 10.5px var(--sans);color:var(--faint)}
.prow2 .chev2{color:var(--faint)}
.minibar{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.minibar b{font:700 17px var(--display);text-align:right}
.minibar .tr{height:4px;border-radius:9px;background:var(--sunk2);position:relative}
.minibar .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:9px}

/* ---------------- Props page: toolbar ---------------- */
.toolbar{position:sticky;top:62px;z-index:10;display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 0;margin:6px 0 0;background:var(--bg);border-bottom:1px solid var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:99px;border:1px solid var(--line2);background:var(--white);font-size:12.5px;font-weight:600;color:var(--ink2);transition:.15s var(--ease)}
.chip:hover{border-color:var(--ink2)}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{display:flex;align-items:center;gap:7px;background:var(--white);border:1px solid var(--line2);border-radius:9px;padding:0 11px;height:36px}
.field:focus-within{border-color:var(--ink2)}
.field svg{width:15px;height:15px;stroke:var(--faint);fill:none;stroke-width:2}
.field input,.field select{border:0;outline:0;background:none;font:500 13px var(--sans);color:var(--ink);height:100%}
.field input{width:170px}
.field select{cursor:pointer}
.subtools{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0 16px;flex-wrap:wrap}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend .cellx{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:46px;height:34px;border:1px solid var(--line);border-radius:7px;background:var(--white);line-height:1.1}
.legend .cellx b{font:700 14px var(--display);color:var(--ink)}
.legend .cellx small{font-size:10px;font-weight:700;color:var(--over)}
.legend .sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.check{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2);font-weight:500;cursor:pointer;user-select:none}
.check input{accent-color:var(--red)}
.textbtn{font-size:12.5px;font-weight:600;color:var(--red);padding:5px 6px;border-radius:7px}
.textbtn:hover{background:var(--red-soft)}

/* ---------------- Game section ---------------- */
.gsec{background:var(--white);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden;scroll-margin-top:130px}
.gsec-h{display:grid;grid-template-columns:auto 1fr auto 30px;gap:20px;align-items:center;width:100%;padding:14px 20px;text-align:left;transition:background .15s var(--ease);border-bottom:1px solid var(--line)}
.gsec-h:hover{background:var(--surface2)}
.gsec.collapsed .gsec-h{border-bottom:0}
.gtags{display:flex;gap:6px;flex-wrap:wrap}
.gcount{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.gcount b{color:var(--ink);font-weight:700}
.gcount .v{display:block;color:var(--red);font-weight:700}
.chev{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--line);transition:transform .2s var(--ease)}
.chev svg{width:14px;height:14px;stroke:var(--ink2);fill:none;stroke-width:2.2}
.gsec.collapsed .chev{transform:rotate(-90deg)}
.gwrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows .42s var(--ease)}
.gwrap > .gbody{min-height:0;overflow:hidden}
.gsec.collapsed .gwrap{grid-template-rows:0fr}
.gbody{display:grid;grid-template-columns:1fr 1fr}
.gbody.single{grid-template-columns:1fr}
.squad{min-width:0;border-left:1px solid var(--line)}
.squad:first-child{border-left:0}
.gbody.single .squad{border-left:0;border-top:1px solid var(--line)}
.gbody.single .squad:first-child{border-top:0}
.sq-h{display:flex;align-items:center;gap:9px;padding:12px 16px;background:var(--surface2);border-bottom:1px solid var(--line)}
.sq-h b{font:700 16px/1 var(--display);letter-spacing:.05em;text-transform:uppercase}
.sq-h .sub{margin-left:auto;font-size:11.5px}

/* squad matrix (all markets) */
.sqt{width:100%;border-collapse:collapse;table-layout:fixed}
.sqt th{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:8px 4px;border-bottom:1px solid var(--line);text-align:center}
.sqt th:first-child{text-align:left;padding-left:16px;width:auto}
.sqt th.min{width:44px}
.sqt th.mk{width:62px}
.sqt td{padding:4px 3px;border-bottom:1px solid var(--line);vertical-align:middle;text-align:center}
.sqt tr:last-child td{border-bottom:0}
.sqt td.pl{text-align:left;padding:7px 6px 7px 16px}
.sqt td.pl b{display:block;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sqt td.pl small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sqt td.pl small.boost{color:var(--over);font-weight:600}
.sqt td.pl small.warn{color:var(--amber);font-weight:600}
.sqt td.min{font:600 14px var(--display);color:var(--ink2)}
.sqt td.min.up{color:var(--over)}
.sqt tr.out td{background:repeating-linear-gradient(135deg,#fff,#fff 6px,#fafafa 6px,#fafafa 12px)}
.sqt tr.out td.pl b{color:var(--muted);text-decoration:line-through}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:40px;border:1px solid transparent;border-radius:7px;line-height:1.1;transition:background .12s var(--ease),border-color .12s var(--ease);position:relative}
.cell:hover{background:var(--sunk);border-color:var(--line2)}
.cell b{font:700 16px var(--display)}
.cell small{font-size:10.5px;font-weight:700;margin-top:2px;white-space:nowrap}
.cell small.over{color:var(--over)} .cell small.under{color:var(--under)} .cell small.none{color:var(--faint)}
.cell.value{background:var(--red-soft);border-color:var(--red-line)}
.cell.value::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--red)}
.cell.value:hover{border-color:var(--red)}
.cell.flagged b{color:var(--faint)}
.cell.flagged small{color:var(--amber)}
.dash{color:var(--line2);font-weight:600}

/* single-market table */
.smt-h,.smt-r{display:grid;grid-template-columns:minmax(160px,1.5fr) 44px 60px 66px 66px 64px minmax(150px,1fr) 108px 150px 56px 16px;gap:10px;align-items:center;padding:0 16px}
.smt-h{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-top:9px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.smt-r{width:100%;text-align:left;padding-top:9px;padding-bottom:9px;border-bottom:1px solid var(--line);transition:background .12s var(--ease);position:relative}
.smt-r:last-child{border-bottom:0}
.smt-r:hover{background:var(--surface2)}
.smt-r.value::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--red)}
.smt-r .pl b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.smt-r .pl small{font-size:11px;color:var(--muted)}
.smt-r .pl small.warn{color:var(--amber);font-weight:600}
.smt-r .pl small.boost{color:var(--over);font-weight:600}
.smt-r .big{font:700 19px var(--display);text-align:right}
.smt-r .proj{color:var(--red)}
.smt-r .odd{text-align:right}
.smt-r .odd span{display:inline-block;font:600 15px var(--display);padding:2px 6px;border-radius:5px;color:var(--ink2)}
.smt-r .odd.lo span{background:var(--over-soft);color:var(--over);font-weight:700}
.smt-r .odd.lu span{background:var(--under-soft);color:var(--under);font-weight:700}
.smt-r .edge{font:700 16px var(--display);text-align:right}
.smt-r.value .edge{color:var(--red)}
.smt-r .mins{font:600 14px var(--display);text-align:right;color:var(--ink2)}
.smt-r .mins.up{color:var(--over)}

/* ---------------- Drawer ---------------- */
.scrim{position:fixed;inset:0;background:rgba(18,20,23,.28);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--white);z-index:60;box-shadow:-12px 0 40px rgba(18,20,23,.14);transform:translateX(100%);transition:transform .25s var(--ease);overflow-y:auto}
.drawer.on{transform:none}
.dr-h{position:sticky;top:0;background:var(--white);display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line);z-index:2}
.dr-h .av{width:40px;height:40px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--ink2)}
.dr-h b{display:block;font-size:17px;font-weight:700}
.dr-h small{font-size:12.5px;color:var(--muted)}
.dr-h .x{margin-left:auto;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;font-size:18px;color:var(--ink2)}
.dr-h .x:hover{border-color:var(--ink2)}
.dr-b{padding:18px 22px 40px}
.dr-mk{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.dr-mk b{font:700 20px var(--display);letter-spacing:.04em;text-transform:uppercase}
.bignums{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.bignums div{padding:12px 10px;text-align:center;border-left:1px solid var(--line)}
.bignums div:first-child{border-left:0;background:var(--surface2)}
.bignums span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bignums b{display:block;font:700 38px/1 var(--display);margin:6px 0 3px}
.bignums small{font-size:11px;color:var(--faint)}
.bignums .proj{color:var(--red)}
.diff.up{color:var(--over)} .diff.down{color:var(--under)} .diff.flat{color:var(--faint)}
.oddsrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.ob{border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;position:relative}
.ob .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ob .pr{font:700 26px/1 var(--display)}
.ob.lo{border-color:var(--over);background:var(--over-soft)} .ob.lo .lbl{color:var(--over)}
.ob.lu{border-color:var(--under);background:var(--under-soft)} .ob.lu .lbl{color:var(--under)}
.ob .flag{position:absolute;top:-9px;left:10px;font-size:9.5px;font-weight:800;letter-spacing:.08em;padding:2px 7px;border-radius:99px;color:#fff;text-transform:uppercase}
.ob.lo .flag{background:var(--over)} .ob.lu .flag{background:var(--under)}
.probwrap{margin-top:16px}
.probtop{display:flex;align-items:baseline;justify-content:space-between}
.probtop span{font-size:13px;color:var(--ink2);font-weight:600}
.probtop b{font:700 28px/1 var(--display)}
.pbar{position:relative;height:9px;border-radius:99px;background:var(--sunk2);margin-top:8px}
.pbar i{display:block;height:100%;border-radius:99px}
.pbar .mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:2px}
.pbar-l{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:6px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.trio div{background:var(--sunk);border-radius:10px;padding:8px 10px}
.trio span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.trio b{font:700 21px/1.15 var(--display)}
.pnote{margin-top:12px;padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.45}
.pnote.warn{background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber-line)}
.pnote.info{background:var(--sunk);color:var(--ink2)}
.dsec{margin-top:22px}
.dt{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.build{border:1px solid var(--line);border-radius:11px;overflow:hidden}
.build .st2{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-top:1px solid var(--line);font-size:13px}
.build .st2:first-child{border-top:0}
.build .st2 span{color:var(--ink2);font-weight:500}
.build .st2 small{display:block;color:var(--faint);font-size:11px}
.build .st2 b{font:700 19px var(--display)}
.build .st2.total{background:var(--red);color:#fff}
.build .st2.total span{color:#fff;font-weight:600}
.build .st2.total b{font-size:23px}
.build .st2.na b{color:var(--faint);text-decoration:line-through}
.kv{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.kv b{font-weight:600}
.hlist{display:flex;flex-direction:column;gap:6px}
.hl{display:grid;grid-template-columns:84px 1fr 40px;align-items:center;gap:10px;font-size:12.5px}
.hl span{color:var(--muted)}
.hl .bar{height:8px;border-radius:99px;background:var(--sunk2);position:relative}
.hl .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--line2)}
.hl .bar i.hit{background:var(--ink)}
.hl .bar .ln{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--red)}
.hl b{text-align:right;font:700 17px var(--display)}
.spark{position:relative;height:66px;display:flex;align-items:flex-end;gap:5px;padding-top:6px}
.spark i{flex:1;border-radius:3px 3px 0 0;min-height:3px;background:var(--line2)}
.spark i.hit{background:var(--ink)}
.spark .ln{position:absolute;left:0;right:0;border-top:2px dashed var(--red)}
.spark-x{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:6px}
.dnote{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.5}
.others{display:flex;flex-wrap:wrap;gap:6px}
.others button{font-size:12px;font-weight:600;padding:5px 9px;border-radius:7px;border:1px solid var(--line);background:var(--white)}
.others button:hover{border-color:var(--ink2)}
.others button.value{border-color:var(--red-line);background:var(--red-soft);color:var(--red)}

/* ---------------- Games & Analysis ---------------- */
.ana{background:var(--white);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-top:20px;overflow:hidden}
.ana-h{display:flex;align-items:center;gap:18px;padding:16px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ana-h .right{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ana-b{display:grid;grid-template-columns:1.05fr 1fr 1.1fr}
.ana-b > div{padding:18px 22px;border-left:1px solid var(--line)}
.ana-b > div:first-child{border-left:0}
.rec{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.rec b{font:700 30px/1 var(--display)}
.rec span{font-size:12.5px;color:var(--muted)}
.mtg{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.mtg .d{color:var(--muted);font-size:12px}
.mtg .sc{display:flex;gap:7px;align-items:center;font-weight:600}
.mtg .sc b{font:700 17px var(--display)}
.mtg .sc .w{color:var(--ink)} .mtg .sc .l{color:var(--faint)}
.mtg .tot{font-size:12px;color:var(--muted);text-align:right}
.insight{margin-top:10px;padding:10px 12px;border-radius:9px;background:var(--sunk);font-size:12.5px;color:var(--ink2)}
.insight b{color:var(--ink)}
.cmp-h,.cmp{display:grid;grid-template-columns:1fr 92px 1fr;gap:10px;align-items:center}
.cmp-h{margin-bottom:4px}
.cmp-h div{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13px}
.cmp-h div:first-child{justify-content:flex-end}
.cmp{padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.cmp .lab{text-align:center;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cmp .a{text-align:right}
.cmp b{font:700 18px var(--display);color:var(--ink2)}
.cmp b.better{color:var(--red)}
.notes{list-style:none;display:flex;flex-direction:column;gap:8px}
.notes li{position:relative;padding-left:15px;font-size:13px;color:var(--ink2);line-height:1.5}
.notes li::before{content:"";position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:2px;background:var(--red)}
.ptrend{display:grid;grid-template-columns:1fr auto 48px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13px;width:100%;text-align:left}
.ptrend:hover .nm{color:var(--red)}
.ptrend .nm{font-weight:600}
.ptrend small{display:block;color:var(--muted);font-size:11.5px}
.ptrend b{font:700 18px var(--display);text-align:right}
.ptrend .vs{font-size:11.5px;color:var(--muted);text-align:right}

/* ---------------- Injuries ---------------- */
.ij{background:var(--white);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-top:18px;overflow:hidden}
.ij-h{display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ij-h .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.lineup{padding:9px 22px;background:var(--amber-soft);border-bottom:1px solid var(--amber-line);font-size:12.5px;color:var(--amber)}
.lineup b{font-weight:700}
.ij-b{display:grid;grid-template-columns:1fr 1fr}
.ij-b > div{padding:16px 22px 20px;border-left:1px solid var(--line)}
.ij-b > div:first-child{border-left:0}
.ij-team{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.ij-team b{font:700 16px/1 var(--display);letter-spacing:.05em;text-transform:uppercase}
.injc{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:10px}
.injc.out{border-color:var(--red-line)}
.inj-top{display:flex;align-items:center;gap:11px;padding:11px 13px}
.inj-top .av{width:34px;height:34px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink2)}
.inj-top .nm{font-weight:700;font-size:14.5px}
.inj-top small{display:block;font-size:12px;color:var(--muted)}
.inj-top .st{margin-left:auto}
.inj-meta{padding:0 13px 10px 58px;font-size:11.5px;color:var(--faint)}
.fill{background:var(--surface2);border-top:1px solid var(--line);padding:10px 13px}
.fill .dt{margin-bottom:6px}
.fi{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:7px 0;border-top:1px dashed var(--line)}
.fill .dt + .fi{border-top:0}
.fi .nm{font-weight:600;font-size:13.5px}
.fi .mins{font:700 17px var(--display);text-align:right}
.fi .mins i{font-style:normal;color:var(--over)}
.fi .note{grid-column:1/-1;font-size:12px;color:var(--muted)}
.affects{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.affects button{font-size:11.5px;font-weight:600;color:var(--red);background:var(--white);border:1px solid var(--red-line);border-radius:7px;padding:3px 8px}
.affects button:hover{background:var(--red-soft)}
.noinj{padding:14px;border:1px dashed var(--line2);border-radius:12px;color:var(--muted);font-size:13px;text-align:center;margin-top:10px}
.legend2{display:flex;gap:8px;flex-wrap:wrap;margin:-6px 0 4px}

/* ---------------- Empty / results ---------------- */
.empty{background:var(--white);border:1px dashed var(--line2);border-radius:var(--r);padding:44px 28px;text-align:center;margin-top:18px}
.empty .ic{width:44px;height:44px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;margin:0 auto 12px}
.empty .ic svg{width:21px;height:21px;stroke:var(--muted);fill:none;stroke-width:1.7}
.empty h3{font:700 22px var(--display)}
.empty p{color:var(--muted);max-width:470px;margin:6px auto 0}
.empty .btn{margin-top:14px}
.rtable{margin-top:22px;background:var(--white);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rhead{display:grid;grid-template-columns:110px 1.6fr 1fr 80px 80px 90px 80px;gap:12px;padding:12px 22px;font-size:11px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line);background:var(--surface2);text-transform:uppercase;letter-spacing:.06em}
.rtable .empty{border:0;margin:0;border-radius:0}
footer{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.6;max-width:860px}

/* ---------------- Responsive ---------------- */
@media (max-width:1320px){
  .gbody{grid-template-columns:1fr}
  .squad{border-left:0;border-top:1px solid var(--line)}
  .squad:first-child{border-top:0}
}
@media (max-width:1180px){
  .overview{grid-template-columns:repeat(3,1fr)}
  .ov:nth-child(4){border-left:0} .ov:nth-child(n+4){border-top:1px solid var(--line)}
  .cols{grid-template-columns:1fr}
  .ana-b{grid-template-columns:1fr 1fr}
  .ana-b > div:nth-child(3){grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}
  .gsec-h{grid-template-columns:1fr auto 30px}
  .gtags{display:none}
  .plist-h{display:none}
  .prow2{grid-template-columns:24px 1fr 1fr 18px;row-gap:6px}
  .prow2 .hide-s{display:none}
}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;height:auto;flex-direction:row;align-items:center;padding:10px 16px;border-right:0;border-bottom:1px solid var(--line);z-index:30;top:0;overflow-x:auto}
  .brand{padding:0 16px 0 0} .wordmark{font-size:26px}
  .brand small,.side-foot,.nav .count:not(.alert){display:none}
  .nav{flex-direction:row}
  .top{top:58px;padding:12px 20px}
  .toolbar{position:static}
  .page{padding:24px 18px 60px}
  .ana-b,.ij-b{grid-template-columns:1fr}
  .ana-b > div,.ij-b > div{border-left:0;border-top:1px solid var(--line)}
  .ana-b > div:first-child,.ij-b > div:first-child{border-top:0}
  .gsec-h{grid-template-columns:1fr 30px;row-gap:8px}
  .gsec-h .matchup{grid-column:1/-1}
  .gcount{text-align:left}
  .smt-h{display:none}
  .smt-r{grid-template-columns:1fr 1fr 1fr;row-gap:8px}
  .smt-r .pl{grid-column:1/-1}
  .smt-r .chev2{display:none}
  .smt-r [data-l]{text-align:left}
  .smt-r [data-l]::before{content:attr(data-l);display:block;font:700 10px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
}
@media (max-width:640px){
  h1.title{font-size:34px}
  .overview{grid-template-columns:1fr 1fr}
  .ov:nth-child(odd){border-left:0} .ov:nth-child(4){border-left:1px solid var(--line)}
  .ov:nth-child(n+3){border-top:1px solid var(--line)}
  .tools{margin-left:0;width:100%} .field{flex:1} .field input{width:100%}
  .crumb,.sample-pill{display:none}
  .matchup .tm small{display:none} .matchup .tm b{font-size:18px}
  .mrow{grid-template-columns:66px 1fr auto} .mrow .arrow{display:none}
  .sqt th.mk{width:44px} .sqt th.min{width:28px}
  .sqt th{font-size:9.5px;padding:8px 2px}
  .cell{min-height:38px} .cell b{font-size:14px} .cell small{font-size:9px}
  .sqt td{padding:3px 1px}
  .sqt td.pl{padding:6px 4px 6px 10px}
  .sqt td.pl b{white-space:normal;font-size:12px;line-height:1.2}
  .sqt td.pl small{white-space:normal;font-size:10px;line-height:1.25}
  .sqt td.min{font-size:12px}
}

/* ================= Stage 1.5 polish ================= */
.brand{display:block;text-align:left;padding:2px 10px 26px;width:100%}
.logo{position:relative;display:inline-block;padding-right:16px;white-space:nowrap}
.wordmark{white-space:nowrap}
.wordmark i{font-style:inherit;display:inline-block;transition:transform .45s var(--ease),color .25s var(--ease);transition-delay:calc(var(--d) * 45ms);animation:rise .6s var(--ease) both;animation-delay:calc(var(--d) * 60ms + .1s)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.brand:hover .wordmark i{transform:translateY(-3px);color:var(--red)}
.ball{position:absolute;right:0;bottom:7px;width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:inset -2px -2px 0 rgba(0,0,0,.18);transform:scale(0)}
.ball::before,.ball::after{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,255,255,.55);clip-path:inset(0 45% 0 45%)}
.ball::after{clip-path:inset(45% 0 45% 0)}
.brand:hover .ball{animation:drop .9s var(--ease) forwards}
@keyframes drop{0%{transform:translate(-70px,-34px) scale(.6) rotate(0)}35%{transform:translate(-26px,-30px) scale(1) rotate(160deg)}62%{transform:translate(0,0) scale(1) rotate(300deg)}78%{transform:translate(2px,-9px) scale(1) rotate(340deg)}100%{transform:translate(0,0) scale(1) rotate(380deg)}}
.swoosh{position:absolute;left:-2px;right:12px;bottom:-9px;height:12px;width:calc(100% - 10px);fill:none;stroke:var(--red);stroke-width:3.2;stroke-linecap:round;stroke-dasharray:130;stroke-dashoffset:130;transition:stroke-dashoffset .55s var(--ease)}
.brand:hover .swoosh{stroke-dashoffset:0}
.brand small{margin-top:12px}
.brand small::before{transition:width .3s var(--ease)}
.brand:hover small::before{width:28px}
.brand:focus-visible{outline:2px solid var(--red);outline-offset:4px;border-radius:8px}

.nav button{position:relative}
.nav button::before{content:"";position:absolute;left:-16px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--red);transform:scaleY(0);transition:transform .22s var(--ease)}
.nav button.on::before{transform:scaleY(1)}
.nav button:hover{background:var(--red-soft);color:var(--red)}
.nav button svg{transition:transform .2s var(--ease),opacity .2s var(--ease)}
.nav button:hover svg{opacity:1;transform:translateX(2px)}
.nav button:hover .count{color:var(--red)}

.side-sec{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}

/* logo */

/* ================= Stage 1.8 · logo show, Last 6 panel, dark mode ================= */
/* --- wordmark: looping linear red/black wipe --- */
/* each letter shares one screen-aligned gradient, so the wipe flows across all letters even while they hop */
/* --- celebration: camera flashes + crowd --- */
:root{--flash:#f5b400;--flash-glow:rgba(255,196,0,.55);--crowd:#c3c8d0;--crowd2:#aab1bb}
.fx{position:absolute;inset:0;pointer-events:none;z-index:3}
.flash{position:absolute;left:var(--x);top:var(--y);width:22px;height:22px;margin:-11px 0 0 -11px;opacity:0;transform:scale(.2)}
.flash::before{content:"";position:absolute;inset:4px;border-radius:50%;background:radial-gradient(circle,#fff 0 22%,var(--flash) 40%,transparent 72%);box-shadow:0 0 14px 4px var(--flash-glow)}
.flash::after{content:"";position:absolute;inset:0;background:linear-gradient(var(--flash),var(--flash)) center/2px 100% no-repeat,linear-gradient(var(--flash),var(--flash)) center/100% 2px no-repeat;transform:rotate(45deg);border-radius:2px}

.brand{position:relative}

.crowd i{position:relative;width:11px;height:19px;transform:translateY(105%)}
.crowd i::before{content:"";position:absolute;left:2px;top:calc(var(--h) * 1px);width:7px;height:7px;border-radius:50%;background:var(--crowd)}
.crowd i::after{content:"";position:absolute;left:0;top:calc(var(--h) * 1px + 6px);width:11px;height:14px;border-radius:6px 6px 0 0;background:var(--crowd2)}
