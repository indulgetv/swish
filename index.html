  const projection = afterH2H + (role && role.applied ? role.value : 0);

  const line = market === "3PM" ? Math.max(0.5, Math.floor(bookMean) + 0.5) : Math.floor(bookMean) + 0.5;
  const bookOver = Math.min(0.64, Math.max(0.36, 1 - normCdf((line - bookMean) / sdOf(bookMean)) + gauss(r) * 0.02));
  const vig = 0.042 + r() * 0.012;
  const over = roundOdds(probToAmericanRaw(Math.min(0.95, bookOver + vig/2)));
  const under = roundOdds(probToAmericanRaw(Math.min(0.95, 1 - bookOver + vig/2)));

  const last10 = pl.log.map(g => g[market]);
  const stale = DATA.staleOdds.includes(pl.name + "|" + market);
  const oddsUpdated = new Date(new Date(DATA.meta.generatedAt) - (stale ? 250 : 5 + Math.floor(r() * 40)) * 60000).toISOString();

  return {id: hashStr(pl.name + market) % 1e9, player:pl.name, team:pl.team, opp:pl.opp, game:g.id, pos:pl.pos, market,

/* Chance of over/under from the projection.
   Counting stats use a negative binomial (skewed right, like real rebound/assist counts);
   big totals use a bell curve. Whole-number lines exclude the push. */
const COUNT_MARKETS = ["REB","AST","3PM","STL","BLK","TOV"];
function nbCdf(k, mean, sd){
  if (k < 0) return 0;
  const v = Math.max(sd * sd, mean * 1.05), r = mean * mean / (v - mean), q = r / (r + mean);
  let pm = Math.pow(q, r), c = pm;
  for (let i = 1; i <= k; i++){ pm *= (i - 1 + r) / i * (1 - q); c += pm; }
  return Math.min(1, c);
}
function pureChance(p){
  let over, under, dist;
  if (COUNT_MARKETS.includes(p.market) && p.projection > 0.05){
    over = 1 - nbCdf(Math.floor(p.line), p.projection, p.sd);
    under = nbCdf(Math.ceil(p.line) - 1, p.projection, p.sd); dist = "count";
  } else {
    const isInt = Number.isInteger(p.line);
    over = 1 - normCdf(((isInt ? p.line + 0.5 : p.line) - p.projection) / p.sd);
    under = normCdf(((isInt ? p.line - 0.5 : p.line) - p.projection) / p.sd); dist = "normal";
  }
  const t = over + under || 1;
  return {over: over / t, dist};
}
function analyse(p){

  const pure = pureChance(p);

  const modelO = MODEL_WEIGHT * pure.over + (1 - MODEL_WEIGHT) * mktO, modelU = 1 - modelO;
  const side = (modelO - mktO) >= (modelU - mktU) ? "over" : "under";
  const modelP = side === "over" ? modelO : modelU;
  const mktP = side === "over" ? mktO : mktU;
  const price = side === "over" ? p.over : p.under;
  const edge = modelP - mktP;
  const ev = modelP * (americanToDecimal(price) - 1) - (1 - modelP);
  const hits = p.last10.filter(v => side === "over" ? v > p.line : v < p.line).length;
  const h2hHits = p.h2h.filter(v => side === "over" ? v > p.line : v < p.line).length;
  const cv = p.sd / p.projection;
  const variability = cv < 0.25 ? "Low" : cv < 0.4 ? "Medium" : "High";

  if (p.role && !p.role.applied) flags.push(`Depends on ${p.role.dependsOn} (${p.role.status.toLowerCase()}) — projection assumes he plays`);
  const ageMin = (new Date(DATA.meta.generatedAt) - new Date(p.oddsUpdated)) / 60000;

  const lean = edge < 0.01 ? "none" : side;

function stdev(a){ if (a.length < 2) return 0; const m = avg(a); return Math.sqrt(a.reduce((s,v) => s + (v - m) ** 2, 0) / (a.length - 1)); }

function buildLiveProp(pl, market, myLines){
  const mine = myLines[`${pl.name}|${market}`];
  const refs = (LIVE.props || []).filter(x => x.key === normName(pl.name) && x.market === market && x.game === pl.g.id);
  let src = null;
  if (mine) src = {line: mine.line, over: mine.over, under: mine.under, book: mine.book || "your bookmaker", updated: mine.at, source: "manual"};
  else if (refs.length){
    // consensus reference: the most common line across US books, then that line's average price
    const cnt = {}; refs.forEach(r => cnt[r.line] = (cnt[r.line] || 0) + 1);
    const line = +Object.entries(cnt).sort((a,b) => b[1] - a[1] || a[0] - b[0])[0][0];
    const at = refs.filter(r => r.line === line);
    const am = xs => Math.round(probToAmericanRaw(avg(xs.map(americanToProb))));
    src = {line, over: am(at.map(r => r.over)), under: am(at.map(r => r.under)), book: at.map(r => r.book).join(", "),
           updated: at.map(r => r.updated).sort().pop() || ((LIVE.sections || {}).odds || {}).fetchedAt, source: "ref"};
  }
  // ---- projection from real logs: 55% season, 45% last 10, then a small head-to-head blend
  const recent = pl.recent.map(g => g[market]);
  const last10 = pl.log.map(g => g[market]);
  const seasonAvg = pl.avgs[market];
  const l10 = last10.length ? avg(last10) : seasonAvg;
  const base = Math.max(0.1, 0.55 * seasonAvg + 0.45 * l10);
  const h2hGames = pl.recent.filter(g => g.opp === pl.opp).slice(0, 4);
  const h2h = h2hGames.map(g => g[market]);
  const n = h2h.length, h2hAvg = n ? avg(h2h) : base;
  const w = n ? H2H_MAX_WEIGHT * n / (n + H2H_K) : 0;
  const projection = base * (1 - w) + h2hAvg * w;
  const sdGame = Math.max(SD_FLOOR[market], 0.5 * stdev(recent.slice(0, 20)) + 0.5 * CV[market] * projection);
  // total spread = game-to-game swings + the projection's own error (it's an estimate, not a known average)
  const sd = Math.sqrt(sdGame ** 2 + (PROJ_ERR * projection) ** 2);

             minutes: pl.projMin, seasonMin: pl.projMin, status: pl.status, seasonAvg, live: true, l10, games: pl.recent.length};
  if (!src) return {...p, noLine: true};
  return {...p, line: src.line, over: src.over, under: src.under, book: src.book, source: src.source, oddsUpdated: src.updated || DATA.meta.generatedAt};
}

function verdict(p){
  if (p.flags.length) return {k:"check", label:"Check status", meaning:"Ignore until the injury or data issue is resolved"};
  if (p.value)        return {k:"strong", label:"Strong value", meaning:"Big enough gap to count as value"};
  if (p.edge >= 0.03) return {k:"some", label:"Some value", meaning:"Worth a look, but below the value bar"};
  if (p.edge >= 0.01) return {k:"slight", label:"Slight edge", meaning:"Too small to rely on"};
  return {k:"none", label:"No edge", meaning:"SWISH and the bookmaker roughly agree"};
}
const vdPill = p => { const v = verdict(p); return `<span class="vd ${v.k}">${v.label}</span>`; };
function plainEnglish(p){
  const first = p.player.split(" ")[0], mk = MARKET_NAMES[p.market].toLowerCase(), v = verdict(p);

      <button class="textbtn" data-expand="all">Expand all</button><button class="textbtn" data-expand="none">Collapse all</button>
    </div>
  </div>
  <div id="sections"></div>

  <div class="sechead"><div><div class="eyebrow">Across the slate</div><h2 class="h">Best picks &amp; insights</h2></div><span class="sub">Click any row for the full breakdown</span></div>
  <div class="panel">
    <div class="tabs" id="bestTabs" role="tablist" aria-label="Pick lists">${Object.entries(PICK_TABS).map(([k,t]) => `<button role="tab" aria-selected="${state.bestTab===k}" class="${state.bestTab===k?"on":""}" data-tab="${k}">${t.label}<span class="c">${t.list().length}</span></button>`).join("")}</div>
    <div id="bestList"></div>
  </div>`;
}

function renderBest(){
  const t = PICK_TABS[state.bestTab], list = t.list().slice(0, 10);
  $("bestList").innerHTML = `<div class="tabdesc">${t.desc}</div>${pickHead}${list.length ? list.map(pickRow).join("") : `<div class="gempty">Nothing in this list on the current slate.</div>`}`;
}

function renderLegend(){
  $("legend").innerHTML = state.market === "ALL"
    ? `<span class="cellx"><b>26.5</b><small>27.4▲</small></span><span>Line (bookmaker) on top · SWISH projection and lean below</span>
       <span><i class="sw" style="background:var(--red-soft);border:1px solid var(--red-line)"></i>Strong value</span>
       <span><i class="sw" style="background:var(--amber-soft);border:1px solid var(--amber-line)"></i>⚠ Flagged</span><span>Click any cell for the full breakdown · <b style="color:var(--red)">L6 ▾</b> next to a name shows their last 6 games</span>`
    : `<span><b style="color:var(--ink)">Line / Over / Under</b> = ${IS_LIVE ? "bookmaker (US market price)" : "bookmaker (sample)"} · <b style="color:var(--red)">Proj.</b> = SWISH model · highlighted price = model lean · click a row for details</span>`;
}

function visiblePlayers(teamCode){
  const q = state.q.trim().toLowerCase();
  const tm = team(teamCode);
  const teamMatch = q && (teamCode.toLowerCase() === q || tm.name.toLowerCase().includes(q) || tm.city.toLowerCase().includes(q));
  let ps = PLAYERS.filter(pl => pl.team === teamCode);
  if (q && !teamMatch) ps = ps.filter(pl => pl.name.toLowerCase().includes(q));
  const propsFor = pl => ALL.filter(p => p.player === pl.name && (state.market === "ALL" || p.market === state.market) && !(state.hideFlagged && p.flags.length));
  if (state.onlyValue) ps = ps.filter(pl => propsFor(pl).some(p => p.value));
  if (state.market !== "ALL") ps = ps.filter(pl => propsFor(pl).length);
  const bestEdge = pl => Math.max(-1, ...propsFor(pl).map(p => p.edge));
  const out = pl => pl.status === "Out" ? 1 : 0;
  ps.sort((a,b) => out(a) - out(b) || (state.sort === "name" ? a.name.localeCompare(b.name) : state.sort === "edge" ? bestEdge(b) - bestEdge(a) : b.projMin - a.projMin));
  return ps;
}

function playerSub(pl){
  if (pl.status === "Out") return `<small class="warn">${stPill("Out")}</small>`;
  if (pl.status === "Questionable" || pl.status === "Doubtful") return `<small class="warn">⚠ ${esc(pl.status)} · ${esc(injuryOf(pl.name).detail)}</small>`;
  if (pl.boost) return `<small class="boost">${pl.pos} · ↑ ${pl.min}→${pl.projMin} min (${esc(pl.boost.dependsOn)} out)</small>`;
  if (pl.scenario) return `<small class="warn">${pl.pos} · ${pl.min}→${pl.scenario.minIf} min if ${esc(pl.scenario.dependsOn)} sits</small>`;
  if (pl.status === "Probable") return `<small>${pl.pos} · probable</small>`;
  return `<small>${pl.pos}</small>`;
}

function cell(pl, m){
  const p = propOf(pl.name, m);
  if (!p) { const nl = noLineOf(pl.name, m);
    return nl && state.onlyValue !== true ? `<td><button class="cell noline" data-prop="${nl.id}" aria-label="${esc(pl.name)}, ${MARKET_NAMES[m]}: no bookmaker line, SWISH projection ${nl.projection.toFixed(1)}" title="No bookmaker line · SWISH projects ${nl.projection.toFixed(1)}"><b class="num">–</b><small class="num">${nl.projection.toFixed(1)}</small></button></td>` : `<td><span class="dash">—</span></td>`; }
  if (state.hideFlagged && p.flags.length) return `<td><span class="dash">—</span></td>`;
  const arrow = p.lean === "over" ? "▲" : p.lean === "under" ? "▼" : "";
  return `<td><button class="cell ${p.value?"value":""} ${p.flags.length?"flagged":""}" data-prop="${p.id}" aria-label="${esc(p.player)}, ${MARKET_NAMES[m]}: line ${p.line}, SWISH projection ${p.projection.toFixed(1)}, SWISH chance ${p.side} ${pct(p.modelP,0)}, bookmaker ${pct(p.mktP,0)}, ${verdict(p).label}" title="${esc(p.player)} · ${MARKET_NAMES[m]} ${p.line} · O ${fmtOdds(p.over)} / U ${fmtOdds(p.under)} · SWISH ${pct(p.modelP,0)} ${p.side} vs bookie ${pct(p.mktP,0)} → ${verdict(p).label}">
    <b class="num">${p.line}</b><small class="${p.flags.length?"":p.lean} num">${p.flags.length ? "⚠ " : ""}${p.projection.toFixed(1)}${arrow}</small></button></td>`;
}

function formTable(pl, focus){
  const games = pl.log.slice(0, 6);
  const lineOf = m => { const p = propOf(pl.name, m); return p ? p.line : null; };
  const cards = MARKETS.map((m, k) => {
    const L = lineOf(m), a = avg(games.map(g => g[m])), diff = a - pl.avgs[m];
    const hits = L === null ? null : games.filter(g => g[m] > L).length;
    const max = Math.max(...games.map(g => g[m]), L || 0, 1);
    const trend = (Math.abs(diff) < 0.05 ? `<span class="tr0">= season</span>` : `<span class="${diff > 0 ? "tup" : "tdn"}">${diff > 0 ? "▲" : "▼"}${Math.abs(diff).toFixed(1)} vs season</span>`);
    return `<div class="fcard ${m===focus?"focus":""} ${hits!==null && hits>=4 ? "hot" : hits!==null && hits<=2 ? "cold" : ""}" style="--k:${k}">
      <div class="fk" title="${MARKET_NAMES[m]}">${m==="PRA" ? "PRA" : MARKET_NAMES[m]}</div>
      <div class="fv num">${a.toFixed(1)}</div>
      <div class="fs num">${trend}</div>
      <div class="fbars">${[...games].reverse().map(g => `<i class="${L!==null && g[m] > L ? "o" : ""}" style="height:${Math.max(6, g[m]/max*100).toFixed(0)}%" title="${g.home?"vs":"@"} ${g.opp}: ${g[m]}"></i>`).join("")}${L!==null ? `<span class="fline" style="bottom:${(L/max*100).toFixed(0)}%"></span>` : ""}</div>
      <div class="fl num">${L === null ? "No line tonight" : `<span>Line <b>${L}</b></span><span><b class="hc">${hits}/6</b> over</span>`}</div>
    </div>`;
  }).join("");
  const head = `<tr><th class="l">Date</th><th class="l">Opponent</th><th>Min</th>${MARKETS.map(m => `<th class="${m===focus?"f":""}">${m}</th>`).join("")}</tr>`;
  const rows = games.map((g, r) => `<tr style="--r:${r}"><td class="l num">${new Date(g.d).toLocaleDateString([], {day:"numeric", month:"short"})}</td>
    <td class="l"><span class="fopp">${g.home ? "vs" : "@"} ${tid(g.opp,"xs")} ${g.opp}</span></td><td class="num mn">${g.min}</td>
    ${MARKETS.map(m => { const L = lineOf(m); const o = L !== null && g[m] > L; return `<td class="num ${m===focus?"f":""}"><span class="${o ? "pill o" : "pill"}">${g[m]}</span></td>`; }).join("")}</tr>`).join("");
  return `<div class="formbox">
    <div class="fsec"><span>Last-6 averages vs tonight's lines</span><em>bars oldest → newest · red line = tonight's line</em></div>
    <div class="fcards">${cards}</div>
    <div class="fsec"><span>Game log</span><em>newest first · green = cleared tonight's line</em></div>
    <div class="ftable"><table class="form"><thead>${head}</thead><tbody>${rows}</tbody></table></div>
    <p class="formnote">${IS_LIVE ? `Real box scores from ESPN game logs · updated ${agoTxt(((LIVE.sections || {}).players || {}).fetchedAt)}.` : "Sample game logs — real box scores appear once live stats are connected."}</p>
  </div>`;
}

function squadMatrix(teamCode){
  const ps = visiblePlayers(teamCode);
  const v = ALL.filter(p => p.team === teamCode && p.value).length;
  return `<div class="squad">
    <div class="sq-h" style="--team:${team(teamCode).color}">${tid(teamCode,"sm")}<b>${tname(teamCode)}</b><span class="sub">${ps.length} players${v ? ` · <span style="color:var(--red);font-weight:700">${v} value</span>` : ""}</span></div>
    ${ps.length ? `<table class="sqt"><thead><tr><th>Player</th><th class="min">Min</th>${MARKETS.map(m => `<th class="mk">${m}</th>`).join("")}</tr></thead><tbody>
      ${ps.map(pl => { const open = state.showForm || state.formOpen.has(pl.name);
        return `<tr class="${pl.status==="Out"?"out":""} ${open?"has-form":""}"><td class="pl"><div class="pl-in"><div><b>${esc(pl.name)}</b>${playerSub(pl)}</div>
          <button class="formbtn" data-form="${esc(pl.name)}" aria-expanded="${open}" aria-label="${open?"Hide":"Show"} last 6 games for ${esc(pl.name)}">${ICON_FORM}<b>Last 6</b><span class="car">${ICON_CHEV}</span></button></div></td>
        <td class="min num ${pl.boost?"up":""}">${pl.status==="Out" ? "—" : pl.projMin}</td>
        ${pl.status === "Out" || pl.projMin < MIN_MINUTES_FOR_PROPS ? MARKETS.map(() => `<td><span class="dash">—</span></td>`).join("") : MARKETS.map(m => cell(pl, m)).join("")}</tr>
        ${open ? `<tr class="formrow"><td colspan="${MARKETS.length + 2}" style="--team-c:${team(pl.team).color}"><div class="formwrap"><div class="formttl"><span class="av">${initials(pl.name)}</span><div><b>${esc(pl.name)}</b><small>${tname(pl.team)} · ${pl.pos} · last 6 games</small></div><button class="fclose" data-form="${esc(pl.name)}" aria-label="Hide last 6 games for ${esc(pl.name)}">Hide ${ICON_CHEV}</button></div>${formTable(pl)}</div></td></tr>` : ""}`; }).join("")}
    </tbody></table>` : `<div class="gempty">No players match the current filters.</div>`}
  </div>`;
}

function singleMarket(teamCode){
  const m = state.market;
  const ps = visiblePlayers(teamCode).filter(pl => pl.status !== "Out");
  const rows = ps.map(pl => propOf(pl.name, m)).filter(p => p && !(state.hideFlagged && p.flags.length));
  return `<div class="squad">
    <div class="sq-h" style="--team:${team(teamCode).color}">${tid(teamCode,"sm")}<b>${tname(teamCode)}</b><span class="sub">${MARKET_NAMES[m]} · ${rows.length} players</span></div>
    ${rows.length ? `<div class="smt-h"><span>Player</span><span class="r">Min</span><span class="r">Line</span><span class="r">Over</span><span class="r">Under</span><span class="r">Proj.</span><span>SWISH chance · bookie</span><span>Value</span><span>Last 6 · newest first</span><span class="r">H2H avg</span><span></span></div>
    ${rows.map(p => {
      const pl = PLAYERS.find(x => x.name === p.player);
      return `<button class="smt-r ${p.value?"value":""}" data-prop="${p.id}">
        <div class="pl"><b>${esc(p.player)}</b>${p.flags.length ? `<small class="warn">⚠ Flagged</small>` : playerSub(pl)}</div>
        <div class="mins num ${pl.boost?"up":""}" data-l="Min">${pl.projMin}</div>
        <div class="big num" data-l="Line">${p.line}</div>
        <div class="odd num ${p.lean==="over"?"lo":""}" data-l="Over"><span>${fmtOdds(p.over)}</span></div>
        <div class="odd num ${p.lean==="under"?"lu":""}" data-l="Under"><span>${fmtOdds(p.under)}</span></div>
        <div class="big proj num" data-l="Proj.">${p.projection.toFixed(1)}</div>
        <div class="chance" data-l="SWISH chance · bookie"><div class="ct"><b class="num" style="color:${leanCol(p.lean)}">${p.lean==="none"?"":sideWord(p.side)+" "}${pct(p.modelP,0)}</b><small class="num">bookie ${pct(p.mktP,0)}</small></div><span class="tr"><i style="width:${(p.modelP*100).toFixed(0)}%;background:${leanCol(p.lean)}"></i><span class="mk" style="left:${(p.mktP*100).toFixed(0)}%"></span></span></div>
        <div class="vcell" data-l="Value">${vdPill(p)}<small class="num">${pts(p.edge)}</small></div>
        <div class="l6" data-l="Last 6 · newest first">${pl.log.slice(0,6).map(g => `<i class="num ${g[p.market] > p.line ? "o" : ""}" title="${g.home?"vs":"@"} ${g.opp}: ${g[p.market]}">${g[p.market]}</i>`).join("")}</div>
        <div class="big num" data-l="H2H avg" style="font-size:16px">${p.h2hAvg.toFixed(1)}</div>
        <span class="chev2" style="color:var(--faint)">›</span>
      </button>`;}).join("")}` : `<div class="gempty">No ${MARKET_NAMES[m].toLowerCase()} props match the current filters.</div>`}
  </div>`;
}

function gameSection(g){
  const q = state.q.trim();
  const vis = [...visiblePlayers(g.away), ...visiblePlayers(g.home)];
  if ((q || state.onlyValue) && !vis.length) return "";
  const collapsed = state.collapsed.has(g.id);
  const ps = ALL.filter(p => p.game === g.id), v = ps.filter(p => p.value).length;
  const inj = gameInjuries(g).filter(significant);
  const body = state.market === "ALL" ? squadMatrix(g.away) + squadMatrix(g.home) : singleMarket(g.away) + singleMarket(g.home);
  return `
  <div class="gouter" style="--ca:${team(g.away).color};--cb:${team(g.home).color}"><span class="gglow" aria-hidden="true"></span>
  <section class="gsec ${collapsed?"collapsed":""}" id="game-${g.id}">
    <button class="gsec-h" data-toggle="${g.id}" aria-expanded="${!collapsed}" style="--ca:${team(g.away).color};--cb:${team(g.home).color}">
      <div class="matchup">
        <div class="tm">${tid(g.away)}<div><b>${team(g.away).name}</b><small>${team(g.away).city}</small></div></div><span class="at">@</span>
        <div class="tm">${tid(g.home)}<div><b>${team(g.home).name}</b><small>${team(g.home).city}</small></div></div>

      <div class="gtags">
        <span class="tag num">${timeFmt(g.tipoff)} · ${esc(g.status)}</span>
        <span class="tag num">Total ${g.total} · ${g.spread}</span>
        <span class="tag amber">Lineups ${esc(g.lineups.toLowerCase())}</span>
        ${inj.length ? `<span class="tag red">${inj.map(i => `${esc(i.player.split(" ")[1])} ${esc(i.status.toLowerCase())}`).join(" · ")}</span>` : ""}
      </div>
      <div class="gcount"><b class="num">${ps.length + NOLINE.filter(p => p.game === g.id).length}</b> props${IS_LIVE ? `<span class="num" style="display:block;font-size:11.5px;color:var(--muted)">${ps.length} priced</span>` : ""}${v ? `<span class="v num">${v} strong value</span>` : ""}</div>
      <span class="gswipe" aria-hidden="true"></span>
      <span class="chev">${ICON_CHEV}</span>
    </button>
    <div class="gwrap"><div class="gbody ${state.market==="ALL"?"":"single"}">${body}</div></div>
  </section></div>`;
}

function renderSections(){
  if (!$("sections")) return;
  renderLegend();
  const html = GAMES.map(gameSection).join("");
  $("sections").innerHTML = html.trim() ? html : `
    <div class="empty"><div class="ic">${ICON_SEARCH}</div>
      <h3>No players match${state.q ? ` “${esc(state.q)}”` : ""}</h3>
      <p>Try a different name, a team (e.g. Celtics or BOS), or clear the search and filters.</p>
      <button class="btn" data-clear="1">Clear search &amp; filters</button></div>`;
}

function liveNotice(){
  if (!IS_LIVE) return `<div class="notice"><b>Everything here is sample data.</b> ${LIVE_NOTE ? esc(LIVE_NOTE) + " " : ""}Games, players, injuries, head-to-head results, bookmaker lines and prices are invented to show how SWISH will work. Nothing reflects real fixtures, real odds or a betting recommendation. Snapshot: ${dateFmt(DATA.meta.generatedAt)}, ${timeFmt(DATA.meta.generatedAt)}.</div>`;

}

function savePrice(id){
  const p = PROP_BY_ID.get(id); if (!p) return;
  const f = document.querySelector(`[data-priceform="${id}"]`), msg = $("pformMsg");
  const line = Number(String(f.line.value).trim().replace(",", "."));
  const fmt = state.odds === "dec" ? "dec" : "am";
  const over = parsePrice(f.over.value.replace(",", "."), fmt), under = parsePrice(f.under.value.replace(",", "."), fmt);
  if (!f.line.value.trim() || !isFinite(line) || line < 0 || line > 120) { msg.textContent = "Enter the line, e.g. 22.5."; f.line.focus(); return; }
  if (over === null) { msg.textContent = "Enter the over price, e.g. 1.91 or 10/11."; f.over.focus(); return; }
  if (under === null) { msg.textContent = "Enter the under price too — SWISH needs both to remove the bookmaker's margin."; f.under.focus(); return; }
  const margin = americanToProb(over) + americanToProb(under) - 1;
  if (margin < -0.02 || margin > 0.25) { msg.textContent = "Those two prices don't look like a pair — please check them."; return; }
  const all = loadMyLines();
  all[`${p.player}|${p.market}`] = {line, over, under, book: "your bookmaker", at: new Date().toISOString()};
  saveMyLines(all); refreshAfterPrice(id);
}
function clearPrice(id){
  const p = PROP_BY_ID.get(id); if (!p) return;
  const all = loadMyLines(); delete all[`${p.player}|${p.market}`]; saveMyLines(all); refreshAfterPrice(id);
}
function refreshAfterPrice(id){
  buildAllProps();
  render();
  if (PROP_BY_ID.get(id)) openDrawer(id);
}

    <div class="cmpbars">

      <div class="kv"><span>Bookmaker margin</span><b class="num">${pct(p.vig)}</b></div>
      <div class="kv"><span>Bookmaker's chance (margin removed) · over / under</span><b class="num">${pct(p.mktO)} / ${pct(p.mktU)}</b></div>
      <div class="kv"><span>Model alone · over / under<small style="display:block;color:var(--faint);font-weight:500">${p.dist === "count" ? "skewed count curve (suits rebounds/assists/threes)" : "bell curve around the projection"}</small></span><b class="num">${pct(p.pureO)} / ${pct(p.pureU)}</b></div>
      <div class="kv"><span>SWISH's chance · over / under<small style="display:block;color:var(--faint);font-weight:500">${Math.round(MODEL_WEIGHT*100)}% model + ${Math.round((1-MODEL_WEIGHT)*100)}% market, until results prove the model</small></span><b class="num">${pct(p.modelO)} / ${pct(p.modelU)}</b></div>
      <div class="kv"><span>Price source</span><b>${esc(lineSrc(p))}</b></div>
      <div class="kv"><span>Odds last updated</span><b class="num">${timeFmt(p.oddsUpdated)}</b></div>
    </div>
    ${IS_LIVE ? priceForm(p) : ""}

    ${others.length ? `<div class="dsec"><div class="dt">Other ${esc(p.player.split(" ")[0])} props</div>
      <div class="others">${others.map(o => `<button class="${o.value?"value":""}" data-prop="${o.id}">${MARKET_NAMES[o.market]} ${o.line} · ${o.lean==="none"?"no edge":sideWord(o.side)+" "+pct(o.modelP,0)}</button>`).join("")}</div></div>` : ""}
  </div>`;
}

  return `
  <div class="dr-h"><span class="av" style="background:var(--red-soft);color:var(--red)">?</span><div><b>How to read SWISH</b><small>The key numbers, in plain English</small></div><button class="x" data-close="1" aria-label="Close">×</button></div>
  <div class="dr-b">
    <div class="plain"><div class="plain-h"><span>The short version</span></div><p>For every prop, SWISH estimates <b>how often the bet would win</b> and compares that with <b>what the bookmaker's price implies</b>. When SWISH's number is clearly higher, the price may be generous — that's <b>value</b>. It never means a bet is safe.</p></div>
    <div class="dsec"><div class="dt">The numbers</div>
      ${row("Line","The number the bookmaker sets, e.g. 23.5 points. You bet on the player finishing <b>over</b> or <b>under</b> it.")}
      ${row("Projection","SWISH's estimate of what the player will actually get. Above the line → SWISH leans over; below → under.")}
      ${row("Odds (price)","What the bookmaker pays. In decimal, 1.95 means a £10 bet returns £19.50 if it wins — £9.50 profit plus your stake.")}
      ${row("SWISH's chance",`How often SWISH thinks the bet wins if the game were played many times. 60% ≈ <b>6 times in 10</b>. It's ${Math.round(MODEL_WEIGHT*100)}% SWISH's model and ${Math.round((1-MODEL_WEIGHT)*100)}% the bookmaker's view, because the model hasn't been tested against results yet — so only clear disagreements show up as value.`)}
      ${row("Bookmaker's chance","The chance hidden inside the price, after removing the bookmaker's built-in margin (usually 4–5%).")}
      ${row("The gap (edge)","SWISH's chance minus the bookmaker's, in points. <b>+6 pts</b> means SWISH thinks it wins 6 more times in every 100 than the price suggests. Bigger and positive = better price.")}
      ${row("Average return","What you'd expect to win or lose per £10 <i>on average</i> over many similar bets. Any single bet still either wins or loses.")}
      ${row("Fair odds","The price SWISH thinks is fair. If the bookmaker offers <b>higher</b> odds than this, that's where value comes from.")}
    </div>
    <div class="dsec"><div class="dt">Value labels</div>
      <div class="gl"><b><span class="vd strong">Strong value</span></b><p>Gap of ${(MIN_EDGE*100).toFixed(0)}+ points, positive average return, and no injury or data issues.</p></div>
      <div class="gl"><b><span class="vd some">Some value</span></b><p>Gap of 3–${(MIN_EDGE*100).toFixed(0)} points. Positive, but not strong enough to highlight.</p></div>
      <div class="gl"><b><span class="vd slight">Slight edge</span></b><p>Gap of 1–3 points. Too small to rely on — within the model's margin of error.</p></div>
      <div class="gl"><b><span class="vd none">No edge</span></b><p>SWISH and the bookmaker roughly agree.</p></div>
      <div class="gl"><b><span class="vd check">Check status</span></b><p>An injury, lineup question or stale price. Ignored until it's resolved.</p></div>
    </div>
    ${ex ? `<div class="dsec"><div class="dt">Worked example${IS_LIVE ? "" : " (sample)"}</div>
      <div class="plain"><p>${plainEnglish(ex)}</p><button class="textbtn" data-prop="${ex.id}">Open this prop →</button></div>
    </div>` : ""}
    <div class="dsec"><div class="dt">Display &amp; keyboard</div>
      <div class="prefrow"><button class="tgl" role="switch" aria-checked="${PREFS.large}" data-pref="large"><span class="track"><span class="knob"></span></span>Larger text</button>
      <button class="tgl" role="switch" aria-checked="${PREFS.dark}" data-pref="dark"><span class="track"><span class="knob"></span></span>Dark mode</button>
      <button class="tgl" role="switch" aria-checked="${PREFS.calm}" data-pref="calm"><span class="track"><span class="knob"></span></span>Reduce motion</button></div>
      <div class="keys"><span><kbd>/</kbd> search players</span><span><kbd>?</kbd> open this guide</span><span><kbd>Esc</kbd> close panel</span><span><kbd>Tab</kbd> move between controls</span></div>
    </div>
    <div class="pnote warn"><b>Keep in mind:</b> these are estimates from a simple model${IS_LIVE ? " built on real game logs. Prices are US market prices — check your bookmaker's line matches" : " using invented data"}. A 60% chance still loses 4 times in 10, and no label here is a recommendation to bet.</div>
  </div>`;
}
let lastFocus = null;
function showDrawer(html, label){
  if (!state.drawerOpen) lastFocus = document.activeElement;
  state.drawerOpen = true;
  const dr = $("drawer");
  dr.innerHTML = html; dr.scrollTop = 0; dr.setAttribute("aria-label", label || "Details");
  dr.classList.add("on"); dr.setAttribute("aria-hidden","false"); $("scrim").classList.add("on");
  document.body.classList.add("locked");
  setTimeout(() => { const x = dr.querySelector(".x"); (x || dr).focus({preventScroll:true}); }, 60);
}
function openHelp(){ state.drawer = "help"; showDrawer(helpHTML(), "How to read SWISH"); }
function openDrawer(id){
  const p = PROP_BY_ID.get(id); if (!p) return;
  state.drawer = id;
  showDrawer(drawerHTML(p), `${p.player} ${MARKET_NAMES[p.market]} details`);
}
function closeDrawer(){
  const wasOpen = state.drawerOpen;
  state.drawer = null; state.drawerOpen = false;
  $("drawer").classList.remove("on"); $("drawer").setAttribute("aria-hidden","true");
  $("scrim").classList.remove("on"); document.body.classList.remove("locked");
  if (wasOpen && lastFocus && document.body.contains(lastFocus)) lastFocus.focus({preventScroll:true});
}

/* ---------------- Games & Analysis ---------------- */
function viewGames(){
  return `
  <header class="hero hero-games">${GFX.games}
  <div class="eyebrow">${DATA.meta.slateLabel}</div>
  <h1 class="title">Games &amp; Analysis</h1>
  <p class="lede">Head-to-head history, team context and the player trends that feed each projection.</p>
  </header>
  ${IS_LIVE ? `<div class="notice live"><b>Live data.</b> Records and standings from ESPN, head-to-head from completed games this season and last. Totals and spreads: ${GAMES.some(g => g.lineSource === "UK books") ? "UK books where priced, otherwise ESPN's listed line" : "ESPN's listed line (UK lines arrive with the daily odds run)"}.</div>` : `<div class="notice"><b>Sample data.</b> Head-to-head scores, team ratings and notes are invented for demonstration and are not real results.</div>`}
  ${GAMES.map(gameAnalysis).join("")}`;
}

function gameAnalysis(g){
  const A = team(g.away), H = team(g.home);
  const wins = {[g.away]:0,[g.home]:0};
  g.h2h.forEach(m => wins[m.hp > m.ap ? m.home : m.away]++);
  const nH = g.h2h.length, numTotal = typeof g.total === "number";
  const avgTotal = nH ? avg(g.h2h.map(m => m.hp + m.ap)) : 0, overs = numTotal ? g.h2h.filter(m => m.hp + m.ap > g.total).length : 0;
  const leader = wins[g.away] === wins[g.home] ? "Series level" : `${wins[g.away] > wins[g.home] ? A.name : H.name} lead`;
  let rows;
  if (IS_LIVE){
    const ra = DATA.liveTeamRow(g.away) || {}, rh = DATA.liveTeamRow(g.home) || {};
    const wp = r => r.w + r.l ? r.w / (r.w + r.l) : 0;
    const streakN = st => { const m = /^([WL])(\d+)$/.exec(st || ""); return m ? (m[1] === "W" ? +m[2] : -m[2]) : 0; };
    rows = [["Record", ra.w != null ? `${ra.w}-${ra.l}` : "—", rh.w != null ? `${rh.w}-${rh.l}` : "—", "cmp", wp(ra), wp(rh)],
            ["Conference rank", ra.rank ? `${ra.conf} #${ra.rank}` : "—", rh.rank ? `${rh.conf} #${rh.rank}` : "—", "cmp", -(ra.rank || 99), -(rh.rank || 99)],
            ["Games back", ra.gb != null ? String(ra.gb) : "—", rh.gb != null ? String(rh.gb) : "—", "none"],
            ["Streak", ra.streak || "—", rh.streak || "—", "cmp", streakN(ra.streak), streakN(rh.streak)]];
  } else {
    rows = [["Pace",A.pace,H.pace,"high"],["Off. rating",A.ortg,H.ortg,"high"],["Def. rating",A.drtg,H.drtg,"low"],["Last 10",A.last10,H.last10,"rec"]];
  }
  const better = (a,b,k,va,vb) => k === "none" || a == null || b == null ? [false,false] : k === "cmp" ? [va > vb, vb > va] : k === "rec" ? [+a.split("-")[0] > +b.split("-")[0], +b.split("-")[0] > +a.split("-")[0]] : k === "high" ? [a > b, b > a] : [a < b, b < a];
  const trends = ALL.filter(p => p.game === g.id && !p.flags.length && p.n > 0).sort((a,b) => Math.abs(b.h2hAvg-b.line)/b.sd - Math.abs(a.h2hAvg-a.line)/a.sd).slice(0, 7);
  const inj = gameInjuries(g).filter(significant);
  return `
  <div class="gouter gx" style="--ca:${team(g.away).color};--cb:${team(g.home).color}"><span class="gglow" aria-hidden="true"></span>
  <section class="ana">
    <div class="ana-h ghead" style="--ca:${team(g.away).color};--cb:${team(g.home).color}"><span class="gswipe" aria-hidden="true"></span>
      <div class="matchup">
        <div class="tm">${tid(g.away,"lg")}<div><b>${A.name}</b><small>${A.city} · away</small></div></div><span class="at">@</span>
        <div class="tm">${tid(g.home,"lg")}<div><b>${H.name}</b><small>${H.city} · home</small></div></div>
      </div>
      <div class="right">
        <span class="tag num">${dateFmt(g.tipoff)} · ${timeFmt(g.tipoff)}</span><span class="tag num">Total ${g.total}</span><span class="tag num">${g.spread}</span>
        ${inj.length ? `<button class="tag red" data-nav="injuries">${inj.length} injury concern${inj.length>1?"s":""}</button>` : ""}
        <button class="btn red" data-goto="${g.id}">View squads &amp; props →</button>
      </div>
    </div>
    <div class="ana-b">
      <div>
        <div class="dt">Head-to-head · last ${nH} meeting${nH === 1 ? "" : "s"}</div>
        ${nH ? "" : `<p class="dnote">No meetings between these teams in the last two seasons.</p>`}
        ${nH ? `<div class="rec"><b class="num">${g.away} ${wins[g.away]}–${wins[g.home]} ${g.home}</b><span>${leader}</span></div>` : ""}
        ${g.h2h.map(m => { const hw = m.hp > m.ap; return `<div class="mtg"><span class="d num">${shortDate(m.d)}</span>
          <span class="sc"><span class="${hw?"l":"w"}">${m.away}</span><b class="num ${hw?"l":"w"}">${m.ap}</b><span class="l">@</span><span class="${hw?"w":"l"}">${m.home}</span><b class="num ${hw?"w":"l"}">${m.hp}</b></span>
          <span class="tot num">Total ${m.hp+m.ap}</span></div>`; }).join("")}
        ${nH ? `<div class="insight">Meetings averaged <b class="num">${avgTotal.toFixed(1)}</b> points${numTotal ? ` vs tonight's total of <b class="num">${g.total}</b>${g.lineSource ? ` (${esc(g.lineSource)})` : ""}. ${overs} of ${nH} went over it.` : "."}</div>` : ""}
      </div>
      <div>
        <div class="dt">Team context · ${IS_LIVE ? "this season" : "season sample"}</div>
        <div class="cmp-h"><div>${A.name} ${tid(g.away,"sm")}</div><div></div><div>${tid(g.home,"sm")} ${H.name}</div></div>
        ${rows.map(([lab,a,b,k,va,vb]) => { const [ba,bb] = better(a,b,k,va,vb); return `<div class="cmp"><div class="a"><b class="num ${ba?"better":""}">${a}</b></div><div class="lab">${lab}</div><div><b class="num ${bb?"better":""}">${b}</b></div></div>`; }).join("")}
        <p class="dnote">${IS_LIVE ? "Red = stronger figure. Early in the season records are small samples. Pace and efficiency ratings aren't in the free data feed yet." : "Red = stronger figure. Lower defensive rating is better."}</p>
        <div class="dt" style="margin-top:16px">Key notes</div>
        <ul class="notes">${g.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>
      </div>
      <div>
        <div class="dt">Player head-to-head trends</div>
        ${trends.length ? "" : `<p class="dnote">No priced props with head-to-head history for this game yet.</p>`}
        ${trends.map(p => `<button class="ptrend" data-prop="${p.id}">
          <div><span class="nm">${esc(p.player)}</span><small>${MARKET_NAMES[p.market]} · line ${p.line}</small></div>
          <div class="vs">vs ${p.opp}<br>${p.h2hHits}/${p.n} ${p.h2hAvg > p.line ? "over" : "under"}</div>
          <b class="num" style="color:${p.h2hAvg > p.line ? "var(--over)" : "var(--under)"}">${p.h2hAvg.toFixed(1)}</b></button>`).join("")}
        <p class="dnote">Average in previous meetings, furthest from tonight's line first. Head-to-head moves a projection at most ${pct(H2H_MAX_WEIGHT,0)} of the way, less with fewer games.</p>
      </div>
    </div>
  </section></div>`;
}

  <p class="lede">Who is out or uncertain, and who could absorb their minutes before lineups are confirmed.</p>
  </header>
  ${IS_LIVE ? `<div class="notice live"><b>Live data.</b> Injury statuses from ESPN's injury feed, updated ${agoTxt(((LIVE.sections || {}).injuries || {}).fetchedAt)}. "Day-to-day" is shown as questionable. Starting lineups are only confirmed shortly before tip-off — fill-in estimates aren't automated yet.</div>` : `<div class="notice"><b>Sample data.</b> These injuries and fill-in estimates are invented. When live data is connected, each entry will come from the official NBA injury report with its time of update. Starting lineups are only confirmed shortly before tip-off.</div>`}
  <div class="legend2">${["Out","Doubtful","Questionable","Probable"].map(stPill).join("")}</div>
  ${GAMES.map(injuryCard).join("")}`;
}

function injuryCard(g){
  const col = t => {
    const list = injuriesFor(t);
    return `<div><div class="ij-team">${tid(t,"sm")}<b>${tname(t)}</b></div>
      ${list.length ? list.map(i => {
        const affected = ALL.filter(p => p.player === i.player || (p.role && p.role.dependsOn === i.player));
        return `<div class="injc ${stCls(i.status)}">
          <div class="inj-top"><span class="av">${initials(i.player)}</span><div><div class="nm">${esc(i.player)}</div><small>${esc((PLAYERS.find(x=>x.name===i.player) || i).pos || "")} · ${esc(i.detail)}</small></div>${stPill(i.status)}</div>
          <div class="inj-meta">Updated ${i.updated ? `${dateFmt(i.updated)} ${timeFmt(i.updated)}` : "—"}${IS_LIVE ? "" : " · sample"}${i.comment ? ` · ${esc(i.comment)}` : ""}</div>
          ${i.fillIns.length ? `<div class="fill"><div class="dt">${i.status==="Out" ? "Who fills in" : "Who could fill in if he sits"}</div>
            ${i.fillIns.map(f => { const pl = PLAYERS.find(x => x.name === f.player) || {min:"?"}; return `<div class="fi"><span class="nm">${esc(f.player)}</span><span class="mins num">${pl.min} → <i>${f.minIf}</i> min</span><span class="note">${esc(f.note)}</span></div>`; }).join("")}
            ${affected.length ? `<div class="affects">${affected.map(p => `<button data-prop="${p.id}">${esc(p.player)} · ${MARKET_NAMES[p.market]} ${p.line}</button>`).join("")}</div>` : ""}
          </div>` : ""}
        </div>`; }).join("") : `<div class="noinj">No injuries reported${IS_LIVE ? "" : " (sample)"}.</div>`}
    </div>`;
  };
  return `
  <div class="gouter gx" style="--ca:${team(g.away).color};--cb:${team(g.home).color}"><span class="gglow" aria-hidden="true"></span>
  <section class="ij">
    <div class="ij-h ghead" style="--ca:${team(g.away).color};--cb:${team(g.home).color}"><span class="gswipe" aria-hidden="true"></span>
      <div class="matchup"><div class="tm">${tid(g.away)}<div><b>${team(g.away).name}</b><small>${team(g.away).city}</small></div></div><span class="at">@</span><div class="tm">${tid(g.home)}<div><b>${team(g.home).name}</b><small>${team(g.home).city}</small></div></div></div>
      <div class="right"><span class="tag num">${timeFmt(g.tipoff)}</span><button class="btn" data-goto="${g.id}">View squads →</button></div>
    </div>
    <div class="lineup"><b>Lineups ${esc(g.lineups.toLowerCase())}.</b> Projections that depend on an uncertain player are flagged and kept out of picks until status is confirmed.</div>
    <div class="ij-b">${col(g.away)}${col(g.home)}</div>
  </section></div>`;
}

/* ---------------- Results ---------------- */
function viewResults(){
  return `
  <header class="hero hero-results">${GFX.results}
  <div class="eyebrow">Performance tracking</div>
  <h1 class="title">Results</h1>
  <p class="lede">Settled selections, closing-line value and calibration will appear here.</p>
  </header>
  <div class="rtable">
    <div class="rhead"><div>Date</div><div>Selection</div><div>Market</div><div class="r">Line</div><div class="r">Price</div><div class="r">Closing</div><div class="r">Result</div></div>
    <div class="empty"><div class="ic"><svg viewBox="0 0 24 24"><path d="M4 19V10M10 19V5M16 19v-6M22 19H2"/></svg></div>
      <h3>No settled selections yet</h3>
      <p>Results are only recorded from real lines and real box scores. Tracking starts once live data is connected, so no sample results are shown.</p></div>
  </div>`;
}

/* =================================================================
   9. RENDER + EVENTS
   ================================================================= */
const CRUMBS = {dashboard:"Home", props:"Player Props", games:"Games & Analysis", injuries:"Injuries & Lineups", results:"Results"};

function render(){
  document.querySelectorAll("#nav [data-nav]").forEach(b => b.classList.toggle("on", b.dataset.nav === state.view));
  document.querySelectorAll("#oddsSeg [data-odds]").forEach(b => { b.classList.toggle("on", b.dataset.odds === state.odds); b.setAttribute("aria-pressed", b.dataset.odds === state.odds); });
  document.querySelectorAll("#nav [data-nav]").forEach(b => b.dataset.nav === state.view ? b.setAttribute("aria-current","page") : b.removeAttribute("aria-current"));
  syncPrefs();
  $("navGames").textContent = GAMES.length;
  $("navProps").textContent = ALL.length + NOLINE.length;
  const sig = DATA.injuries.filter(significant).length;
  $("navInj").textContent = sig || ""; $("navInj").style.display = sig ? "" : "none";
  $("crumb").innerHTML = `<button data-nav="dashboard" class="crumb-home">swish</button><span>/</span><b class="crumb-page">${CRUMBS[state.view]}</b>`;
  if (IS_LIVE){
    $("srcPill").className = "sample-pill live-pill"; $("srcPill").innerHTML = `<i></i>Live · updated ${agoTxt(DATA.meta.generatedAt)}`;
    $("stSrc").textContent = "Live records (ESPN)";
    $("sideFoot").innerHTML = `<b>Live data.</b> Stats, injuries and schedule from ESPN; prop prices from US bookmakers via The Odds API. Projections are model estimates, not predictions or advice.`;
  }
  renderStandings();
  $("sideGames").innerHTML = GAMES.map(g => `<button class="sg" data-goto="${g.id}">${tid(g.away,"sm")}<span class="vs">@</span>${tid(g.home,"sm")}<span class="nm">${g.away}–${g.home}</span><span class="t num">${timeFmt(g.tipoff)}</span></button>`).join("");
  const views = {dashboard:viewDashboard, props:viewProps, games:viewGames, injuries:viewInjuries, results:viewResults};
  $("page").innerHTML = (views[state.view] || viewDashboard)() +
    `<footer>${IS_LIVE ? "SWISH · live data from ESPN and The Odds API. Prop prices are US market prices — check your bookmaker's line matches" : "SWISH Stage 1 · static prototype. Bookmaker lines and odds are sample values"}; projections are model estimates and are labelled separately. Probabilities are estimates, never guarantees. Please gamble responsibly — in the UK, free support is available from GamCare (0808 8020 133) and BeGambleAware.</footer>`;
  if (state.view === "props") { renderBest(); renderSections(); bindPropsInputs(); }
  if (state.view === "dashboard") { tickClock(); countUp(); }
  if (state.drawer) $("drawer").innerHTML = state.drawer === "help" ? helpHTML() : drawerHTML(PROP_BY_ID.get(state.drawer));
}

function bindPropsInputs(){
  let qT; $("q").addEventListener("input", e => { state.q = e.target.value; clearTimeout(qT); qT = setTimeout(renderSections, 110); });
  $("sort").addEventListener("change", e => { state.sort = e.target.value; renderSections(); });
  $("showForm").addEventListener("change", e => { state.showForm = e.target.checked; renderSections(); });
  $("onlyValue").addEventListener("change", e => { state.onlyValue = e.target.checked; renderSections(); });
  $("hideFlagged").addEventListener("change", e => { state.hideFlagged = e.target.checked; renderSections(); });
}

function setCollapsed(id, c){
  const sec = $("game-" + id); if (!sec) return;
  sec.classList.toggle("collapsed", c);
  const h = sec.querySelector(".gsec-h"); if (h) h.setAttribute("aria-expanded", String(!c));
}
function renderStandings(){
  const el = $("standings"); if (!el) return;
  const conf = state.conf;
  document.querySelectorAll("[data-conf]").forEach(b => { const on = b.dataset.conf === conf; b.classList.toggle("on", on); b.setAttribute("aria-selected", on); });
  const playing = {}; GAMES.forEach(g => { playing[g.away] = g; playing[g.home] = g; });
  const rows = DATA.standings[conf].map(r => { const [t, wl] = r.split(" "); const [w, l] = wl.split("-").map(Number); return {t, w, l, pct: w + l ? w / (w + l) : 0}; })
    .sort((a, b) => b.pct - a.pct || b.w - a.w);
  const lead = rows[0];
  el.innerHTML = `<table class="stt"><thead><tr><th>#</th><th class="l">Team</th><th>W-L</th><th>GB</th></tr></thead><tbody>${rows.map((r, i) => {
    const g = playing[r.t], gb = ((lead.w - r.w) + (r.l - lead.l)) / 2;
    const attrs = g ? `class="on${i===5||i===9?" cut":""}" data-goto="${g.id}" tabindex="0" title="${tname(r.t)} play tonight · ${g.away} @ ${g.home} ${timeFmt(g.tipoff)}"` : `class="${i===5||i===9?"cut":""}" title="${tname(r.t)}"`;
    return `<tr ${attrs}><td class="rk num">${i+1}</td><td class="l"><span class="stt-t">${tid(r.t,"xs")}${r.t}${g ? `<i class="st-dot"></i>` : ""}</span></td><td class="num">${r.w}-${r.l}</td><td class="num gb">${gb ? gb.toFixed(1).replace(".0","") : "–"}</td></tr>`;
  }).join("")}</tbody></table>`;
}

function go(view){ state.view = view; store.set("view", view); closeDrawer(); render(); window.scrollTo({top:0}); }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-saveprice],[data-clearprice],[data-conf],[data-goto-best],[data-form],[data-pref],[data-help],[data-nav],[data-odds],[data-market],[data-toggle],[data-prop],[data-expand],[data-goto],[data-clear],[data-tab],[data-close]");
  if (!t) return;
  const d = t.dataset;
  if (d.conf) { state.conf = d.conf; store.set("conf", d.conf); renderStandings(); }
  else if (d.gotoBest) { state.bestTab = "best"; go("props"); setTimeout(() => { const el = $("bestTabs"); if (el) el.scrollIntoView({behavior:"smooth", block:"start"}); }, 80); }
  else if (d.form) { const n = d.form; state.formOpen.has(n) ? state.formOpen.delete(n) : state.formOpen.add(n); renderSections(); const b = document.querySelector(`[data-form="${CSS.escape(n)}"]`); if (b) b.focus({preventScroll:true}); }
  else if (d.pref) {
    const apply = () => { PREFS[d.pref] = !PREFS[d.pref]; store.set("pref." + d.pref, PREFS[d.pref] ? "1" : "0"); syncPrefs(); };
    const calm = document.documentElement.classList.contains("calm") || matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (d.pref === "dark" && document.startViewTransition && !calm) {
      const r = t.getBoundingClientRect(), h = document.documentElement;
      h.style.setProperty("--tx", `${r.left + r.width/2}px`); h.style.setProperty("--ty", `${r.top + r.height/2}px`);
      document.startViewTransition(apply);
    } else apply();
  }
  else if (d.help) openHelp();
  else if (d.close) closeDrawer();
  else if (d.saveprice) { e.preventDefault(); savePrice(+d.saveprice); }
  else if (d.clearprice) { e.preventDefault(); clearPrice(+d.clearprice); }
  else if (d.prop) openDrawer(+d.prop);
  else if (d.nav) go(d.nav);
  else if (d.odds) { state.odds = d.odds; store.set("odds", d.odds); render(); }
  else if (d.tab) { state.bestTab = d.tab; document.querySelectorAll("#bestTabs button").forEach(b => { const on = b.dataset.tab === d.tab; b.classList.toggle("on", on); b.setAttribute("aria-selected", on); }); renderBest(); }
  else if (d.market) { state.market = d.market; document.querySelectorAll("#marketChips .chip").forEach(c => { const on = c.dataset.market === d.market; c.classList.toggle("on", on); c.setAttribute("aria-pressed", on); }); renderSections(); }
  else if (d.toggle) { const c = !state.collapsed.has(d.toggle); c ? state.collapsed.add(d.toggle) : state.collapsed.delete(d.toggle); setCollapsed(d.toggle, c); }
  else if (d.expand) { const c = d.expand !== "all"; state.collapsed = c ? new Set(GAMES.map(g => g.id)) : new Set(); GAMES.forEach(g => setCollapsed(g.id, c)); }
  else if (d.clear) { state.q = ""; state.market = "ALL"; state.onlyValue = false; state.hideFlagged = false; render(); }
  else if (d.goto) {
    state.collapsed.delete(d.goto); state.q = ""; state.market = "ALL"; state.onlyValue = false; state.hideFlagged = false;
    go("props");
    const el = $("game-" + d.goto); if (el) el.scrollIntoView({behavior:"smooth", block:"start"});
  }
});
document.addEventListener("submit", e => { const f = e.target.closest("[data-priceform]"); if (f) { e.preventDefault(); savePrice(+f.dataset.priceform); } });
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.closest && e.target.closest("[data-priceform]")) { e.preventDefault(); savePrice(+e.target.closest("[data-priceform]").dataset.priceform); return; }
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test((e.target.tagName || ""));
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("tr[data-goto]")) { e.preventDefault(); e.target.click(); return; }
  if (e.key === "Escape" && state.drawerOpen) { e.preventDefault(); closeDrawer(); return; }
  if (e.key === "Tab" && state.drawerOpen) {           // keep keyboard focus inside the open panel
    const f = [...$("drawer").querySelectorAll("button, [href], input, select, [tabindex]:not([tabindex='-1'])")].filter(el => !el.disabled);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    return;
  }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "/") { if (state.view !== "props") go("props"); e.preventDefault(); setTimeout(() => $("q") && $("q").focus(), 30); }
  else if (e.key === "?") { e.preventDefault(); openHelp(); }
});

$("brandSlot").outerHTML = `<button class="brand" data-nav="dashboard" aria-label="swish — go to home">
      <span class="logo"><span class="wordmark">${"swish".split("").map((c,i)=>`<i style="--d:${i}">${c}</i>`).join("")}</span><span class="bball"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="9.2" fill="#e2661f"/><circle cx="10" cy="10" r="9.2" fill="none" stroke="#7a2e0c" stroke-width=".8"/><path d="M.8 10h18.4M10 .8v18.4M3.6 3.4c3.6 3.2 3.6 10 0 13.2M16.4 3.4c-3.6 3.2-3.6 10 0 13.2" fill="none" stroke="#3a1606" stroke-width="1"/><ellipse cx="7" cy="6" rx="2.6" ry="1.6" fill="#fff" opacity=".22"/></svg></span><svg class="hoop" viewBox="0 0 30 34" aria-hidden="true"><path class="board" d="M6 1.5h18"/><path class="arm" d="M15 1.5v4"/><g class="net"><path d="M5.5 8.5 8.5 22M10.5 9.6 11.6 23M15 10 15 23.5M19.5 9.6 18.4 23M24.5 8.5 21.5 22"/><path d="M6.6 13h16.8M7.6 17.4h14.8M8.6 21.6h12.8"/></g><ellipse class="rim" cx="15" cy="8" rx="10" ry="2.4"/></svg><span class="fx" aria-hidden="true"><i class="flash" style="--x:-8px;--y:-6px;--t:0s;--s:1"></i><i class="flash" style="--x:30px;--y:-12px;--t:0.14s;--s:0.8"></i><i class="flash" style="--x:74px;--y:-14px;--t:0.06s;--s:1.1"></i><i class="flash" style="--x:112px;--y:-4px;--t:0.22s;--s:0.85"></i><i class="flash" style="--x:12px;--y:30px;--t:0.3s;--s:0.75"></i><i class="flash" style="--x:96px;--y:32px;--t:0.18s;--s:0.95"></i><i class="flash" style="--x:138px;--y:18px;--t:0.34s;--s:0.7"></i></span></span>
      <small>NBA PROP ANALYTICS</small>
      <span class="crowd" aria-hidden="true"><i style="--i:0;--h:0"></i><i style="--i:1;--h:3"></i><i style="--i:2;--h:1"></i><i style="--i:3;--h:4"></i><i style="--i:4;--h:0"></i><i style="--i:5;--h:2"></i><i style="--i:6;--h:5"></i><i style="--i:7;--h:1"></i><i style="--i:8;--h:3"></i><i style="--i:9;--h:0"></i><i style="--i:10;--h:4"></i><i style="--i:11;--h:2"></i></span>
    </button>`;
/* Logo: one eased arc into the hoop; every make sets off flashes + a crowd cheer; loops while hovered */
(function(){
  const brand = document.querySelector(".brand"), logo = brand.querySelector(".logo"), ball = logo.querySelector(".bball"), rim = logo.querySelector(".hoop .rim");
  const reduced = () => document.documentElement.classList.contains("calm") || matchMedia("(prefers-reduced-motion: reduce)").matches;
  const SHOT_MS = 1200, GAP_MS = 700;

  let engaged = false, loopTimer = null, scoreTimer = null;
  function shoot(){
    if (logo.classList.contains("shoot") || reduced()) return;
    const L = logo.getBoundingClientRect(), R = rim.getBoundingClientRect(), z = L.width / logo.offsetWidth || 1;
    const cx = (R.left + R.width/2 - L.left) / z, cy = (R.top + R.height/2 - L.top) / z;
    ball.style.offsetPath = `path("M ${cx-118} ${cy+36} C ${cx-80} ${cy-56}, ${cx+1} ${cy-54}, ${cx} ${cy+38}")`;
    logo.classList.add("shoot");
    clearTimeout(scoreTimer);
    scoreTimer = setTimeout(() => {               // ball drops through the net → celebrate
      brand.classList.remove("score"); void brand.offsetWidth; brand.classList.add("score");
      setTimeout(() => brand.classList.remove("score"), 1500);
    }, SHOT_MS * 0.74);
  }
  const start = () => { engaged = true; clearTimeout(loopTimer); shoot(); };
  const stop  = () => { engaged = false; clearTimeout(loopTimer); };
  brand.addEventListener("mouseenter", start);
  brand.addEventListener("mouseleave", stop);
  brand.addEventListener("focus", start);
  brand.addEventListener("blur", stop);
  ball.addEventListener("animationend", e => {
    if (e.animationName !== "shotPath") return;
    logo.classList.remove("shoot");
    if (engaged) loopTimer = setTimeout(shoot, GAP_MS);
  });
})();
/* ---- Home header: live clock, next tip-off countdown, rotating tips, count-ups ---- */
const pad = n => String(n).padStart(2, "0");
let tipIdx = 0;
function tickClock(){
  const hm = $("ccHM"); if (!hm) return;
  const now = new Date();
  hm.innerHTML = `${pad(now.getHours())}<span class="colon">:</span>${pad(now.getMinutes())}`;
  $("ccS").textContent = pad(now.getSeconds());
  const tz = (Intl.DateTimeFormat().resolvedOptions().timeZone || "").split("/").pop().replace(/_/g, " ");
  $("ccZone").textContent = tz;
  const seg = Math.floor(now.getSeconds() / 5);
  document.querySelectorAll(".cc-bar i").forEach(el => el.classList.toggle("on", +el.dataset.seg <= seg));
  const next = GAMES.find(g => new Date(g.tipoff) > now);
  if (next){
    let d = Math.floor((new Date(next.tipoff) - now) / 1000);
    const h = Math.floor(d / 3600), m = Math.floor(d % 3600 / 60), sc = d % 60;
    $("ccGame").innerHTML = `${tid(next.away,"xs")}${next.away} @ ${tid(next.home,"xs")}${next.home}`;
    $("ccCount").textContent = h ? `${h}h ${pad(m)}m ${pad(sc)}s` : `${pad(m)}m ${pad(sc)}s`;
    $("ccCount").classList.toggle("soon", d < 3600);
  } else {
    $("ccGame").textContent = IS_LIVE ? DATA.meta.slateLabel : "Sample slate";
    $("ccCount").textContent = "All tipped off";
  }
}
function rotateTip(){
  const el = $("tipText"); if (!el) return;
  el.classList.add("out");
  setTimeout(() => { tipIdx = (tipIdx + 1) % TIPS.length; el.textContent = TIPS[tipIdx]; el.classList.remove("out"); }, 380);
}
function countUp(){
  const calm = document.documentElement.classList.contains("calm") || matchMedia("(prefers-reduced-motion: reduce)").matches;
  document.querySelectorAll("[data-count]").forEach(el => {
    const target = +el.dataset.count; if (calm || !target) { el.textContent = target; return; }
    const t0 = performance.now(), dur = 900;
    const step = t => { const k = Math.min(1, (t - t0) / dur), e = k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2) / 2; el.textContent = Math.round(target * e); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
setInterval(tickClock, 1000);
setInterval(() => { if (!document.hidden && !document.documentElement.classList.contains("calm")) rotateTip(); }, 6000);
render();
</script>
